name = "where-not-rain-read"
compatibility_date = "2025-07-01"
main = "./dist/index.js"

[[d1_databases]]
binding = "DB"
database_name = "wnr-weather"
database_id = "c822f407-c62c-438c-94f6-345a57122827"

# Preview data is public, read-only and isolated from production. Wildcard CORS is
# intentional here so numbered Cloudflare Pages PR aliases can exercise the product.
[env.preview]
vars = { WEB_ORIGIN = "*" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "wnr-weather-preview"
database_id = "2f3b76f0-e0e2-4a5a-bcb5-c4b233c56afe"

# Production remains restricted to the canonical customer-facing origin.
[env.production]
vars = { WEB_ORIGIN = "https://868656.xyz" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "wnr-weather"
database_id = "c822f407-c62c-438c-94f6-345a57122827"
