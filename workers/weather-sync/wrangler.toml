# Cloudflare Worker — Where Not Rain weather-sync (PRD-INC-001 / 002 / 005).
#
# Free-plan-safe: D1 + KV + Cron only (no R2 / DO / Queues / Queues). The worker is a
# complementary background sync engine; the static Pages site remains the primary
# delivery (DEP-PAGES-001 / DEP-FREE-001).
#
# ONE-TIME MANUAL PREREQUISITE — DONE (2026-07-23): D1 (wnr-weather / wnr-weather-preview) and
# KV (wnr-weather-sync prod+preview) namespaces created; IDs pasted below. No further action needed
# here. CI applies 0001_weather.sql and deploys via .github/workflows/deploy.yml.

name = "where-not-rain-sync"
compatibility_date = "2025-07-01"
# Built by `pnpm --filter @wnr/weather-sync build` (tsc -> dist) before `wrangler deploy`.
main = "./dist/index.js"

# --- D1 (weather snapshots; canonical schema in packages/db/migrations/0001_weather.sql) ---
# NOTE: CI applies ONLY 0001_weather.sql — there is NO 0002 migration this phase.
[[d1_databases]]
binding = "DB"
database_name = "wnr-weather"
migrations_dir = "../../packages/db/migrations"
# Production D1 database id (paste from `wrangler d1 create wnr-weather --env production`).
database_id = "c822f407-c62c-438c-94f6-345a57122827"

# --- KV (sync-health signal; preview and production are ISOLATED namespaces) ---
[[kv_namespaces]]
binding = "WEATHER_SYNC_KV"
# Production KV namespace id (paste from `wrangler kv namespace create wnr-weather-sync --env production`).
id = "e64e70b675e146b09cf5ef8e0d545968"
# Preview KV namespace id (paste from `wrangler kv namespace create wnr-weather-sync --env preview`).
preview_id = "0e6b63643dc44a9eb0ccc809f6a82043"

# ---------------------------------------------------------------------------
# Preview environment — isolated D1 DB, and NO scheduled (Cron) trigger.
# ---------------------------------------------------------------------------
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "wnr-weather-preview"
migrations_dir = "../../packages/db/migrations"
# Preview D1 database id (created: wnr-weather-preview).
database_id = "2f3b76f0-e0e2-4a5a-bcb5-c4b233c56afe"

# ---------------------------------------------------------------------------
# Production environment — hourly Cron registered HERE ONLY (DEP-CICD-001).
# Inherits the top-level D1/KV bindings above.
# ---------------------------------------------------------------------------
[env.production]
crons = ["0 * * * *"]
