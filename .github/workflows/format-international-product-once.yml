name: Format international product once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch exact optional types, format and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/trips/workspace.ts')
          content = path.read_text()
          content = content.replace('readonly title?: string;', 'readonly title?: string | undefined;')
          path.write_text(content)
          PY
          pnpm format
          rm .github/workflows/format-international-product-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(trips): format international product launch"
          git push origin HEAD:main
