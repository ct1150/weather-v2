name: Phase 8 hourly read fix once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase8-hourly-read-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/adaptive-replanning-phase8'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-replanning-phase8
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded trip-hourly API
        run: python tooling/phase8-hourly-read-patch.py
      - name: Format and run weather-read tests
        run: |
          pnpm exec prettier --write workers/weather-read/src/index.ts workers/weather-read/src/hourly.test.ts docs/superpowers/plans/2026-08-09-adaptive-replanning-phase8.md
          pnpm --filter @wnr/weather-read test
      - name: Commit Slice A implementation and remove helpers
        run: |
          rm .github/workflows/phase8-hourly-read-fix-once.yml
          rm tooling/phase8-hourly-read-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(replan): expose bounded trip hourly weather"
          git push origin HEAD:feature/adaptive-replanning-phase8
