name: Phase 8 final format once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase8-final-format
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/adaptive-replanning-phase8'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-replanning-phase8
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final Phase 8 files
        run: |
          pnpm exec prettier --write \
            tooling/deploy/adaptive-replanning-smoke.mjs \
            .github/workflows/verify-adaptive-replanning.yml
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/phase8-final-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(replan): format final Phase 8 verification"
          git push origin HEAD:feature/adaptive-replanning-phase8
