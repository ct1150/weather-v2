name: Format weather provider test once

on:
  push:
    branches:
      - fix/weather-sync-provider-binding
    paths:
      - .github/workflows/format-weather-provider-test-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-sync-provider-binding
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write workers/weather-sync/src/index.test.ts
      - name: Commit formatted test only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/weather-sync/src/index.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(weather): format provider tests"
          git push origin HEAD:fix/weather-sync-provider-binding
