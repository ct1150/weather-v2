name: Format rain-free copy changes

on:
  push:
    branches: [copy/rain-free-language]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/rain-free-language
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/InstantCountryWeatherExplorer.tsx apps/web/src/components/country-weather-explorer.test.tsx
      - run: |
          git rm .github/workflows/format-rain-free-copy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/InstantCountryWeatherExplorer.tsx apps/web/src/components/country-weather-explorer.test.tsx
          git commit -m "style: format rain-free copy"
          git push origin HEAD:copy/rain-free-language
