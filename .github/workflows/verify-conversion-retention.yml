name: Verify conversion and retention

on:
  pull_request:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: phase9-conversion-retention-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Phase 9 test dependencies
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
      - name: Verify Phase 9 trust contracts
        run: |
          pnpm --filter @wnr/analytics exec vitest run \
            src/affiliate-adapter.test.ts \
            src/contextual-conversion.test.ts \
            src/funnel-events.test.ts
          pnpm --filter @wnr/domain exec vitest run \
            src/notification-readiness.test.ts \
            src/product-entitlements.test.ts
          pnpm --filter @wnr/web exec vitest run \
            src/analytics/browser-events.test.ts \
            src/commercial/contextual-affiliate.test.ts \
            src/components/phase9-commercial-surface-contract.test.ts
      - name: Wait for Phase 9 Preview pages
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --location \
              "https://${PR_NUMBER}.where-not-rain.pages.dev/discover" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Phase 9 Preview pages did not become ready"
          exit 1
      - name: Verify Phase 9 Preview zero-fill deployment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node tooling/deploy/conversion-retention-live-smoke.mjs \
            --site-url "https://${PR_NUMBER}.where-not-rain.pages.dev"

  production:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Phase 9 test dependencies
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
      - name: Verify Phase 9 production trust contracts
        run: |
          pnpm --filter @wnr/analytics exec vitest run \
            src/affiliate-adapter.test.ts \
            src/contextual-conversion.test.ts \
            src/funnel-events.test.ts
          pnpm --filter @wnr/domain exec vitest run \
            src/notification-readiness.test.ts \
            src/product-entitlements.test.ts
          pnpm --filter @wnr/web exec vitest run \
            src/analytics/browser-events.test.ts \
            src/commercial/contextual-affiliate.test.ts \
            src/components/phase9-commercial-surface-contract.test.ts
      - name: Verify Phase 9 Production zero-fill deployment
        run: |
          node tooling/deploy/conversion-retention-live-smoke.mjs \
            --site-url "https://868656.xyz"
      - name: Record Phase 9 production verification
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > PHASE9_CONVERSION_RETENTION_SMOKE_STATUS.md <<EOF
          # Phase 9 Conversion & Retention smoke status

          - Conclusion: success
          - Deploy head SHA: ${DEPLOY_HEAD_SHA}
          - Deploy run: ${DEPLOY_RUN_URL}
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Checks

          - decision-first contextual commercial resolver: success
          - Affiliate HTTPS host/path allowlist and kill-switch/no-fill controls: success
          - commercial-to-weather/replan separation contract: success
          - aggregate funnel analytics allowlist/privacy gates: success
          - Affiliate impression/click descriptors: success
          - notification readiness default-off/quiet-hours/rate-limit contract: success
          - candidate entitlement contract and billing-free boundary: success
          - English/Simplified Chinese/Traditional Chinese Discovery and Workspace routes: success
          - unconfigured production commercial UI zero-fill: success
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE9_CONVERSION_RETENTION_SMOKE_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(smoke): record phase 9 conversion retention verification [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
