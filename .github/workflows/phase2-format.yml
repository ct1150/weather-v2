name: Phase 2 patch and format once

on:
  push:
    branches:
      - feature/cloud-trip-phase2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Phase 2 data-integrity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:80]!r}")
              file.write_text(text.replace(old, new, count))

          # A new trip must never inherit the currently-open cloud trip association.
          replace(
              "apps/web/src/components/MyTripsDashboard.tsx",
              '<a className="trip-primary-button" href={workspacePath(locale)}>\n            {copy.newTrip}\n          </a>',
              '<a className="trip-primary-button" href={`${workspacePath(locale)}?new=1`}>\n            {copy.newTrip}\n          </a>',
          )
          replace(
              "apps/web/src/components/MyTripsDashboard.tsx",
              '<h1 className="mt-2 text-3xl font-bold tracking-[-0.035em] text-foreground">\n            {copy.title}\n          </h1>',
              '<h2 className="mt-2 text-3xl font-bold tracking-[-0.035em] text-foreground">\n            {copy.title}\n          </h2>',
          )

          # Detach only when an imported trip is actually created.
          replace(
              "apps/web/src/components/TripImportForm.tsx",
              'import { parseTripMarkdown } from "../trips/markdown-parser";\n',
              'import { clearCloudMetadata } from "../trips/cloud-sync";\nimport { parseTripMarkdown } from "../trips/markdown-parser";\n',
          )
          replace(
              "apps/web/src/components/TripImportForm.tsx",
              '    const workspace = createWorkspaceFromParsed(parsed, { title: copy.title });\n    window.localStorage.setItem(TRIP_WORKSPACE_STORAGE_KEY, JSON.stringify(workspace));',
              '    const workspace = createWorkspaceFromParsed(parsed, { title: copy.title });\n    clearCloudMetadata();\n    window.localStorage.setItem(TRIP_WORKSPACE_STORAGE_KEY, JSON.stringify(workspace));',
          )

          # Localized workspace: explicit new/template/share sources are independent trips.
          replace(
              "apps/web/src/components/LocalizedTripWorkspace.tsx",
              'import {\n  TRIP_SHARE_HASH_KEY,',
              'import { clearCloudMetadata } from "../trips/cloud-sync";\nimport {\n  TRIP_SHARE_HASH_KEY,',
          )
          replace(
              "apps/web/src/components/LocalizedTripWorkspace.tsx",
              '  const copy = COPY[locale];\n  const hash = new URLSearchParams(window.location.hash.replace(/^#/u, ""));',
              '  const copy = COPY[locale];\n  const search = new URLSearchParams(window.location.search);\n  if (search.get("new") === "1") {\n    clearCloudMetadata();\n    window.localStorage.removeItem(TRIP_WORKSPACE_STORAGE_KEY);\n    return createBlankWorkspace({ title: copy.blankTitle });\n  }\n  const hash = new URLSearchParams(window.location.hash.replace(/^#/u, ""));',
          )
          replace(
              "apps/web/src/components/LocalizedTripWorkspace.tsx",
              '    if (decoded !== null) return localizeWorkspace(decoded, locale);',
              '    if (decoded !== null) {\n      clearCloudMetadata();\n      return localizeWorkspace(decoded, locale);\n    }',
          )
          replace(
              "apps/web/src/components/LocalizedTripWorkspace.tsx",
              '  const templateId = new URLSearchParams(window.location.search).get("template");\n  if (isTemplateId(templateId)) {\n    return localizeWorkspace(',
              '  const templateId = search.get("template");\n  if (isTemplateId(templateId)) {\n    clearCloudMetadata();\n    return localizeWorkspace(',
          )
          replace(
              "apps/web/src/components/LocalizedTripWorkspace.tsx",
              '      const next = localizeWorkspace(\n        createWorkspaceFromTemplate(templateId, workspaceLocale),\n        locale,\n      );\n      setWorkspace(next);',
              '      const next = localizeWorkspace(\n        createWorkspaceFromTemplate(templateId, workspaceLocale),\n        locale,\n      );\n      clearCloudMetadata();\n      setWorkspace(next);',
          )
          replace(
              "apps/web/src/components/LocalizedTripWorkspace.tsx",
              '    const next = createBlankWorkspace({ title: copy.blankTitle });\n    setWorkspace(next);',
              '    const next = createBlankWorkspace({ title: copy.blankTitle });\n    clearCloudMetadata();\n    setWorkspace(next);',
          )

          # Simplified workspace supports explicit new/share detachment too.
          replace(
              "apps/web/src/components/TripWorkspace.tsx",
              'import {\n  TRIP_SHARE_HASH_KEY,',
              'import { clearCloudMetadata } from "../trips/cloud-sync";\nimport {\n  TRIP_SHARE_HASH_KEY,',
          )
          replace(
              "apps/web/src/components/TripWorkspace.tsx",
              'function loadInitialWorkspace(): TripWorkspace {\n  const hash = new URLSearchParams(window.location.hash.replace(/^#/u, ""));',
              'function loadInitialWorkspace(): TripWorkspace {\n  const search = new URLSearchParams(window.location.search);\n  if (search.get("new") === "1") {\n    clearCloudMetadata();\n    window.localStorage.removeItem(TRIP_WORKSPACE_STORAGE_KEY);\n    return createBlankWorkspace();\n  }\n  const hash = new URLSearchParams(window.location.hash.replace(/^#/u, ""));',
          )
          replace(
              "apps/web/src/components/TripWorkspace.tsx",
              '    if (decoded !== null) return decoded;',
              '    if (decoded !== null) {\n      clearCloudMetadata();\n      return decoded;\n    }',
          )
          duplicate = '      <CloudTripControls locale="zh-cn" workspace={workspace} onRemoteWorkspace={setWorkspace} />\n\n'
          trip_workspace = Path("apps/web/src/components/TripWorkspace.tsx")
          text = trip_workspace.read_text()
          if text.count(duplicate) != 4:
              raise SystemExit(f"TripWorkspace: expected 4 duplicated cloud controls, found {text.count(duplicate)}")
          trip_workspace.write_text(text.replace(duplicate * 4, duplicate, 1))

          # Hero Build CTAs are explicit new trips; template links detach in workspace loader.
          for path, href in [
              ("apps/web/src/app/trips/page.tsx", "/trips/workspace"),
              ("apps/web/src/app/zh-cn/trips/page.tsx", "/zh-cn/trips/workspace"),
              ("apps/web/src/app/zh-hant/trips/page.tsx", "/zh-hant/trips/workspace"),
          ]:
              replace(path, f'href="{href}"', f'href="{href}?new=1"', 1)
          PY
      - name: Format Phase 2 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/components/cloud-trip-phase2-contract.test.ts \
            apps/web/src/components/MyTripsDashboard.tsx \
            apps/web/src/components/SharedTripViewer.tsx \
            apps/web/src/components/TripImportForm.tsx \
            apps/web/src/components/LocalizedTripWorkspace.tsx \
            apps/web/src/components/TripWorkspace.tsx \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/phase2.test.ts \
            workers/trip-api/src/sharing.ts \
            workers/trip-api/src/status.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/components/cloud-trip-phase2-contract.test.ts \
            apps/web/src/components/MyTripsDashboard.tsx \
            apps/web/src/components/SharedTripViewer.tsx \
            apps/web/src/components/TripImportForm.tsx \
            apps/web/src/components/LocalizedTripWorkspace.tsx \
            apps/web/src/components/TripWorkspace.tsx \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/phase2.test.ts \
            workers/trip-api/src/sharing.ts \
            workers/trip-api/src/status.test.ts
          git commit -m "fix(cloud-trip): detach new trips from current cloud record [skip ci]"
          git push origin HEAD:feature/cloud-trip-phase2
