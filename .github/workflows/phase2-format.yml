name: Phase 2 format once

on:
  push:
    branches:
      - feature/cloud-trip-phase2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 2 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/components/cloud-trip-phase2-contract.test.ts \
            apps/web/src/components/MyTripsDashboard.tsx \
            apps/web/src/components/SharedTripViewer.tsx \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/phase2.test.ts \
            workers/trip-api/src/sharing.ts \
            workers/trip-api/src/status.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/components/cloud-trip-phase2-contract.test.ts \
            apps/web/src/components/MyTripsDashboard.tsx \
            apps/web/src/components/SharedTripViewer.tsx \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/phase2.test.ts \
            workers/trip-api/src/sharing.ts \
            workers/trip-api/src/status.test.ts
          git commit -m "style(cloud-trip): format phase 2 files [skip ci]"
          git push origin HEAD:feature/cloud-trip-phase2
