name: Phase 3 smoke format once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  format:
    if: "github.event.issue.title == 'internal: phase3 smoke format'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write workers/trip-api/src/phase3-health.test.ts tooling/deploy/trip-collaboration-smoke.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/trip-api/src/phase3-health.test.ts tooling/deploy/trip-collaboration-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(cloud-trip): format phase 3 smoke files [skip ci]"
            git push origin HEAD:feature/cloud-trip-phase3
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Phase 3 smoke formatter completed.' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned' });
