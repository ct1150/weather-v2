name: Phase 3 integrity patch once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: "github.event.issue.title == 'internal: phase3 integrity patch'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply integrity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count))

          replace(
              "apps/web/src/components/CloudTripControls.tsx",
              '          if (remote.version > localMetadata.lastSyncedVersion) {\n            persistRemote(remote);\n          }',
              '          if (remote.accessRole === "viewer" || remote.version > localMetadata.lastSyncedVersion) {\n            persistRemote(remote);\n          }',
          )
          replace(
              "apps/web/src/components/CloudTripControls.tsx",
              '  }, [accessRole, applyAccessRole, locale, metadata, signedInEmail, syncState, workspace]);\n\n  const saveToCloud',
              '  }, [accessRole, applyAccessRole, locale, metadata, signedInEmail, syncState, workspace]);\n\n  useEffect(() => {\n    if (accessRole !== "viewer" || metadata === null) return;\n    if (sameDocument(workspace, metadata.localDocument)) return;\n    onRemoteWorkspace(normalizeWorkspace(metadata.localDocument));\n  }, [accessRole, metadata, onRemoteWorkspace, workspace]);\n\n  const saveToCloud',
          )
          replace(
              "workers/trip-api/src/store.ts",
              '          "WHERE id = ? AND deleted_at IS NULL AND version = ? AND updated_at = ?",',
              '          "WHERE id = ? AND deleted_at IS NULL AND version = ? AND updated_at = ? " +\n          "AND NOT EXISTS (SELECT 1 FROM trip_revisions r WHERE r.trip_id = trips.id AND r.version = trips.version)",',
          )

          test = Path("workers/trip-api/src/phase3.test.ts")
          text = test.read_text()
          text = text.replace('${encodeURIComponent(editorUserId)}', '${editorUserId}')
          test.write_text(text)
          PY
      - name: Format patched files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/CloudTripControls.tsx \
            workers/trip-api/src/store.ts \
            workers/trip-api/src/phase3.test.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/CloudTripControls.tsx \
            workers/trip-api/src/store.ts \
            workers/trip-api/src/phase3.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(cloud-trip): harden viewer and revision integrity [skip ci]"
            git push origin HEAD:feature/cloud-trip-phase3
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Phase 3 integrity patch completed.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
