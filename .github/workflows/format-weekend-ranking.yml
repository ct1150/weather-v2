name: Format weekend ranking helper

on:
  push:
    branches: [seo/best-weekend]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/best-weekend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Format and self-delete
        run: |
          pnpm exec prettier --write apps/web/src/seo/weekly-weather-ranking.ts
          rm .github/workflows/format-weekend-ranking.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format weekend ranking helper"
          git push origin HEAD:seo/best-weekend
