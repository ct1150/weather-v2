name: Apply UX phase 1 codemod once

on:
  push:
    branches: [main]
    paths:
      - .github/ux-phase1-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply calendar-aware window codemod
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          bake = "apps/web/src/build/bake.ts"
          replace(
              bake,
              'import type { Locale, Window, Theme, LocalDate, ReasonCode } from "../api/v1/schemas";\n',
              'import type { Locale, Window, Theme, LocalDate, ReasonCode } from "../api/v1/schemas";\nimport { windowIndicesForDates } from "../weather/window-selection";\n',
          )
          replace(
              bake,
              '''const WINDOW_DAYS: Record<Window, ReadonlyArray<number>> = {\n  today: [0],\n  tomorrow: [1],\n  weekend: [5, 6],\n  next_week: [2, 3, 4],\n};\n''',
              '''const WINDOW_ORDER: ReadonlyArray<Window> = ["today", "tomorrow", "weekend", "next_week"];\n''',
          )
          replace(
              bake,
              '''export function buildWindowControls(\n  dataset: BakedDataset,\n  _config: BuildConfig,\n  selected: Window,\n): ReadonlyArray<WindowControl> {\n  const firstCity = dataset.cities[0];\n  return (Object.keys(WINDOW_DAYS) as Window[]).map((window) => {\n    const exactDates = firstCity\n      ? WINDOW_DAYS[window]\n          .map((i) => firstCity.forecast.days[i]?.localDate ?? null)\n          .filter((d): d is LocalDate => d !== null)\n          .map(shortDate)\n      : [];\n    return {\n      window,\n      label: WINDOW_LABELS[window],\n      href: `/?window=${window}`,\n      selected: window === selected,\n      exactDates,\n    };\n  });\n}\n''',
              '''export function buildWindowControls(\n  dataset: BakedDataset,\n  _config: BuildConfig,\n  selected: Window,\n): ReadonlyArray<WindowControl> {\n  const firstCity = dataset.cities[0];\n  const dates = firstCity?.forecast.days.map((day) => day.localDate) ?? [];\n  return WINDOW_ORDER.map((window) => {\n    const exactDates = windowIndicesForDates(dates, window)\n      .map((index) => dates[index] ?? null)\n      .filter((date): date is LocalDate => date !== null)\n      .map(shortDate);\n    return {\n      window,\n      label: WINDOW_LABELS[window],\n      href: `/?window=${window}`,\n      selected: window === selected,\n      exactDates,\n    };\n  });\n}\n''',
          )
          replace(
              bake,
              '''export function projectHome(\n  dataset: BakedDataset,\n  config: BuildConfig,\n  window: Window,\n): TravelRadarViewModel {\n  const dayIndices = WINDOW_DAYS[window];\n  const primaryDayIndex = dayIndices[0] ?? 0;\n\n  const cards: DestinationCardViewModel[] = [];\n  for (const baked of dataset.cities) {\n    if (!baked.city.isFeatured) continue;\n    const day = baked.forecast.days[primaryDayIndex] ?? baked.forecast.days[0];\n    if (day === undefined) continue;\n    const score = computeCityScore(day, config.modelVersion);\n    cards.push({\n      destination: destinationLink(baked.city, baked.country, config.defaultLocale),\n      score: scoreViewModel(score),\n      weather: weatherSummary(day),\n      reasonCodes: score.reasonCodes as ReadonlyArray<ReasonCode>,\n    });\n  }\n\n  const includedDates: LocalDate[] = dataset.cities[0]\n    ? dayIndices\n        .map((i) => dataset.cities[0]?.forecast.days[i]?.localDate ?? null)\n        .filter((d): d is LocalDate => d !== null)\n    : [];\n\n  return {\n    window,\n    includedDates,\n    cards,\n    freshness: freshness(dataset, config),\n    state: "ready",\n  };\n}\n''',
              '''export function projectHome(\n  dataset: BakedDataset,\n  config: BuildConfig,\n  window: Window,\n): TravelRadarViewModel {\n  const cards: DestinationCardViewModel[] = [];\n  for (const baked of dataset.cities) {\n    if (!baked.city.isFeatured) continue;\n    const localDates = baked.forecast.days.map((day) => day.localDate);\n    const primaryDayIndex = windowIndicesForDates(localDates, window)[0];\n    if (primaryDayIndex === undefined) continue;\n    const day = baked.forecast.days[primaryDayIndex];\n    if (day === undefined) continue;\n    const score = computeCityScore(day, config.modelVersion);\n    cards.push({\n      destination: destinationLink(baked.city, baked.country, config.defaultLocale),\n      score: scoreViewModel(score),\n      weather: weatherSummary(day),\n      reasonCodes: score.reasonCodes as ReadonlyArray<ReasonCode>,\n    });\n  }\n\n  const firstCity = dataset.cities[0];\n  const referenceDates = firstCity?.forecast.days.map((day) => day.localDate) ?? [];\n  const includedDates: LocalDate[] = windowIndicesForDates(referenceDates, window)\n    .map((index) => referenceDates[index] ?? null)\n    .filter((date): date is LocalDate => date !== null);\n\n  return {\n    window,\n    includedDates,\n    cards,\n    freshness: freshness(dataset, config),\n    state: cards.length > 0 ? "ready" : "empty",\n  };\n}\n''',
          )
          replace(
              bake,
              '''export function projectHomeMapMarkers(\n  dataset: BakedDataset,\n  config: BuildConfig,\n  window: Window = "today",\n): ReadonlyArray<ExplorerMapMarker> {\n  const primaryDayIndex = WINDOW_DAYS[window][0] ?? 0;\n  return dataset.cities\n    .filter((b) => b.city.isFeatured)\n    .map((b) => {\n      const day = b.forecast.days[primaryDayIndex] ?? b.forecast.days[0];\n      const score = day === undefined ? null : computeCityScore(day, config.modelVersion);\n      return {\n        id: b.city.id,\n        latitude: b.city.latitude,\n        longitude: b.city.longitude,\n        label: b.city.name[config.defaultLocale] ?? b.city.name.en,\n        path: `/${b.country.slug}/${b.city.slug}`,\n        score: score === null || score.hidden ? null : score.score,\n        theme: "general",\n      } satisfies ExplorerMapMarker;\n    });\n}\n''',
              '''export function projectHomeMapMarkers(\n  dataset: BakedDataset,\n  config: BuildConfig,\n  window: Window = "today",\n): ReadonlyArray<ExplorerMapMarker> {\n  return dataset.cities\n    .filter((b) => b.city.isFeatured)\n    .flatMap((b) => {\n      const localDates = b.forecast.days.map((day) => day.localDate);\n      const primaryDayIndex = windowIndicesForDates(localDates, window)[0];\n      if (primaryDayIndex === undefined) return [];\n      const day = b.forecast.days[primaryDayIndex];\n      const score = day === undefined ? null : computeCityScore(day, config.modelVersion);\n      return [\n        {\n          id: b.city.id,\n          latitude: b.city.latitude,\n          longitude: b.city.longitude,\n          label: b.city.name[config.defaultLocale] ?? b.city.name.en,\n          path: `/${b.country.slug}/${b.city.slug}`,\n          score: score === null || score.hidden ? null : score.score,\n          theme: "general",\n        } satisfies ExplorerMapMarker,\n      ];\n    });\n}\n''',
          )

          explorer = "apps/web/src/components/CountryWeatherExplorer.tsx"
          replace(
              explorer,
              'import type { Window } from "../api/v1/schemas";\nimport { MAPLIBRE_STYLE_URL } from "./ExplorerMap";\n',
              'import type { Window } from "../api/v1/schemas";\nimport { windowIndicesForDates } from "../weather/window-selection";\nimport { MAPLIBRE_STYLE_URL } from "./ExplorerMap";\n',
          )
          replace(
              explorer,
              '''const WINDOW_INDICES: Readonly<Record<Window, ReadonlyArray<number>>> = {\n  today: [0],\n  tomorrow: [1],\n  weekend: [5, 6],\n  next_week: [2, 3, 4],\n};\n\n''',
              '',
          )
          replace(
              explorer,
              '''  const selectedIndices = useMemo(() => {\n    if (customRange === null) return WINDOW_INDICES[activeWindow];\n    return Array.from(\n      { length: customRange.end - customRange.start + 1 },\n      (_, index) => customRange.start + index,\n    );\n  }, [activeWindow, customRange]);\n''',
              '''  const selectedIndices = useMemo(() => {\n    if (customRange === null) {\n      return windowIndicesForDates(\n        (cities[0]?.days ?? []).map((day) => day.localDate),\n        activeWindow,\n      );\n    }\n    return Array.from(\n      { length: customRange.end - customRange.start + 1 },\n      (_, index) => customRange.start + index,\n    );\n  }, [activeWindow, cities, customRange]);\n''',
          )
          replace(
              explorer,
              '''  const summaries = useMemo(\n    () =>\n      cities\n''',
              '''  const summaries = useMemo(\n    () =>\n      selectedIndices.length === 0\n        ? []\n        : cities\n''',
          )
          replace(
              explorer,
              '''              const dates = rangeLabel(referenceDays(cities, WINDOW_INDICES[windowKind]), locale);\n''',
              '''              const dates = rangeLabel(\n                referenceDays(\n                  cities,\n                  windowIndicesForDates(\n                    (cities[0]?.days ?? []).map((day) => day.localDate),\n                    windowKind,\n                  ),\n                ),\n                locale,\n              );\n''',
          )

          traditional = "apps/web/src/components/TraditionalCountryWeatherExplorer.tsx"
          replace(
              traditional,
              'import type { Window } from "../api/v1/schemas";\nimport { toTraditionalText } from "../trips/traditional";\n',
              'import type { Window } from "../api/v1/schemas";\nimport { toTraditionalText } from "../trips/traditional";\nimport { windowIndicesForDates } from "../weather/window-selection";\n',
          )
          replace(
              traditional,
              '''const WINDOW_INDICES: Readonly<Record<Window, ReadonlyArray<number>>> = {\n  today: [0],\n  tomorrow: [1],\n  weekend: [5, 6],\n  next_week: [2, 3, 4],\n};\n\n''',
              '',
          )
          replace(
              traditional,
              '''  const selectedIndices = useMemo(() => {\n    if (customRange === null) return WINDOW_INDICES[activeWindow];\n    return Array.from(\n      { length: customRange.end - customRange.start + 1 },\n      (_, index) => customRange.start + index,\n    );\n  }, [activeWindow, customRange]);\n''',
              '''  const selectedIndices = useMemo(() => {\n    if (customRange === null) {\n      return windowIndicesForDates(\n        (cities[0]?.days ?? []).map((day) => day.localDate),\n        activeWindow,\n      );\n    }\n    return Array.from(\n      { length: customRange.end - customRange.start + 1 },\n      (_, index) => customRange.start + index,\n    );\n  }, [activeWindow, cities, customRange]);\n''',
          )
          replace(
              traditional,
              '''  const summaries = useMemo(\n    () =>\n      cities\n''',
              '''  const summaries = useMemo(\n    () =>\n      selectedIndices.length === 0\n        ? []\n        : cities\n''',
          )
          replace(
              traditional,
              '''                <small>{rangeLabel(referenceDays(cities, WINDOW_INDICES[windowKind]))}</small>\n''',
              '''                <small>\n                  {rangeLabel(\n                    referenceDays(\n                      cities,\n                      windowIndicesForDates(\n                        (cities[0]?.days ?? []).map((day) => day.localDate),\n                        windowKind,\n                      ),\n                    ),\n                  )}\n                </small>\n''',
          )
          PY

          pnpm exec prettier --write \
            apps/web/src/build/bake.ts \
            apps/web/src/components/CountryWeatherExplorer.tsx \
            apps/web/src/components/TraditionalCountryWeatherExplorer.tsx \
            apps/web/src/weather/window-selection.ts \
            apps/web/src/weather/window-selection.test.ts \
            apps/web/src/components/SiteHeader.tsx \
            apps/web/src/app/zh-cn/trips/page.tsx

      - name: Commit phase 1 codemod
        run: |
          rm .github/workflows/ux-phase1-codemod-once.yml .github/ux-phase1-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat(ux): complete navigation and calendar window phase [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
