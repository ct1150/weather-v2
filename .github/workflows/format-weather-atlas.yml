name: Format Weather Atlas

on:
  push:
    branches: [design/weather-atlas-ui]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/weather-atlas-ui

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format atlas files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/country-map-refinements.css \
            apps/web/src/components/frontend-design-contract.test.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/country-map-refinements.css apps/web/src/components/frontend-design-contract.test.ts
          git commit -m "style: format weather atlas frontend"
          git push origin HEAD:design/weather-atlas-ui
