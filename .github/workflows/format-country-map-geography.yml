name: Format country map geography fix

on:
  push:
    branches:
      - fix/country-map-marker-geography

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/country-map-marker-geography
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/CountryOutlineMap.tsx \
            apps/web/src/components/country-map-precision.test.ts \
            tooling/maps/generate-country-geometries.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/CountryOutlineMap.tsx \
            apps/web/src/components/country-map-precision.test.ts \
            tooling/maps/generate-country-geometries.mjs
          git commit -m "style: format country map geography fix"
          git push origin HEAD:fix/country-map-marker-geography
