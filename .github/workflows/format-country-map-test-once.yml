name: Format country-map test once

on:
  push:
    branches: [feat/country-weather-map-cutover]

permissions:
  contents: write

concurrency:
  group: format-country-map-test-once
  cancel-in-progress: false

jobs:
  format:
    if: contains(github.event.head_commit.message, 'chore: add one-time country-map test formatter')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/country-weather-map-cutover
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format destination page test
        run: pnpm exec prettier --write apps/web/src/app/destination-pages.test.ts

      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/destination-pages.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: format country-map destination test"
          git push origin HEAD:feat/country-weather-map-cutover
