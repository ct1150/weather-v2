name: Apply Human Copy Cleanup

on:
  push:
    branches: [ux/human-copy-cleanup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/human-copy-cleanup

      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply user-facing copy cleanup
        run: |
          python tooling/one-off/human-copy-cleanup.py
          pnpm exec prettier --write \
            apps/web/src/components/CountryMapHome.tsx \
            apps/web/src/components/InstantCountryWeatherExplorer.tsx \
            apps/web/src/components/ChineseCityWeatherPage.tsx \
            apps/web/src/components/TripPlannerDashboard.tsx \
            apps/web/src/components/TripWeatherIntelligencePanel.tsx \
            apps/web/src/components/StructuredActivityEditor.tsx \
            apps/web/src/components/SmartTripImportForm.tsx \
            apps/web/src/components/WeatherDiscoveryPlannerV2.tsx \
            apps/web/src/components/TripExecutionWorkspace.tsx \
            apps/web/src/app/trips/new/page.tsx \
            apps/web/src/app/zh-cn/trips/new/page.tsx \
            apps/web/src/app/zh-hant/trips/new/page.tsx

      - name: Commit copy changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src tooling/one-off/human-copy-cleanup.py
          if git diff --cached --quiet; then
            echo "No copy changes to commit"
            exit 0
          fi
          git commit -m "copy: replace model language with user language"
          git push origin HEAD:ux/human-copy-cleanup
