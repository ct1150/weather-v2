name: Generate CN Geometry

on:
  pull_request:
    types: [ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate simplified geometry
        run: node tooling/maps/generate-cn-geometry.mjs

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: cn-geometry-generated
          path: apps/web/src/components/country-map-cn.generated.ts
          if-no-files-found: error
