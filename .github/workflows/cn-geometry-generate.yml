name: Generate CN Geometry

on:
  pull_request:
    types: [ready_for_review, synchronize]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate simplified geometry
        run: node tooling/maps/generate-cn-geometry.mjs

      - name: Commit generated source when changed
        run: |
          if git diff --quiet -- apps/web/src/components/country-map-cn.generated.ts && git ls-files --error-unmatch apps/web/src/components/country-map-cn.generated.ts >/dev/null 2>&1; then
            echo "Generated geometry already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/components/country-map-cn.generated.ts
          git commit -m "chore: generate China map boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: cn-geometry-generated
          path: apps/web/src/components/country-map-cn.generated.ts
          if-no-files-found: error
