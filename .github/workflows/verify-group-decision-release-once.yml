name: Verify group decision release once

on:
  push:
    branches:
      - verify/group-decision-release
    paths:
      - .github/workflows/verify-group-decision-release-once.yml

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: d1cc3664781456d5272f26cf8d0c8055d73527a1
      SITE_URL: https://868656.xyz
      READ_URL: https://where-not-rain-read-production.ct1150.workers.dev
      TRIP_URL: https://trip.868656.xyz
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/group-decision-release

      - name: Wait for Deploy and Production Smoke, then verify production
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          api() {
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          wait_for_run() {
            workflow="$1"
            event="$2"
            target_sha="$3"
            after_time="${4:-}"
            for _attempt in $(seq 1 150); do
              runs="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=${event}&per_page=50" 2>/dev/null || true)"
              run_id="$(
                printf '%s' "$runs" | jq -r \
                  --arg sha "$target_sha" \
                  --arg after "$after_time" \
                  '[.workflow_runs[]? | select(.head_sha == $sha) | select(($after == "") or (.created_at >= $after))] | sort_by(.created_at) | reverse | .[0].id // empty'
              )"
              if [ -n "$run_id" ]; then
                printf '%s' "$run_id"
                return 0
              fi
              sleep 10
            done
            return 1
          }

          wait_for_completion() {
            run_id="$1"
            for _attempt in $(seq 1 210); do
              run_json="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" 2>/dev/null || true)"
              status="$(printf '%s' "$run_json" | jq -r '.status // empty')"
              if [ "$status" = "completed" ]; then
                printf '%s' "$run_json"
                return 0
              fi
              sleep 10
            done
            return 1
          }

          check_page() {
            name="$1"
            url="$2"
            output="$3"
            shift 3
            if ! curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 45 "$url" -o "$output"; then
              echo "page check failed: ${name}" >> /tmp/release-errors.txt
              return 1
            fi
            for text in "$@"; do
              if ! grep -Fq "$text" "$output"; then
                echo "${name} missing: ${text}" >> /tmp/release-errors.txt
                return 1
              fi
            done
          }

          overall=success
          deploy_id=""
          deploy_conclusion=not_found
          deploy_url=""
          deploy_created=""
          smoke_id=""
          smoke_conclusion=not_found
          smoke_url=""
          : > /tmp/release-errors.txt

          if deploy_id="$(wait_for_run deploy.yml push "$TARGET_SHA")"; then
            if deploy_json="$(wait_for_completion "$deploy_id")"; then
              deploy_conclusion="$(printf '%s' "$deploy_json" | jq -r '.conclusion // "unknown"')"
              deploy_url="$(printf '%s' "$deploy_json" | jq -r '.html_url // ""')"
              deploy_created="$(printf '%s' "$deploy_json" | jq -r '.created_at // ""')"
              if [ "$deploy_conclusion" != "success" ]; then
                overall=failure
                echo "Deploy concluded ${deploy_conclusion}" >> /tmp/release-errors.txt
              fi
            else
              overall=failure
              deploy_conclusion=timeout
              echo "Deploy did not complete" >> /tmp/release-errors.txt
            fi
          else
            overall=failure
            echo "Deploy run was not found for ${TARGET_SHA}" >> /tmp/release-errors.txt
          fi

          if [ "$deploy_conclusion" = "success" ]; then
            if smoke_id="$(wait_for_run production-smoke.yml workflow_run "$TARGET_SHA" "$deploy_created")"; then
              if smoke_json="$(wait_for_completion "$smoke_id")"; then
                smoke_conclusion="$(printf '%s' "$smoke_json" | jq -r '.conclusion // "unknown"')"
                smoke_url="$(printf '%s' "$smoke_json" | jq -r '.html_url // ""')"
                if [ "$smoke_conclusion" != "success" ]; then
                  overall=failure
                  echo "Production Smoke concluded ${smoke_conclusion}" >> /tmp/release-errors.txt
                fi
              else
                overall=failure
                smoke_conclusion=timeout
                echo "Production Smoke did not complete" >> /tmp/release-errors.txt
              fi
            else
              overall=failure
              echo "Production Smoke run was not found for ${TARGET_SHA}" >> /tmp/release-errors.txt
            fi
          fi

          if [ "$deploy_conclusion" = "success" ]; then
            check_page "English homepage" "${SITE_URL}/" /tmp/home-en.html \
              "Dates fixed." "Destination open?" "Compare destinations" "Continue shared planning" || overall=failure
            check_page "English shared planning" "${SITE_URL}/trips" /tmp/trips-en.html \
              "Destination chosen?" "Plan it together." "Choose a destination first" || overall=failure
            check_page "Simplified homepage" "${SITE_URL}/zh-cn" /tmp/home-cn.html \
              "未来14天 · 多人目的地决策" "日期定了，去哪还没定？" "开始比较目的地" || overall=failure
            check_page "Simplified shared planning" "${SITE_URL}/zh-cn/trips" /tmp/trips-cn.html \
              "去哪已经确定？" "接下来一起规划。" "先一起决定去哪" || overall=failure
            check_page "Traditional homepage" "${SITE_URL}/zh-hant" /tmp/home-hant.html \
              "未來14天 · 多人目的地決策" "日期定了，去哪還沒定？" "開始比較目的地" || overall=failure
            check_page "Traditional shared planning" "${SITE_URL}/zh-hant/trips" /tmp/trips-hant.html \
              "去哪已經確定？" "接下來一起規劃。" "先一起決定去哪" || overall=failure

            if ! curl --fail --silent --show-error --retry 5 "${TRIP_URL}/health" -o /tmp/trip-health.json \
              || ! grep -Fq '"ok":true' /tmp/trip-health.json; then
              overall=failure
              echo "Trip API health failed" >> /tmp/release-errors.txt
            fi
            if ! curl --fail --silent --show-error --retry 5 "${READ_URL}/health" -o /tmp/read-health.json \
              || ! grep -Fq '"ok":true' /tmp/read-health.json; then
              overall=failure
              echo "Weather Read health failed" >> /tmp/release-errors.txt
            fi
          fi

          errors="$(cat /tmp/release-errors.txt)"
          cat > release-verification.md <<EOF
          # Group decision production release verification

          - Target main SHA: \`${TARGET_SHA}\`
          - Deploy run: ${deploy_id:-not-found}
          - Deploy conclusion: ${deploy_conclusion}
          - Deploy URL: ${deploy_url:-not-available}
          - Production Smoke run: ${smoke_id:-not-found}
          - Production Smoke conclusion: ${smoke_conclusion}
          - Production Smoke URL: ${smoke_url:-not-available}
          - EN, zh-CN and zh-Hant production landing checks: $([ "$overall" = "success" ] && echo passed || echo failed)
          - Trip API and Weather Read health checks: $([ "$overall" = "success" ] && echo passed || echo see-errors)
          - Overall: ${overall}

          ## Errors

          ${errors:-None}
          EOF

          echo "overall=${overall}" >> "$GITHUB_OUTPUT"

      - name: Persist verification and remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-group-decision-release-once.yml
          git add release-verification.md
          git commit -m "chore: record group decision release verification"
          git push origin HEAD:verify/group-decision-release

      - name: Enforce successful release verification
        if: always()
        run: test "${{ steps.release.outputs.overall }}" = "success"
