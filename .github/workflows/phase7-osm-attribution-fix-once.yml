name: Phase 7 OSM attribution fix once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase7-osm-attribution-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/activity-intelligence-phase7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add visible OSM attribution
        run: python tooling/phase7-osm-attribution-fix.py
      - name: Format and run contract test
        run: |
          pnpm exec prettier --write apps/web/src/components/StructuredActivityEditor.tsx apps/web/src/components/trip-activity-phase7-contract.test.ts
          pnpm --filter @wnr/web exec vitest run src/components/trip-activity-phase7-contract.test.ts
      - name: Commit hardening and remove temporary helpers
        run: |
          rm .github/workflows/phase7-osm-attribution-fix-once.yml
          rm tooling/phase7-osm-attribution-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(activity): show OpenStreetMap attribution"
          git push origin HEAD:feature/activity-intelligence-phase7
