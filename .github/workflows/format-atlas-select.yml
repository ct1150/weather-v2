name: Format Atlas Select

on:
  push:
    branches: [style/atlas-country-select]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: style/atlas-country-select

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format selector files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/country-select-refinements.css \
            apps/web/src/components/country-select-design.test.ts \
            apps/web/src/app/layout.tsx

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/country-select-refinements.css apps/web/src/components/country-select-design.test.ts apps/web/src/app/layout.tsx
          git commit -m "style: format atlas country selector"
          git push origin HEAD:style/atlas-country-select
