name: Fix execution empty state once

on:
  push:
    branches:
      - agent/execution-empty-state-heading
    paths:
      - .github/workflows/fix-execution-empty-state-once.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/execution-empty-state-heading

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add server-rendered localized execution identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          component = Path("apps/web/src/components/TripExecutionWorkspace.tsx")
          source = component.read_text(encoding="utf-8")

          source, simplified_count = re.subn(
              r'("zh-cn": \{.*?eyebrow: )"Trip Execution Mode"',
              r'\1"旅行执行模式"',
              source,
              count=1,
              flags=re.S,
          )
          source, traditional_count = re.subn(
              r'("zh-hant": \{.*?eyebrow: )"Trip Execution Mode"',
              r'\1"旅行執行模式"',
              source,
              count=1,
              flags=re.S,
          )
          if simplified_count != 1 or traditional_count != 1:
              raise SystemExit("execution locale eyebrow markers not found")

          empty_marker = '''      <section className="info-panel">
                <h1 className="text-xl font-bold">{copy.emptyTitle}</h1>
          '''
          empty_replacement = '''      <section className="info-panel">
                <p className="eyebrow">{copy.eyebrow}</p>
                <h1 className="mt-3 text-xl font-bold">{copy.emptyTitle}</h1>
          '''
          if empty_marker not in source:
              raise SystemExit("execution empty-state marker not found")
          source = source.replace(empty_marker, empty_replacement, 1)
          component.write_text(source, encoding="utf-8")

          contract = Path("apps/web/src/components/trip-execution-pwa-contract.test.ts")
          test_source = contract.read_text(encoding="utf-8")
          if "server-renders localized execution mode identity" not in test_source:
              insertion = '''
            it("server-renders localized execution mode identity for empty workspaces", () => {
              expect(workspace).toContain('eyebrow: "Trip Execution Mode"');
              expect(workspace).toContain('eyebrow: "旅行执行模式"');
              expect(workspace).toContain('eyebrow: "旅行執行模式"');
              expect(workspace).toContain('<p className="eyebrow">{copy.eyebrow}</p>');
            });
          '''
              closing = "\n});\n"
              index = test_source.rfind(closing)
              if index < 0:
                  raise SystemExit("execution contract closing marker not found")
              test_source = test_source[:index] + insertion + test_source[index:]
              contract.write_text(test_source, encoding="utf-8")
          PY
          pnpm exec prettier --write \
            apps/web/src/components/TripExecutionWorkspace.tsx \
            apps/web/src/components/trip-execution-pwa-contract.test.ts

      - name: Validate execution empty-state hotfix
        run: |
          pnpm --filter @wnr/web lint
          pnpm --filter @wnr/web exec vitest run src/components/trip-execution-pwa-contract.test.ts

      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-execution-empty-state-once.yml
          git add \
            apps/web/src/components/TripExecutionWorkspace.tsx \
            apps/web/src/components/trip-execution-pwa-contract.test.ts
          git commit -m "fix: render localized execution identity in empty state"
          git push origin HEAD:agent/execution-empty-state-heading
