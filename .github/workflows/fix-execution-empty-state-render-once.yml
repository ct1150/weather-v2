name: Fix execution empty-state render once

on:
  push:
    branches:
      - agent/execution-empty-state-render-fix
    paths:
      - .github/workflows/fix-execution-empty-state-render-once.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PNPM_VERSION: "10.11.0"
      NODE_VERSION: "22"
      APP_BASE_URL: "https://868656.xyz"
      NEXT_PUBLIC_TRIP_API_URL: "https://trip.868656.xyz"
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/execution-empty-state-render-fix

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix empty-state render and strengthen contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          component = Path("apps/web/src/components/TripExecutionWorkspace.tsx")
          source = component.read_text(encoding="utf-8")

          empty_pattern = re.compile(
              r'(if \(workspace === null\) \{\s*return \(\s*'
              r'<section className="info-panel">\s*)'
              r'<h1 className="text-xl font-bold">\{copy\.emptyTitle\}</h1>',
              flags=re.S,
          )
          replacement = (
              r'\1<p className="eyebrow">{copy.eyebrow}</p>\n'
              r'        <h1 className="mt-3 text-xl font-bold">{copy.emptyTitle}</h1>'
          )
          source, count = empty_pattern.subn(replacement, source, count=1)
          if count != 1:
              empty_start = source.find("if (workspace === null)")
              empty_end = source.find("const externalMaps", empty_start)
              empty_slice = source[empty_start:empty_end]
              if '<p className="eyebrow">{copy.eyebrow}</p>' not in empty_slice:
                  raise SystemExit("execution empty-state heading structure not found")
          component.write_text(source, encoding="utf-8")

          contract = Path("apps/web/src/components/trip-execution-pwa-contract.test.ts")
          test_source = contract.read_text(encoding="utf-8")
          test_name = '  it("server-renders localized execution mode identity for empty workspaces", () => {'
          start = test_source.find(test_name)
          if start < 0:
              raise SystemExit("existing execution empty-state contract not found")
          end = test_source.find("\n  });", start)
          if end < 0:
              raise SystemExit("execution empty-state contract end not found")
          end += len("\n  });")
          strengthened = '''  it("server-renders localized execution mode identity for empty workspaces", () => {
            const emptyStateStart = workspace.indexOf("if (workspace === null)");
            const emptyStateEnd = workspace.indexOf("const externalMaps", emptyStateStart);
            const emptyState = workspace.slice(emptyStateStart, emptyStateEnd);

            expect(emptyStateStart).toBeGreaterThan(-1);
            expect(emptyStateEnd).toBeGreaterThan(emptyStateStart);
            expect(emptyState).toContain('<p className="eyebrow">{copy.eyebrow}</p>');
            expect(emptyState).toContain("{copy.emptyTitle}");
            expect(workspace).toContain('eyebrow: "Trip Execution Mode"');
            expect(workspace).toContain('eyebrow: "旅行执行模式"');
            expect(workspace).toContain('eyebrow: "旅行執行模式"');
          });'''
          test_source = test_source[:start] + strengthened + test_source[end:]
          contract.write_text(test_source, encoding="utf-8")
          PY

          pnpm exec prettier --write \
            apps/web/src/components/TripExecutionWorkspace.tsx \
            apps/web/src/components/trip-execution-pwa-contract.test.ts

      - name: Validate source contract
        run: |
          pnpm --filter @wnr/web lint
          pnpm --filter @wnr/web exec vitest run src/components/trip-execution-pwa-contract.test.ts

      - name: Validate production-equivalent static export
        run: |
          pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
          pnpm --filter @wnr/web build
          grep -Fq "Trip Execution Mode" apps/web/out/trips/execution.html
          grep -Fq "旅行执行模式" apps/web/out/zh-cn/trips/execution.html
          grep -Fq "旅行執行模式" apps/web/out/zh-hant/trips/execution.html

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-execution-empty-state-render-once.yml
          git add \
            apps/web/src/components/TripExecutionWorkspace.tsx \
            apps/web/src/components/trip-execution-pwa-contract.test.ts
          git commit -m "fix: render execution identity in empty state"
          git push origin HEAD:agent/execution-empty-state-render-fix
