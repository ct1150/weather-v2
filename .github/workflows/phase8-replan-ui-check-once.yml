name: Phase 8 replan UI check once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase8-replan-ui-check
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/adaptive-replanning-phase8'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-replanning-phase8
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build library packages
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
      - name: Apply Cloud-safe Review/Apply integration
        run: python tooling/phase8-replan-ui-patch.py
      - name: Format Slice E
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/TripReplanPanel.tsx \
            apps/web/src/components/CloudTripControls.tsx \
            apps/web/src/components/trip-replan-phase8-contract.test.ts \
            apps/web/src/trips/cloud-sync.ts
      - name: Verify Slice E contracts and types
        run: |
          pnpm --filter @wnr/web exec vitest run \
            src/trips/activity-risk.test.ts \
            src/trips/replan-solver.test.ts \
            src/components/trip-replan-phase8-contract.test.ts
          pnpm --filter @wnr/web typecheck
      - name: Commit implementation and remove helpers
        run: |
          rm .github/workflows/phase8-replan-ui-check-once.yml
          rm tooling/phase8-replan-ui-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(replan): add explicit proposal review and apply UI"
          git push origin HEAD:feature/adaptive-replanning-phase8
