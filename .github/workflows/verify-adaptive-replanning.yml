name: Verify adaptive replanning

on:
  pull_request:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: phase8-replan-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Phase 8 Preview end-to-end contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          for attempt in $(seq 1 60); do
            if TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/adaptive-replanning-smoke.mjs \
              --trip-url "https://where-not-rain-trip-preview.ct1150.workers.dev" \
              --read-url "https://where-not-rain-read-preview.ct1150.workers.dev" \
              --suffix "preview-${GITHUB_RUN_ID}-${attempt}"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Phase 8 Preview adaptive replanning contract did not become ready"
          exit 1

  production:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Phase 8 Production end-to-end contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/adaptive-replanning-smoke.mjs \
            --trip-url "https://trip.868656.xyz" \
            --read-url "https://where-not-rain-read-production.ct1150.workers.dev" \
            --suffix production
      - name: Record Phase 8 production verification
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > PHASE8_REPLAN_SMOKE_STATUS.md <<EOF
          # Phase 8 Adaptive Replanning smoke status

          - Conclusion: success
          - Deploy head SHA: ${DEPLOY_HEAD_SHA}
          - Deploy run: ${DEPLOY_RUN_URL}
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Checks

          - real persisted hourly weather snapshot read: success
          - deterministic same-day later smoke proposal: success
          - OWNER replan apply: success
          - EDITOR replan apply: success
          - fixed transport constraint unchanged: success
          - VIEWER apply rejected: success
          - stale baseVersion rejected with current version: success
          - normal immutable `replan` revisions created: success
          - replan audit retains weather snapshot and selected activity IDs: success
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE8_REPLAN_SMOKE_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(smoke): record phase 8 adaptive replanning verification [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
