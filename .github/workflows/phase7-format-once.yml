name: Phase 7 format once

on:
  push:
    branches: [feature/activity-intelligence-phase7]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 7 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/LocalizedTripWorkspace.tsx \
            apps/web/src/components/StructuredActivityEditor.tsx \
            apps/web/src/components/TripWorkspace.tsx \
            apps/web/src/trips/activity-intelligence.test.ts \
            apps/web/src/trips/activity-intelligence.ts \
            apps/web/src/trips/activity-plan-b.test.ts \
            apps/web/src/trips/activity-plan-b.ts \
            apps/web/src/trips/poi-catalog.test.ts \
            apps/web/src/trips/poi-catalog.ts \
            apps/web/src/trips/traditional.ts \
            apps/web/src/trips/workspace.test.ts \
            apps/web/src/trips/workspace.ts \
            docs/superpowers/plans/2026-08-08-activity-intelligence-phase7.md \
            workers/trip-api/src/activity-v2.test.ts \
            workers/trip-api/src/revision-diff.ts \
            workers/trip-api/src/validation.test.ts \
            workers/trip-api/src/validation.ts
      - name: Commit formatted files and remove helper
        run: |
          rm .github/workflows/phase7-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(activity): format phase 7"
          git push origin HEAD:feature/activity-intelligence-phase7
