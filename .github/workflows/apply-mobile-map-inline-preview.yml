name: Apply mobile map inline preview

on:
  push:
    branches:
      - ux/mobile-map-inline-preview

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-map-inline-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply interaction patch
        run: node tooling/ux/apply-mobile-map-inline-preview.mjs
      - name: Format changed source
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/InstantCountryWeatherExplorer.tsx \
            apps/web/src/app/instant-country-map.css \
            apps/web/src/components/country-map-mobile-interaction.test.ts
      - name: Commit product changes and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/InstantCountryWeatherExplorer.tsx \
            apps/web/src/app/instant-country-map.css \
            apps/web/src/components/country-map-mobile-interaction.test.ts
          git rm \
            tooling/ux/apply-mobile-map-inline-preview.mjs \
            .github/workflows/apply-mobile-map-inline-preview.yml
          git commit -m "fix: keep mobile city comparison on the map"
          git push origin HEAD:ux/mobile-map-inline-preview
