name: Phase 9 product entitlements check once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase9-product-entitlements-check
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/conversion-retention-phase9'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversion-retention-phase9
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Slice E
        run: |
          pnpm exec prettier --write \
            packages/domain/src/product-entitlements.ts \
            packages/domain/src/product-entitlements.test.ts \
            packages/domain/src/index.ts
      - name: Verify candidate entitlement contract
        run: |
          pnpm --filter @wnr/domain test
          pnpm --filter @wnr/domain build
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/phase9-slice-e-check-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(growth): verify candidate product entitlements"
          git push origin HEAD:feature/conversion-retention-phase9
