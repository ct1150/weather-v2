name: Report deploy status

on:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: write

jobs:
  report:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Write deployment status
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          cat > DEPLOY_STATUS.md <<EOF
          # Latest production deployment status

          - Conclusion: ${RUN_CONCLUSION}
          - Head SHA: ${RUN_HEAD_SHA}
          - Run number: ${RUN_NUMBER}
          - Trigger: ${RUN_EVENT}
          - Workflow: ${RUN_URL}
          - Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deploy): record latest production workflow result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
