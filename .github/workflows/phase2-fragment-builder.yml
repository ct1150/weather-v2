name: Phase 2 fragment patch

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/cloud-trip-phase2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch bearer URL handling
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('apps/web/src/components/MyTripsDashboard.tsx')
          text = dashboard.read_text()
          old = '        const url = `${window.location.origin}${sharePath(locale)}?token=${encodeURIComponent(share.token)}`;'
          new = '        const url = `${window.location.origin}${sharePath(locale)}#token=${encodeURIComponent(share.token)}`;'
          if text.count(old) != 1:
              raise SystemExit('MyTripsDashboard share URL marker mismatch')
          dashboard.write_text(text.replace(old, new, 1))

          viewer = Path('apps/web/src/components/SharedTripViewer.tsx')
          text = viewer.read_text()
          old = '    const nextToken = new URLSearchParams(window.location.search).get("token");'
          new = '    const nextToken = new URLSearchParams(window.location.hash.replace(/^#/u, "")).get("token");'
          if text.count(old) != 1:
              raise SystemExit('SharedTripViewer token marker mismatch')
          viewer.write_text(text.replace(old, new, 1))
          PY
      - name: Format patched files
        run: pnpm exec prettier --write apps/web/src/components/MyTripsDashboard.tsx apps/web/src/components/SharedTripViewer.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/MyTripsDashboard.tsx apps/web/src/components/SharedTripViewer.tsx
          git commit -m "fix(cloud-trip): keep share URL token in fragment [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
