name: Phase 7 workspace contract fix once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase7-workspace-contract-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/activity-intelligence-phase7'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply workspace v2 contract repair
        run: python tooling/phase7-workspace-v2-contract-fix.py
      - name: Format and run focused tests
        run: |
          pnpm exec prettier --write apps/web/src/trips/workspace.ts
          pnpm --filter @wnr/web exec vitest run src/trips/workspace.test.ts src/trips/activity-intelligence.test.ts src/trips/poi-catalog.test.ts
      - name: Commit repair and remove temporary helpers
        run: |
          rm .github/workflows/phase7-workspace-contract-fix-once.yml
          rm tooling/phase7-workspace-v2-contract-fix.py
          rm -f .github/workflows/phase7-share-projection-once.yml
          rm -f tooling/phase7-portable-share-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(activity): complete workspace v2 creation contracts"
          git push origin HEAD:feature/activity-intelligence-phase7
