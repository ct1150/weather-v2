name: Format fix once

on:
  push:
    branches:
      - agent/trek-route-execution-layer
    paths:
      - .github/workflows/format-fix-once.yml

permissions:
  contents: write

concurrency:
  group: format-fix-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/trek-route-execution-layer
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier rules
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/zh-cn/trips/execution/page.tsx \
            apps/web/src/app/zh-hant/trips/execution/page.tsx \
            apps/web/src/components/CloudTripControls.tsx \
            apps/web/src/components/trip-execution-pwa-contract.test.ts \
            apps/web/src/components/TripExecutionMap.tsx \
            apps/web/src/components/TripExecutionReplanPanel.tsx \
            apps/web/src/components/TripExecutionUtilities.tsx \
            apps/web/src/components/TripExecutionWorkspace.tsx \
            apps/web/src/trips/offline-store.ts \
            apps/web/src/trips/replan-route-cost.test.ts \
            apps/web/src/trips/replan-solver.ts \
            apps/web/src/trips/route-cache.test.ts \
            apps/web/src/trips/route-intelligence.test.ts \
            apps/web/src/trips/route-intelligence.ts \
            apps/web/src/trips/trip-execution.test.ts \
            apps/web/src/trips/trip-execution.ts
          pnpm format:check

      - name: Commit formatted files and remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/format-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/zh-cn/trips/execution/page.tsx \
            apps/web/src/app/zh-hant/trips/execution/page.tsx \
            apps/web/src/components/CloudTripControls.tsx \
            apps/web/src/components/trip-execution-pwa-contract.test.ts \
            apps/web/src/components/TripExecutionMap.tsx \
            apps/web/src/components/TripExecutionReplanPanel.tsx \
            apps/web/src/components/TripExecutionUtilities.tsx \
            apps/web/src/components/TripExecutionWorkspace.tsx \
            apps/web/src/trips/offline-store.ts \
            apps/web/src/trips/replan-route-cost.test.ts \
            apps/web/src/trips/replan-solver.ts \
            apps/web/src/trips/route-cache.test.ts \
            apps/web/src/trips/route-intelligence.test.ts \
            apps/web/src/trips/route-intelligence.ts \
            apps/web/src/trips/trip-execution.test.ts \
            apps/web/src/trips/trip-execution.ts
          git commit -m "style: apply repository prettier formatting"
          git push origin HEAD:agent/trek-route-execution-layer
