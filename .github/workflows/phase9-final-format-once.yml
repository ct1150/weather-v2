name: Phase 9 final format once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase9-final-format
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/conversion-retention-phase9'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversion-retention-phase9
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 9 release smoke
        run: pnpm exec prettier --write tooling/deploy/conversion-retention-live-smoke.mjs
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/phase9-final-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(growth): format phase 9 release smoke"
          git push origin HEAD:feature/conversion-retention-phase9
