name: Run direct discovery-to-trip builder

on:
  push:
    branches:
      - main
    paths:
      - .github/direct-discovery-trip-main-trigger
  pull_request:
    branches:
      - main
    paths:
      - .github/direct-discovery-trip-trigger
      - .github/workflows/build-direct-discovery-trip.yml

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || github.head_ref == 'agent/direct-discovery-trip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-discovery-trip
          fetch-depth: 0

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm install --frozen-lockfile

      - name: Extract and apply branch builder
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/build-direct-discovery-trip.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = []
          for line in source[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/direct-discovery-trip.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/direct-discovery-trip.py

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/web/src/trips/add-destination.ts \
            apps/web/src/trips/add-destination.test.ts \
            apps/web/src/components/DiscoveryTripAction.tsx \
            apps/web/src/components/CityTripBridgeAction.tsx \
            apps/web/src/components/CountryWeatherExplorer.tsx \
            apps/web/src/components/TraditionalCountryWeatherExplorer.tsx \
            apps/web/src/components/discovery-trip-action.test.ts \
            .github/workflows/verify-trip-product-production.yml

      - name: Focused validation
        run: |
          pnpm --filter @wnr/web test -- add-destination discovery-trip-action country-weather-explorer
          pnpm --filter @wnr/web typecheck
          pnpm --filter @wnr/web lint
          pnpm format:check

      - name: Commit built increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ux): add weather results directly to itinerary"
          git push origin HEAD:agent/direct-discovery-trip
