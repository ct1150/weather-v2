name: Apply rain-free copy updates

on:
  push:
    branches: [copy/rain-free-language]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/rain-free-language
      - name: Update user-facing rain copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/components/InstantCountryWeatherExplorer.tsx')
          s = p.read_text()
          replacements = {
              'lowerRain: "Mostly dry",': 'lowerRain: "Mostly rain-free",',
              'lowerRain: "基本无雨",': 'lowerRain: "基本不下雨",',
              'dryDays: "无雨情况",': 'dryDays: "降雨情况",',
              'lowerRain: "基本無雨",': 'lowerRain: "基本不下雨",',
              'dryDays: "無雨情況",': 'dryDays: "降雨情況",',
              'return lowerRainDays === 1 ? "That day looks mostly dry" : "Rain is expected that day";': 'return lowerRainDays === 1 ? "That day should be mostly rain-free" : "Rain is possible that day";',
              'if (lowerRainDays === 0) return `No clearly dry days in this ${total}-day period`;': 'if (lowerRainDays === 0) return `Rain is possible on all ${total} days`;',
              'if (lowerRainDays === total) return `All ${total} days look mostly dry`;': 'if (lowerRainDays === total) return `All ${total} days should be mostly rain-free`;',
              'return `${lowerRainDays} of ${total} days look mostly dry`;': 'return `${lowerRainDays} of ${total} days should be mostly rain-free`;',
              'if (total === 1) return lowerRainDays === 1 ? "当天基本无雨" : "当天有降雨";': 'if (total === 1) return lowerRainDays === 1 ? "当天基本不下雨" : "当天可能下雨";',
              'if (lowerRainDays === 0) return `这${total}天暂无明显无雨日`;': 'if (lowerRainDays === 0) return `这${total}天都有降雨可能`;',
              'if (lowerRainDays === total) return `这${total}天基本都无雨`;': 'if (lowerRainDays === total) return `这${total}天基本都不下雨`;',
              'return `${total}天里有${lowerRainDays}天基本无雨`;': 'return `${total}天里有${lowerRainDays}天基本不下雨`;',
              'if (total === 1) return lowerRainDays === 1 ? "當天基本無雨" : "當天有降雨";': 'if (total === 1) return lowerRainDays === 1 ? "當天基本不下雨" : "當天可能下雨";',
              'if (lowerRainDays === 0) return `這${total}天暫無明顯無雨日`;': 'if (lowerRainDays === 0) return `這${total}天都有降雨可能`;',
              'if (lowerRainDays === total) return `這${total}天基本都無雨`;': 'if (lowerRainDays === total) return `這${total}天基本都不下雨`;',
              'return `${total}天裡有${lowerRainDays}天基本無雨`;': 'return `${total}天裡有${lowerRainDays}天基本不下雨`;',
              'if (lowerRainDays === 0) return "No clearly dry days";': 'if (lowerRainDays === 0) return "Rain possible every day";',
              'return `${lowerRainDays} mostly dry ${lowerRainDays === 1 ? "day" : "days"}`;': 'return `${lowerRainDays} mostly rain-free ${lowerRainDays === 1 ? "day" : "days"}`;',
              'if (lowerRainDays === 0) return "暂无明显无雨日";': 'if (lowerRainDays === 0) return `${total}天都有降雨可能`;',
              'if (lowerRainDays === total) return `${total}天基本无雨`;': 'if (lowerRainDays === total) return `${total}天基本不下雨`;',
              'return `${lowerRainDays}天基本无雨`;': 'return `${lowerRainDays}天基本不下雨`;',
              'if (lowerRainDays === 0) return "暫無明顯無雨日";': 'if (lowerRainDays === 0) return `${total}天都有降雨可能`;',
              'if (lowerRainDays === total) return `${total}天基本無雨`;': 'if (lowerRainDays === total) return `${total}天基本不下雨`;',
              'return `${lowerRainDays}天基本無雨`;': 'return `${lowerRainDays}天基本不下雨`;',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected copy: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('apps/web/src/components/country-weather-explorer.test.tsx')
          s = p.read_text()
          s = s.replace('3 of 7 days look mostly dry', '3 of 7 days should be mostly rain-free')
          s = s.replace('6 of 7 days look mostly dry', '6 of 7 days should be mostly rain-free')
          s = s.replace('2 of 3 days look mostly dry', '2 of 3 days should be mostly rain-free')
          p.write_text(s)
          PY
          git rm .github/workflows/apply-rain-free-copy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/components/InstantCountryWeatherExplorer.tsx apps/web/src/components/country-weather-explorer.test.tsx
          git commit -m "copy: say basically not raining"
          git push origin HEAD:copy/rain-free-language
