name: Diagnose Pages execution cache once

on:
  push:
    branches:
      - agent/diagnose-pages-execution-cache
    paths:
      - .github/workflows/diagnose-pages-execution-cache-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PNPM_VERSION: "10.11.0"
      NODE_VERSION: "22"
      APP_BASE_URL: "https://868656.xyz"
      NEXT_PUBLIC_TRIP_API_URL: "https://trip.868656.xyz"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/diagnose-pages-execution-cache

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production-equivalent static export
        run: |
          pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
          pnpm --filter @wnr/web build

      - name: Inspect static export and live Pages responses
        shell: bash
        run: |
          set -u
          echo "===== STATIC EXPORT EXECUTION FILES ====="
          find apps/web/out -maxdepth 5 -type f \( -path '*/trips/execution*' -o -path '*/zh-cn/trips/execution*' -o -path '*/zh-hant/trips/execution*' \) -print | sort

          inspect_file() {
            local file="$1"
            echo "===== FILE: ${file} ====="
            wc -c "${file}" || true
            for text in \
              "Trip Execution Mode" \
              "No local trip is ready to execute" \
              "旅行执行模式" \
              "旅行執行模式"; do
              if grep -Fq "${text}" "${file}"; then
                echo "FOUND: ${text}"
              else
                echo "MISSING: ${text}"
              fi
            done
          }

          while IFS= read -r file; do
            inspect_file "${file}"
          done < <(find apps/web/out -maxdepth 5 -type f \( -path '*/trips/execution*' -o -path '*/zh-cn/trips/execution*' -o -path '*/zh-hant/trips/execution*' \) | sort)

          probe() {
            local name="$1"
            local url="$2"
            local slug="$3"
            local headers="/tmp/${slug}.headers"
            local body="/tmp/${slug}.body"
            echo "===== LIVE: ${name} ====="
            rm -f "${headers}" "${body}"
            set +e
            curl --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --dump-header "${headers}" \
              --output "${body}" \
              --write-out 'curl_exit=0 http=%{http_code} final=%{url_effective} remote_ip=%{remote_ip} bytes=%{size_download}\n' \
              "${url}"
            local status=$?
            set -e
            if [ "${status}" -ne 0 ]; then
              echo "curl_exit=${status}"
            fi
            echo "--- selected headers ---"
            grep -iE '^(HTTP/|age:|cache-control:|cf-cache-status:|cf-ray:|etag:|last-modified:|server:|x-|content-length:|content-type:)' "${headers}" || true
            echo "--- identity markers ---"
            for text in \
              "Trip Execution Mode" \
              "No local trip is ready to execute" \
              "旅行执行模式" \
              "旅行執行模式"; do
              if grep -Fq "${text}" "${body}"; then
                echo "FOUND: ${text}"
              else
                echo "MISSING: ${text}"
              fi
            done
            echo "--- title / empty-state excerpts ---"
            grep -oE '.{0,100}(Trip Execution Mode|No local trip is ready to execute|旅行执行模式|旅行執行模式).{0,160}' "${body}" | head -n 12 || true
            echo
          }

          CACHE_BUST="1cdb50b97cae89982e2a57472d9960900556a794-$(date +%s)"
          probe "custom domain normal" "https://868656.xyz/trips/execution" custom-normal
          probe "custom domain cache-busted" "https://868656.xyz/trips/execution?release=${CACHE_BUST}" custom-busted
          probe "Pages project normal" "https://where-not-rain.pages.dev/trips/execution" pages-normal
          probe "Pages project cache-busted" "https://where-not-rain.pages.dev/trips/execution?release=${CACHE_BUST}" pages-busted

      - name: Remove one-shot diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-pages-execution-cache-once.yml
          git commit -m "ci: remove one-shot Pages execution diagnostic"
          git push origin HEAD:agent/diagnose-pages-execution-cache
