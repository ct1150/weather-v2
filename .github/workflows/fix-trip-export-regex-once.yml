name: Fix trip export regex once

on:
  push:
    branches:
      - agent/trek-route-execution-layer
    paths:
      - .github/workflows/fix-trip-export-regex-once.yml

permissions:
  contents: write

concurrency:
  group: fix-trip-export-regex-once
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/trek-route-execution-layer
          fetch-depth: 0

      - name: Replace invalid Unicode regex escape
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/trips/trip-exports.ts")
          source = path.read_text(encoding="utf-8")
          old = r'.replace(/\"/gu, "&quot;")'
          new = r'.replace(/"/gu, "&quot;")'
          if old not in source:
              raise SystemExit("expected invalid quote regex was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-trip-export-regex-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/trips/trip-exports.ts
          git commit -m "fix: use valid quote regex in trip export"
          git push origin HEAD:agent/trek-route-execution-layer
