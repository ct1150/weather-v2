name: Verify weather discovery

on:
  pull_request:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: phase6-discovery-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply live preference UX patch once
        if: github.event.pull_request.head.ref == 'fix/discovery-preference-effect'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/WeatherDiscoveryPlannerV2.tsx')
          text = path.read_text()
          if 'preferenceAutoApplyReady' in text:
              print('planner patch already applied')
              raise SystemExit(0)

          replacements = [
              ('    apply: "Update results",\n', '    apply: "Update results",\n    autoApply: "Results update automatically as conditions change.",\n'),
              ('    noMatches: "No destinations match every selected limit. Relax one constraint and try again.",\n', '    noMatches: "No destinations currently match the selected weather conditions. Relax one preference or limit and try again.",\n'),
              ('    apply: "更新推荐",\n', '    apply: "更新推荐",\n    autoApply: "条件变化后会自动重新筛选，无需再次确认。",\n'),
              ('    noMatches: "没有城市同时满足全部限制条件，可以放宽一个条件后再试。",\n', '    noMatches: "当前没有城市满足所选天气条件，可以放宽一个偏好或限制后再试。",\n'),
              ('    apply: "更新推薦",\n', '    apply: "更新推薦",\n    autoApply: "條件變化後會自動重新篩選，無需再次確認。",\n'),
              ('    noMatches: "沒有城市同時符合全部限制條件，可以放寬一個條件後再試。",\n', '    noMatches: "目前沒有城市符合所選天氣條件，可以放寬一個偏好或限制後再試。",\n'),
              ('  const discoveryViewTracked = useRef(false);\n', '  const discoveryViewTracked = useRef(false);\n  const preferenceAutoApplyReady = useRef(false);\n'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected planner fragment: {old!r}')
              text = text.replace(old, new, 1)

          old_apply = '''  const apply = useCallback((): void => {
    if (discoveryDateRange(draft.from, draft.to).length === 0) {
      setMessage(copy.invalidRange);
      return;
    }
    setTripReady(false);
    setApplied(draft);
    updateUrl(draft, shortlist);
  }, [copy.invalidRange, draft, shortlist, updateUrl]);
'''
          new_apply = '''  useEffect(() => {
    if (!preferenceAutoApplyReady.current) {
      preferenceAutoApplyReady.current = true;
      return;
    }
    if (discoveryDateRange(draft.from, draft.to).length === 0) {
      setMessage(copy.invalidRange);
      return;
    }
    const timer = window.setTimeout(() => {
      setTripReady(false);
      setMessage("");
      setApplied(draft);
      updateUrl(draft, shortlist);
    }, 120);
    return () => window.clearTimeout(timer);
  }, [copy.invalidRange, draft, shortlist, updateUrl]);
'''
          if old_apply not in text:
              raise SystemExit('missing apply callback block')
          text = text.replace(old_apply, new_apply, 1)

          old_button = '''            <button type="button" className="trip-primary-button mt-4 w-full" onClick={apply}>
              {copy.apply}
            </button>
            <p className="mt-2 text-xs leading-5 text-muted">{copy.filtersShare}</p>
'''
          new_button = '''            <p className="mt-4 rounded-xl bg-surface-elevated px-3 py-2 text-xs font-semibold text-muted">
              {copy.autoApply}
            </p>
            <p className="mt-2 text-xs leading-5 text-muted">{copy.filtersShare}</p>
'''
          if old_button not in text:
              raise SystemExit('missing manual apply button block')
          path.write_text(text)
          PY
          npx prettier --write apps/web/src/components/WeatherDiscoveryPlannerV2.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/WeatherDiscoveryPlannerV2.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(discovery): apply weather preferences live"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Phase 6 preview page
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --location \
              "https://${PR_NUMBER}.where-not-rain.pages.dev/discover" \
              | grep -Fq "Weather Discovery"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Phase 6 preview page did not become ready"
          exit 1
      - name: Verify Phase 6 preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node tooling/deploy/weather-discovery-smoke.mjs \
            --site-url "https://${PR_NUMBER}.where-not-rain.pages.dev" \
            --read-url "https://where-not-rain-read-preview.ct1150.workers.dev"

  production:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Phase 6 production
        run: |
          node tooling/deploy/weather-discovery-smoke.mjs \
            --site-url "https://868656.xyz" \
            --read-url "https://where-not-rain-read-production.ct1150.workers.dev"
      - name: Record Phase 6 production verification
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > PHASE6_DISCOVERY_SMOKE_STATUS.md <<EOF
          # Phase 6 Weather Discovery smoke status

          - Conclusion: success
          - Deploy head SHA: ${DEPLOY_HEAD_SHA}
          - Deploy run: ${DEPLOY_RUN_URL}
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Checks

          - English `/discover` route: success
          - Simplified Chinese `/zh-cn/discover` route: success
          - Traditional Chinese `/zh-hant/discover` route: success
          - Weather city catalogue: success
          - Batched 12-city forecast reads: success
          - Cross-batch snapshot consistency: success
          - 16-day API bound enforcement: success
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE6_DISCOVERY_SMOKE_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(smoke): record phase 6 discovery verification [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
