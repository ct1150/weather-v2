name: Add weather-read health once

on:
  push:
    branches:
      - agent/weather-read-health-endpoint
    paths:
      - .github/workflows/add-weather-read-health-once.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/weather-read-health-endpoint

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add health route and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path("workers/weather-read/src/index.ts")
          source = worker.read_text(encoding="utf-8")
          if 'url.pathname === "/health"' not in source:
              marker = '  const url = new URL(request.url);\n'
              replacement = marker + '''  if (url.pathname === "/health") {
            return json({ ok: true, service: "weather-read", readOnly: true }, 200, env);
          }
          '''
              if marker not in source:
                  raise SystemExit("weather-read URL marker not found")
              source = source.replace(marker, replacement, 1)
              worker.write_text(source, encoding="utf-8")

          tests = Path("workers/weather-read/src/index.test.ts")
          test_source = tests.read_text(encoding="utf-8")
          if 'lightweight read-only health endpoint' not in test_source:
              marker = '  it("serves only the active persisted ranking with no-store and fixed-origin CORS", async () => {\n'
              regression = '''  it("exposes a lightweight read-only health endpoint without querying a publication", async () => {
            const response = await handleRequest(new Request("https://read.example/health"), { DB: db });

            expect(response.status).toBe(200);
            expect(response.headers.get("cache-control")).toBe("private, no-store");
            await expect(response.json()).resolves.toEqual({
              ok: true,
              service: "weather-read",
              readOnly: true,
            });
          });

          '''
              if marker not in test_source:
                  raise SystemExit("weather-read test insertion marker not found")
              tests.write_text(test_source.replace(marker, regression + marker, 1), encoding="utf-8")
          PY
          pnpm exec prettier --write workers/weather-read/src/index.ts workers/weather-read/src/index.test.ts

      - name: Validate weather-read hotfix
        run: |
          pnpm --filter @wnr/weather-read lint
          pnpm --filter @wnr/weather-read typecheck
          pnpm --filter @wnr/weather-read test

      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-weather-read-health-once.yml
          git add workers/weather-read/src/index.ts workers/weather-read/src/index.test.ts
          git commit -m "fix: add weather-read health endpoint"
          git push origin HEAD:agent/weather-read-health-endpoint
