name: Phase 3 workflow patch once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: "github.event.issue.title == 'internal: phase3 workflow patch'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/deploy/patch-phase3-workflows.mjs
      - run: pnpm exec prettier --write .github/workflows/deploy.yml .github/workflows/verify-trip-product-production.yml tooling/deploy/trip-collaboration-smoke.mjs tooling/deploy/patch-phase3-workflows.mjs
      - name: Commit workflow smoke coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml .github/workflows/verify-trip-product-production.yml tooling/deploy/trip-collaboration-smoke.mjs tooling/deploy/patch-phase3-workflows.mjs
          git commit -m "test(cloud-trip): add phase 3 runtime smoke"
          git push origin HEAD:feature/cloud-trip-phase3
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Phase 3 workflow patch completed.' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned' });
