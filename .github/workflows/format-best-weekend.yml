name: Format weekend SEO changes

on:
  push:
    branches: [seo/best-weekend]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/best-weekend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and clean up
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/best-weekend/page.tsx \
            apps/web/src/app/zh-cn/best-weekend/page.tsx \
            apps/web/src/app/zh-hant/best-weekend/page.tsx \
            apps/web/src/app/sitemap.ts \
            apps/web/src/components/BestWeatherThisWeekPage.tsx \
            apps/web/src/components/CountryMapHome.tsx \
            apps/web/src/seo/weekly-weather-ranking.ts \
            apps/web/src/seo/weekly-weather-ranking.test.ts
          rm .github/workflows/format-best-weekend.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format weekend SEO changes"
          git push origin HEAD:seo/best-weekend
