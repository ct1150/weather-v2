name: Phase 2 smoke patch once

on:
  push:
    branches:
      - feature/cloud-trip-phase2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extend Cloud Trip smoke contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          deploy = Path('.github/workflows/deploy.yml')
          text = deploy.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "          grep -Fq '\"cloudTrip\":true' /tmp/trip-health-preview.json\n",
              "          grep -Fq '\"cloudTrip\":true' /tmp/trip-health-preview.json\n          grep -Fq '\"cloudSharing\":true' /tmp/trip-health-preview.json\n",
          )
          replace_once(
              "          grep -Fq '\"cloudTrip\":true' /tmp/trip-health-production.json\n",
              "          grep -Fq '\"cloudTrip\":true' /tmp/trip-health-production.json\n          grep -Fq '\"cloudSharing\":true' /tmp/trip-health-production.json\n",
          )

          preview_anchor = '''          test "$STALE_STATUS" = "409"
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}" -o /tmp/trip-deleted-preview.json
          grep -Fq '"deleted":true' /tmp/trip-deleted-preview.json
'''
          preview_phase2 = '''          test "$STALE_STATUS" = "409"
          cat >/tmp/trip-archive-preview.json <<'JSON'
          {"baseVersion":2,"status":"archived"}
          JSON
          curl --fail --silent --show-error \\
            --request PATCH \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            --header 'content-type: application/json' \\
            --data-binary @/tmp/trip-archive-preview.json \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}/status" -o /tmp/trip-archived-preview.json
          grep -Fq '"status":"archived"' /tmp/trip-archived-preview.json
          grep -Fq '"version":3' /tmp/trip-archived-preview.json
          STALE_RESTORE_STATUS=$(curl --silent --output /tmp/trip-stale-restore-preview.json --write-out '%{http_code}' \\
            --request PATCH \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            --header 'content-type: application/json' \\
            --data '{"baseVersion":2,"status":"active"}' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}/status")
          test "$STALE_RESTORE_STATUS" = "409"
          curl --fail --silent --show-error \\
            --request PATCH \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            --header 'content-type: application/json' \\
            --data '{"baseVersion":3,"status":"active"}' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}/status" -o /tmp/trip-restored-preview.json
          grep -Fq '"status":"active"' /tmp/trip-restored-preview.json
          grep -Fq '"version":4' /tmp/trip-restored-preview.json
          curl --fail --silent --show-error \\
            --request POST \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}/share" -o /tmp/trip-share1-preview.json
          SHARE1_TOKEN=$(node -e "const x=require('/tmp/trip-share1-preview.json');process.stdout.write(x.data.token)")
          test "${#SHARE1_TOKEN}" = "68"
          curl --fail --silent --show-error \\
            "${TRIP_PREVIEW_URL}/api/v1/shared-trips/${SHARE1_TOKEN}" -o /tmp/trip-shared1-preview.json
          grep -Fq '"title":"CI preview cloud trip updated"' /tmp/trip-shared1-preview.json
          ANON_COPY_STATUS=$(curl --silent --output /tmp/trip-anon-copy-preview.json --write-out '%{http_code}' \\
            --request POST \\
            "${TRIP_PREVIEW_URL}/api/v1/shared-trips/${SHARE1_TOKEN}/copy")
          test "$ANON_COPY_STATUS" = "401"
          curl --fail --silent --show-error \\
            --request POST \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview-copy' \\
            "${TRIP_PREVIEW_URL}/api/v1/shared-trips/${SHARE1_TOKEN}/copy" -o /tmp/trip-copied-preview.json
          COPY_TRIP_ID=$(node -e "const x=require('/tmp/trip-copied-preview.json');process.stdout.write(x.data.id)")
          test "$COPY_TRIP_ID" != "$TRIP_ID"
          grep -Fq '"version":1' /tmp/trip-copied-preview.json
          curl --fail --silent --show-error \\
            --request POST \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}/share" -o /tmp/trip-share2-preview.json
          SHARE2_TOKEN=$(node -e "const x=require('/tmp/trip-share2-preview.json');process.stdout.write(x.data.token)")
          test "$SHARE2_TOKEN" != "$SHARE1_TOKEN"
          OLD_SHARE_STATUS=$(curl --silent --output /tmp/trip-old-share-preview.json --write-out '%{http_code}' \\
            "${TRIP_PREVIEW_URL}/api/v1/shared-trips/${SHARE1_TOKEN}")
          test "$OLD_SHARE_STATUS" = "404"
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}/share" -o /tmp/trip-share-revoked-preview.json
          grep -Fq '"revoked":true' /tmp/trip-share-revoked-preview.json
          REVOKED_SHARE_STATUS=$(curl --silent --output /tmp/trip-revoked-share-preview.json --write-out '%{http_code}' \\
            "${TRIP_PREVIEW_URL}/api/v1/shared-trips/${SHARE2_TOKEN}")
          test "$REVOKED_SHARE_STATUS" = "404"
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview-copy' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${COPY_TRIP_ID}" -o /tmp/trip-copy-deleted-preview.json
          grep -Fq '"deleted":true' /tmp/trip-copy-deleted-preview.json
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-preview' \\
            "${TRIP_PREVIEW_URL}/api/v1/trips/${TRIP_ID}" -o /tmp/trip-deleted-preview.json
          grep -Fq '"deleted":true' /tmp/trip-deleted-preview.json
'''
          replace_once(preview_anchor, preview_phase2)

          production_anchor = '''          test "$STALE_STATUS" = "409"
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}" -o /tmp/trip-deleted-production.json
          grep -Fq '"deleted":true' /tmp/trip-deleted-production.json
'''
          production_phase2 = '''          test "$STALE_STATUS" = "409"
          curl --fail --silent --show-error \\
            --request PATCH \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            --header 'content-type: application/json' \\
            --data '{"baseVersion":2,"status":"archived"}' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}/status" -o /tmp/trip-archived-production.json
          grep -Fq '"status":"archived"' /tmp/trip-archived-production.json
          grep -Fq '"version":3' /tmp/trip-archived-production.json
          STALE_RESTORE_STATUS=$(curl --silent --output /tmp/trip-stale-restore-production.json --write-out '%{http_code}' \\
            --request PATCH \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            --header 'content-type: application/json' \\
            --data '{"baseVersion":2,"status":"active"}' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}/status")
          test "$STALE_RESTORE_STATUS" = "409"
          curl --fail --silent --show-error \\
            --request PATCH \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            --header 'content-type: application/json' \\
            --data '{"baseVersion":3,"status":"active"}' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}/status" -o /tmp/trip-restored-production.json
          grep -Fq '"status":"active"' /tmp/trip-restored-production.json
          grep -Fq '"version":4' /tmp/trip-restored-production.json
          curl --fail --silent --show-error \\
            --request POST \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}/share" -o /tmp/trip-share1-production.json
          SHARE1_TOKEN=$(node -e "const x=require('/tmp/trip-share1-production.json');process.stdout.write(x.data.token)")
          test "${#SHARE1_TOKEN}" = "68"
          curl --fail --silent --show-error \\
            "${TRIP_PRODUCTION_URL}/api/v1/shared-trips/${SHARE1_TOKEN}" -o /tmp/trip-shared1-production.json
          grep -Fq '"title":"CI production cloud trip updated"' /tmp/trip-shared1-production.json
          ANON_COPY_STATUS=$(curl --silent --output /tmp/trip-anon-copy-production.json --write-out '%{http_code}' \\
            --request POST \\
            "${TRIP_PRODUCTION_URL}/api/v1/shared-trips/${SHARE1_TOKEN}/copy")
          test "$ANON_COPY_STATUS" = "401"
          curl --fail --silent --show-error \\
            --request POST \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production-copy' \\
            "${TRIP_PRODUCTION_URL}/api/v1/shared-trips/${SHARE1_TOKEN}/copy" -o /tmp/trip-copied-production.json
          COPY_TRIP_ID=$(node -e "const x=require('/tmp/trip-copied-production.json');process.stdout.write(x.data.id)")
          test "$COPY_TRIP_ID" != "$TRIP_ID"
          grep -Fq '"version":1' /tmp/trip-copied-production.json
          curl --fail --silent --show-error \\
            --request POST \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}/share" -o /tmp/trip-share2-production.json
          SHARE2_TOKEN=$(node -e "const x=require('/tmp/trip-share2-production.json');process.stdout.write(x.data.token)")
          test "$SHARE2_TOKEN" != "$SHARE1_TOKEN"
          OLD_SHARE_STATUS=$(curl --silent --output /tmp/trip-old-share-production.json --write-out '%{http_code}' \\
            "${TRIP_PRODUCTION_URL}/api/v1/shared-trips/${SHARE1_TOKEN}")
          test "$OLD_SHARE_STATUS" = "404"
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}/share" -o /tmp/trip-share-revoked-production.json
          grep -Fq '"revoked":true' /tmp/trip-share-revoked-production.json
          REVOKED_SHARE_STATUS=$(curl --silent --output /tmp/trip-revoked-share-production.json --write-out '%{http_code}' \\
            "${TRIP_PRODUCTION_URL}/api/v1/shared-trips/${SHARE2_TOKEN}")
          test "$REVOKED_SHARE_STATUS" = "404"
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production-copy' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${COPY_TRIP_ID}" -o /tmp/trip-copy-deleted-production.json
          grep -Fq '"deleted":true' /tmp/trip-copy-deleted-production.json
          curl --fail --silent --show-error \\
            --request DELETE \\
            --header "authorization: Bearer $SMOKE_TOKEN" \\
            --header 'x-wnr-smoke-user: deploy-production' \\
            "${TRIP_PRODUCTION_URL}/api/v1/trips/${TRIP_ID}" -o /tmp/trip-deleted-production.json
          grep -Fq '"deleted":true' /tmp/trip-deleted-production.json
'''
          replace_once(production_anchor, production_phase2)
          deploy.write_text(text)

          verify = Path('.github/workflows/verify-trip-product-production.yml')
          v = verify.read_text()

          def vreplace(old: str, new: str) -> None:
              nonlocal_marker = None
              global v
              count = v.count(old)
              if count != 1:
                  raise SystemExit(f'verify: expected one match, found {count}: {old[:100]!r}')
              v = v.replace(old, new, 1)

          vreplace(
              '          fetch_and_match \\\n            "English workspace route" \\\n            "https://868656.xyz/trips/workspace" \\\n            /tmp/workspace.html \\\n            "Opening your trip workspace"\n',
              '          fetch_and_match \\\n            "English workspace route" \\\n            "https://868656.xyz/trips/workspace" \\\n            /tmp/workspace.html \\\n            "Opening your trip workspace"\n\n          fetch_and_match \\\n            "English read-only share route" \\\n            "https://868656.xyz/trips/share" \\\n            /tmp/trip-share-page.html \\\n            "Read-only shared trip" "noindex"\n',
          )
          vreplace(
              '          fetch_and_match \\\n            "Traditional workspace route" \\\n            "https://868656.xyz/zh-hant/trips/workspace" \\\n            /tmp/workspace-hant.html \\\n            "正在開啟你的行程工作台"\n',
              '          fetch_and_match \\\n            "Traditional workspace route" \\\n            "https://868656.xyz/zh-hant/trips/workspace" \\\n            /tmp/workspace-hant.html \\\n            "正在開啟你的行程工作台"\n\n          fetch_and_match \\\n            "Traditional read-only share route" \\\n            "https://868656.xyz/zh-hant/trips/share" \\\n            /tmp/trip-share-hant.html \\\n            "唯讀分享行程" "noindex"\n',
          )
          vreplace(
              '          fetch_and_match \\\n            "Simplified import route" \\\n            "https://868656.xyz/zh-cn/trips/new" \\\n            /tmp/trips-new-cn.html \\\n            "把你现有的计划直接变成天气行程工作台" "粘贴已经整理好的旅行行程"\n',
              '          fetch_and_match \\\n            "Simplified import route" \\\n            "https://868656.xyz/zh-cn/trips/new" \\\n            /tmp/trips-new-cn.html \\\n            "把你现有的计划直接变成天气行程工作台" "粘贴已经整理好的旅行行程"\n\n          fetch_and_match \\\n            "Simplified read-only share route" \\\n            "https://868656.xyz/zh-cn/trips/share" \\\n            /tmp/trip-share-cn.html \\\n            "只读分享行程" "noindex"\n',
          )
          vreplace(
              '            /tmp/trip-api-health.json \\\n            \'"cloudTrip":true\'\n',
              '            /tmp/trip-api-health.json \\\n            \'"cloudTrip":true\' \'"cloudSharing":true\'\n',
          )
          verify.write_text(v)
          PY
      - name: Format workflow files
        run: pnpm exec prettier --write .github/workflows/deploy.yml .github/workflows/verify-trip-product-production.yml
      - name: Commit smoke coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml .github/workflows/verify-trip-product-production.yml
          git commit -m "test(cloud-trip): add phase 2 preview and production smoke [skip ci]"
          git push origin HEAD:feature/cloud-trip-phase2
