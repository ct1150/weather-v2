name: Report Phase 5 weather smoke

on:
  workflow_run:
    workflows:
      - Cloud Trip Weather Intelligence Smoke
    types:
      - completed

permissions:
  contents: write

jobs:
  report:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Write Phase 5 weather smoke status
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          if [ -f PHASE5_WEATHER_SMOKE_STATUS.md ]; then
            EXISTING_SHA="$(sed -n 's/^- Head SHA: //p' PHASE5_WEATHER_SMOKE_STATUS.md | head -n 1)"
            if [[ "$EXISTING_SHA" =~ ^[0-9a-f]{40}$ ]] && \
               git cat-file -e "${EXISTING_SHA}^{commit}" 2>/dev/null && \
               [ "$RUN_HEAD_SHA" != "$EXISTING_SHA" ] && \
               git merge-base --is-ancestor "$RUN_HEAD_SHA" "$EXISTING_SHA"; then
              echo "Ignoring stale Phase 5 smoke for ${RUN_HEAD_SHA}; newer result is ${EXISTING_SHA}."
              exit 0
            fi
          fi

          cat > PHASE5_WEATHER_SMOKE_STATUS.md <<EOF
          # Phase 5 weather intelligence smoke status

          - Conclusion: ${RUN_CONCLUSION}
          - Head SHA: ${RUN_HEAD_SHA}
          - Run number: ${RUN_NUMBER}
          - Workflow: ${RUN_URL}
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Production checks

          - Phase 5 API health flags: verified by smoke workflow
          - Weather-read service binding: verified by real forecast baseline refresh
          - First observation stays silent: verified
          - Same-snapshot retry is idempotent: verified
          - Viewer can read insights but cannot refresh: verified
          - Viewer cannot convert weather insights into decisions: verified
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE5_WEATHER_SMOKE_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(smoke): record phase 5 weather verification [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
