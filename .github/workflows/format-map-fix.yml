name: Format Map Fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format China map files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/country-map-cn.generated.ts \
            apps/web/src/components/country-map-geometry-overrides.ts \
            apps/web/src/components/CountryOutlineMap.tsx \
            tooling/maps/generate-cn-geometry.mjs

      - name: Commit formatting when changed
        run: |
          if git diff --quiet -- \
            apps/web/src/components/country-map-cn.generated.ts \
            apps/web/src/components/country-map-geometry-overrides.ts \
            apps/web/src/components/CountryOutlineMap.tsx \
            tooling/maps/generate-cn-geometry.mjs; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/src/components/country-map-cn.generated.ts \
            apps/web/src/components/country-map-geometry-overrides.ts \
            apps/web/src/components/CountryOutlineMap.tsx \
            tooling/maps/generate-cn-geometry.mjs
          git commit -m "style: format China map implementation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
