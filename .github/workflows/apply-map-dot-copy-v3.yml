name: Apply Map Dot Copy V3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/map-dot-weather-markers

      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply copy and formatting
        run: |
          python tooling/maps/apply-map-dot-copy.py
          pnpm exec prettier --write \
            apps/web/src/components/InstantCountryWeatherExplorer.tsx \
            apps/web/src/components/country-weather-explorer.test.tsx \
            apps/web/src/components/country-map-mobile-density.test.tsx \
            apps/web/src/components/CountryOutlineMap.tsx \
            apps/web/src/app/instant-country-map.css

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/InstantCountryWeatherExplorer.tsx \
            apps/web/src/components/country-weather-explorer.test.tsx \
            apps/web/src/components/country-map-mobile-density.test.tsx \
            apps/web/src/components/CountryOutlineMap.tsx \
            apps/web/src/app/instant-country-map.css
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: clarify rain outlook and map dot interactions"
          git push origin HEAD:ux/map-dot-weather-markers
