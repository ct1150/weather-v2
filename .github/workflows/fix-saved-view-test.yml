name: Fix saved view test expectation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/country-map-saved-views
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix assertion and clean up
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/country-weather-explorer.test.tsx')
          text = path.read_text()
          old = '    expect(within(dialog).getByText(/\\/jp\\?range=7d&cities=tokyo/)).toBeTruthy();'
          new = '    expect(within(dialog).getByText("/jp?cities=tokyo")).toBeTruthy();'
          if old not in text:
              raise SystemExit('assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/components/country-weather-explorer.test.tsx
          rm .github/workflows/fix-saved-view-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: match implicit default saved map range"
          git push origin HEAD:feat/country-map-saved-views
