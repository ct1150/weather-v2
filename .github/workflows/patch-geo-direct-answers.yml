name: Wire city GEO direct answers

on:
  push:
    branches: [seo/geo-direct-answers]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/geo-direct-answers
      - name: Wire direct answers into city pages
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          en = Path('apps/web/src/app/[countrySlug]/[citySlug]/page.tsx')
          replace_once(
              en,
              'import { CityTripBridge } from "../../../components/CityTripBridge";\nimport { buildAlternates, routeRobots, localeUrl, citySearchCopy } from "../../seo";',
              'import { CityTripBridge } from "../../../components/CityTripBridge";\nimport { CityDirectAnswer } from "../../../components/CityDirectAnswer";\nimport { buildAlternates, routeRobots, localeUrl, citySearchCopy } from "../../seo";',
          )
          replace_once(
              en,
              '            Check rain risk, temperature and the 7-day Travel Score, then compare other destinations\n            across {city.countryName} before you book.',
              '            See which of the next seven days are mostly rain-free, how much rain is expected and\n            the temperature range, then compare other destinations across {city.countryName}.',
          )
          replace_once(
              en,
              '      </section>\n\n      <CityTripBridge',
              '      </section>\n\n      <CityDirectAnswer\n        cityName={city.cityName}\n        forecastDays={forecastDays ?? []}\n        locale="en"\n      />\n\n      <CityTripBridge',
          )
          replace_once(
              en,
              '      "See the 7-day forecast, rain risk, temperature and Travel Score for this destination.",',
              '      "See which of the next seven days are mostly rain-free, plus expected rain and temperature for this destination.",',
          )

          zh = Path('apps/web/src/components/ChineseCityWeatherPage.tsx')
          replace_once(
              zh,
              'import { JsonLd } from "./JsonLd";\nimport { CityTripBridge } from "./CityTripBridge";',
              'import { JsonLd } from "./JsonLd";\nimport { CityTripBridge } from "./CityTripBridge";\nimport { CityDirectAnswer } from "./CityDirectAnswer";',
          )
          replace_once(
              zh,
              '      `查看降雨风险、气温和 7 天旅行评分，再和${country}其他目的地比较后决定行程。`,',
              '      `先看未来 7 天哪些日期基本不下雨、预计降雨和气温，再和${country}其他目的地比较后决定行程。`,',
          )
          replace_once(
              zh,
              '      `查看降雨風險、氣溫和 7 天旅行評分，再和${country}其他目的地比較後決定行程。`,',
              '      `先看未來 7 天哪些日期基本不下雨、預計降雨和氣溫，再和${country}其他目的地比較後決定行程。`,',
          )
          replace_once(
              zh,
              '      </section>\n\n      <CityTripBridge',
              '      </section>\n\n      <CityDirectAnswer\n        cityName={city.cityName}\n        forecastDays={forecastDays ?? []}\n        locale={locale}\n      />\n\n      <CityTripBridge',
          )
          PY

          rm .github/workflows/patch-geo-direct-answers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "seo: add crawlable city weather direct answers"
          git push origin HEAD:seo/geo-direct-answers
