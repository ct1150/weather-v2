name: Phase 7 format final once

on:
  push:
    branches: [feature/activity-intelligence-phase7]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/web/src/components/trip-activity-phase7-contract.test.ts \
            tooling/deploy/trip-activity-intelligence-smoke.mjs
      - name: Commit formatted files and remove helper
        run: |
          rm .github/workflows/phase7-format-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(activity): format phase 7 verification"
          git push origin HEAD:feature/activity-intelligence-phase7
