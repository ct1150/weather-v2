name: Phase 5 format once

on:
  push:
    branches:
      - feat/cloud-trip-phase5-weather-intelligence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloud-trip-phase5-weather-intelligence
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 5 files
        run: |
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-08-08-cloud-trip-phase5-weather-intelligence.md \
            apps/web/src/components/CloudTripControls.tsx \
            apps/web/src/components/TripWeatherIntelligencePanel.tsx \
            apps/web/src/components/cloud-trip-phase5-contract.test.ts \
            apps/web/src/trips/weather-intelligence-client.ts \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/phase5.test.ts \
            workers/trip-api/src/validation.ts \
            workers/trip-api/src/weather-intelligence-migration.test.ts \
            workers/trip-api/src/weather-intelligence-routes.ts \
            workers/trip-api/src/weather-intelligence-service.ts \
            workers/trip-api/src/weather-intelligence.test.ts \
            workers/trip-api/src/weather-intelligence.ts \
            workers/trip-api/wrangler.jsonc
      - name: Commit formatted files and remove helper
        run: |
          rm .github/workflows/phase5-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(phase5): format weather intelligence"
          git push origin HEAD:feat/cloud-trip-phase5-weather-intelligence
