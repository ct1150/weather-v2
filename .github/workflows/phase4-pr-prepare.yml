name: Phase 4 PR prepare

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/cloud-trip-phase4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Phase 4
        run: |
          find workers/trip-api/src -name '*.test.ts' -print0 | xargs -0 sed -i 's/"0003_collaboration.sql"\]/"0003_collaboration.sql", "0004_collaboration_intelligence.sql"\]/g'
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-08-08-cloud-trip-phase4-collaboration-intelligence.md \
            workers/trip-api/migrations/0004_collaboration_intelligence.sql \
            workers/trip-api/src/collaboration-intelligence.ts \
            workers/trip-api/src/collaboration-intelligence-routes.ts \
            workers/trip-api/src/collaboration-intelligence-migration.test.ts \
            workers/trip-api/src/revision-diff.ts \
            workers/trip-api/src/store.ts \
            workers/trip-api/src/revisions.ts \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/phase4.test.ts \
            workers/trip-api/src/*.test.ts \
            apps/web/src/trips/cloud-sync.ts \
            apps/web/src/components/TripCollaborationPanel.tsx \
            apps/web/src/components/CloudTripControls.tsx \
            apps/web/src/components/cloud-trip-phase4-contract.test.ts
          git rm .github/workflows/phase4-pr-prepare.yml
      - name: Commit prepared Phase 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cloud-trip): prepare phase 4 verification [skip ci]"
          git push origin HEAD:feature/cloud-trip-phase4
