name: Finalize bilingual release once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Finalize deployment security and localization
        run: |
          python - <<'PY'
          from pathlib import Path

          traditional = Path("apps/web/src/trips/traditional.ts")
          text = traditional.read_text()
          text = text.replace('  测: "測",\n  览: "覽",\n});', '  测: "測",\n});')
          traditional.write_text(text)

          deploy = Path(".github/workflows/deploy.yml")
          text = deploy.read_text()
          marker_preview = "      - name: Deploy weather-read Worker (preview, read-only)\n"
          marker_production = "      - name: Deploy weather-read Worker (production, read-only)\n"
          if "Configure weather-sync trigger secret (preview)" not in text:
              secret_expr = "$" + "{{ secrets.CLOUDFLARE_API_TOKEN }}"
              preview_block = f'''      - name: Configure weather-sync trigger secret (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: {secret_expr}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$SYNC_TRIGGER_TOKEN" | pnpm --filter @wnr/weather-sync exec wrangler secret put SYNC_TRIGGER_TOKEN --env preview

'''
              text = text.replace(marker_preview, preview_block + marker_preview)
          if "Configure weather-sync trigger secret (production)" not in text:
              secret_expr = "$" + "{{ secrets.CLOUDFLARE_API_TOKEN }}"
              production_block = f'''      - name: Configure weather-sync trigger secret (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: {secret_expr}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$SYNC_TRIGGER_TOKEN" | pnpm --filter @wnr/weather-sync exec wrangler secret put SYNC_TRIGGER_TOKEN --env production

      - name: Refresh production weather snapshot (protected)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: {secret_expr}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --request POST \
            --header "authorization: Bearer $SYNC_TRIGGER_TOKEN" \
            --connect-timeout 15 --max-time 240 \
            "https://where-not-rain-sync-production.ct1150.workers.dev/internal/sync" \
            -o /tmp/production-sync.json
          grep -Fq '"activated":true' /tmp/production-sync.json

'''
              text = text.replace(marker_production, production_block + marker_production)
          deploy.write_text(text)
          PY

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/web/src/trips/traditional.ts \
            apps/web/src/trips/traditional.test.ts \
            apps/web/src/components/LocalizedTripWorkspace.tsx \
            apps/web/src/components/InternationalTripWorkspace.tsx \
            apps/web/src/components/TraditionalTripWorkspace.tsx \
            apps/web/src/components/TripImportForm.tsx \
            apps/web/src/components/SiteHeader.tsx \
            apps/web/src/app/seo.ts \
            apps/web/src/app/sitemap.ts \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/trips/new/page.tsx \
            apps/web/src/app/trips/workspace/page.tsx \
            apps/web/src/app/zh-hant/layout.tsx \
            apps/web/src/app/zh-hant/trips/layout.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/new/page.tsx \
            apps/web/src/app/zh-hant/trips/workspace/page.tsx \
            apps/web/src/seo/seo-wiring.test.ts \
            workers/weather-sync/src/index.ts \
            workers/weather-sync/src/index.test.ts \
            .github/workflows/deploy.yml \
            .github/workflows/verify-trip-product-production.yml

      - name: Commit finalized release
        run: |
          rm .github/workflows/finalize-bilingual-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat(i18n): finalize English and Traditional Chinese product [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
