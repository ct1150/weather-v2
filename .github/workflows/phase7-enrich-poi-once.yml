name: Phase 7 enrich POI once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase7-poi-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/activity-intelligence-phase7'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate OSM pilot POIs
        run: node tooling/poi/generate-osm-pilot-pois.mjs
      - name: Wire generated catalogue and quality gate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/trips/poi-catalog.ts')
          text = path.read_text()
          anchor = 'import type {\n  TripActivityCategory,'
          assert anchor in text
          text = text.replace(anchor, 'import { OSM_PILOT_POIS } from "./poi-catalog-osm.generated";\nimport type {\n  TripActivityCategory,', 1)
          text = text.replace('readonly provenance: "curated-v1";', 'readonly provenance: "curated-v1" | "openstreetmap-v1";\n  readonly sourceRef?: string;', 1)
          text = text.replace('const POIS: ReadonlyArray<CuratedPoi> = [', 'const CURATED_POIS: ReadonlyArray<CuratedPoi> = [', 1)
          marker = '];\n\nconst BY_CITY = new Map<string, ReadonlyArray<CuratedPoi>>();'
          assert marker in text
          replacement = '''\n];\n\nconst curatedNames = new Set(\n  CURATED_POIS.map((item) => `${item.cityId}|${item.name.en.trim().toLocaleLowerCase("en-US")}`),\n);\nconst POIS: ReadonlyArray<CuratedPoi> = [\n  ...CURATED_POIS,\n  ...OSM_PILOT_POIS.filter(\n    (item) => !curatedNames.has(`${item.cityId}|${item.name.en.trim().toLocaleLowerCase("en-US")}`),\n  ),\n];\n\nexport const POI_DATA_ATTRIBUTIONS = Object.freeze([\n  "Curated travel metadata: Where Not Rain curated-v1",\n  "OpenStreetMap-derived candidates: © OpenStreetMap contributors, ODbL 1.0",\n]);\n\nconst BY_CITY = new Map<string, ReadonlyArray<CuratedPoi>>();'''
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          test = Path('apps/web/src/trips/poi-catalog.test.ts')
          content = test.read_text().replace('toBeGreaterThanOrEqual(15)', 'toBeGreaterThanOrEqual(50)')
          content = content.replace('expect(item.provenance).toBe("curated-v1");', 'expect(["curated-v1", "openstreetmap-v1"]).toContain(item.provenance);')
          test.write_text(content)
          PY
      - name: Format generated catalogue
        run: |
          pnpm exec prettier --write \
            tooling/poi/generate-osm-pilot-pois.mjs \
            apps/web/src/trips/poi-catalog-osm.generated.ts \
            apps/web/src/trips/poi-catalog.ts \
            apps/web/src/trips/poi-catalog.test.ts
      - name: Run POI catalogue quality test
        run: pnpm --filter @wnr/web exec vitest run src/trips/poi-catalog.test.ts
      - name: Commit generated data and remove helper
        run: |
          rm .github/workflows/phase7-enrich-poi-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(activity): expand pilot POI catalogue from OpenStreetMap"
          git push origin HEAD:feature/activity-intelligence-phase7
