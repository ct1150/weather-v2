name: Fix weather provider deploy binding once

on:
  push:
    branches:
      - fix/weather-sync-provider-binding
    paths:
      - .github/workflows/fix-weather-provider-deploy-once.yml
  pull_request:
    paths:
      - .github/workflows/fix-weather-provider-deploy-once.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-sync-provider-binding
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove invalid Wrangler provider overrides
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          lines = path.read_text().splitlines(keepends=True)
          output = []
          replaced = {"preview": 0, "production": 0}
          index = 0

          while index < len(lines):
              if (
                  index + 2 < len(lines)
                  and lines[index].strip() == "run: |"
                  and "pnpm --filter @wnr/weather-sync exec wrangler deploy --env " in lines[index + 1]
                  and "--var WEATHER_PRIMARY_PROVIDER=" in lines[index + 2]
              ):
                  command = lines[index + 1].strip().rstrip("\\").rstrip()
                  env_name = "preview" if "--env preview" in command else "production" if "--env production" in command else None
                  if env_name is not None:
                      indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
                      output.append(f"{indent}run: {command}\n")
                      replaced[env_name] += 1
                      index += 3
                      continue
              output.append(lines[index])
              index += 1

          if replaced != {"preview": 1, "production": 1}:
              raise SystemExit(f"unexpected replacement counts: {replaced}")

          path.write_text("".join(output))
          PY
      - name: Format provider binding fix
        run: |
          pnpm exec prettier --write \
            .github/workflows/deploy.yml \
            workers/weather-sync/src/index.ts \
            workers/weather-sync/src/index.test.ts \
            workers/weather-sync/src/provider-binding-contract.test.ts \
            workers/weather-sync/wrangler.toml
      - name: Verify provider binding fix
        run: |
          pnpm --filter @wnr/config build
          pnpm --filter @wnr/weather build
          pnpm --filter @wnr/weather-sync test
          pnpm --filter @wnr/weather-sync build
      - name: Commit implementation and remove helper
        run: |
          rm .github/workflows/fix-weather-provider-deploy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/deploy.yml \
            .github/workflows/fix-weather-provider-deploy-once.yml \
            workers/weather-sync/src/index.ts \
            workers/weather-sync/src/index.test.ts \
            workers/weather-sync/src/provider-binding-contract.test.ts \
            workers/weather-sync/wrangler.toml
          git commit -m "fix(weather): bind production sync to Open-Meteo"
          git push origin HEAD:fix/weather-sync-provider-binding
