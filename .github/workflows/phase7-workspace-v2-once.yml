name: Phase 7 workspace v2 once

on:
  push:
    branches: [feature/activity-intelligence-phase7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - name: Patch workspace v2 contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/trips/workspace.ts')
          text = path.read_text()

          old = 'import type { ParsedTripMarkdown } from "./markdown-parser";\n'
          new = '''import type { ParsedTripMarkdown } from "./markdown-parser";\nimport {\n  activityItemsToLegacy,\n  normalizeActivityItems,\n  type TripActivity,\n} from "./activity-intelligence";\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  readonly activities: ReadonlyArray<string>;\n  readonly notes: string;\n}\n\nexport interface TripWorkspace {\n  readonly version: 1;'''
          new = '''  readonly activities: ReadonlyArray<string>;\n  /** Structured v2 activity model. `activities` remains the portable compatibility projection. */\n  readonly activityItems?: ReadonlyArray<TripActivity>;\n  readonly notes: string;\n}\n\nexport interface TripWorkspace {\n  /** v1 remains accepted as an input contract; normalization always upgrades to v2. */\n  readonly version: 1 | 2;'''
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace('    version: 1,', '    version: 2,')

          old = '''  const activities = Array.isArray(row.activities)\n    ? row.activities\n        .slice(0, MAX_ACTIVITIES_PER_DAY)\n        .map((item) => cleanText(item, 160))\n        .filter(Boolean)\n    : [];\n  const theme: TripDayTheme =\n    row.theme === "beach" || row.theme === "outdoor" || row.theme === "indoor" ? row.theme : "city";\n\n  return {'''
          new = '''  const legacyActivities = Array.isArray(row.activities)\n    ? row.activities\n        .slice(0, MAX_ACTIVITIES_PER_DAY)\n        .map((item) => cleanText(item, 160))\n        .filter(Boolean)\n    : [];\n  const theme: TripDayTheme =\n    row.theme === "beach" || row.theme === "outdoor" || row.theme === "indoor" ? row.theme : "city";\n  const dayId = cleanText(row.id, 80) || `day-${index + 1}`;\n  const cityId = cleanText(row.cityId, 64);\n  const flexible = row.flexible !== false;\n  const notes = cleanText(row.notes, 500);\n  const activityItems = normalizeActivityItems(row.activityItems, legacyActivities, {\n    dayId,\n    cityId,\n    dayTheme: theme,\n    dayFlexible: flexible,\n    dayNotes: notes,\n  });\n\n  return {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    id: cleanText(row.id, 80) || `day-${index + 1}`,\n    dayNumber: index + 1,\n    date: isIsoDate(cleanText(row.date, 10))\n      ? cleanText(row.date, 10)\n      : addDays(fallbackDate, index),\n    cityId: cleanText(row.cityId, 64),\n    cityName: cleanText(row.cityName, 80),\n    countryName: cleanText(row.countryName, 80),\n    theme,\n    flexible: row.flexible !== false,\n    activities,\n    notes: cleanText(row.notes, 500),'''
          new = '''    id: dayId,\n    dayNumber: index + 1,\n    date: isIsoDate(cleanText(row.date, 10))\n      ? cleanText(row.date, 10)\n      : addDays(fallbackDate, index),\n    cityId,\n    cityName: cleanText(row.cityName, 80),\n    countryName: cleanText(row.countryName, 80),\n    theme,\n    flexible,\n    activities: activityItemsToLegacy(activityItems),\n    activityItems,\n    notes,'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/phase7-workspace-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(activity): upgrade normalized workspace to v2"
          git push origin HEAD:feature/activity-intelligence-phase7
