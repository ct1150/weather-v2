name: Phase 6 format once

on:
  push:
    branches:
      - feature/weather-discovery-phase6

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weather-discovery-phase6
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 6 files
        run: |
          pnpm exec prettier --write \
            .github/workflows/verify-weather-discovery.yml \
            apps/web/src/app/discover/page.tsx \
            apps/web/src/app/explore/page.tsx \
            apps/web/src/app/zh-cn/discover/page.tsx \
            apps/web/src/app/zh-cn/page.tsx \
            apps/web/src/app/zh-hant/discover/page.tsx \
            apps/web/src/app/zh-hant/page.tsx \
            apps/web/src/components/WeatherDiscoveryPlannerV2.tsx \
            apps/web/src/components/weather-discovery-phase6-contract.test.ts \
            apps/web/src/discovery/discovery-context.test.ts \
            apps/web/src/discovery/discovery-context.ts \
            apps/web/src/discovery/discovery-trip.test.ts \
            apps/web/src/discovery/discovery-trip.ts \
            apps/web/src/discovery/weather-discovery.test.ts \
            apps/web/src/discovery/weather-discovery.ts \
            docs/superpowers/plans/2026-08-08-weather-discovery-phase6.md \
            tooling/deploy/weather-discovery-smoke.mjs
      - name: Commit formatted files and remove helper
        run: |
          rm .github/workflows/phase6-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(discovery): format phase 6"
          git push origin HEAD:feature/weather-discovery-phase6
