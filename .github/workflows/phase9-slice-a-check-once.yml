name: Phase 9 contextual conversion check once

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase9-contextual-conversion-check
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/conversion-retention-phase9'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/conversion-retention-phase9
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Slice A
        run: |
          pnpm exec prettier --write \
            packages/analytics/src/contextual-conversion.ts \
            packages/analytics/src/contextual-conversion.test.ts \
            packages/analytics/src/index.ts \
            docs/superpowers/plans/2026-08-09-conversion-retention-phase9.md
      - name: Verify contextual conversion and Affiliate safety
        run: |
          pnpm --filter @wnr/analytics test
          pnpm --filter @wnr/analytics build
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/phase9-slice-a-check-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(growth): verify contextual conversion resolver"
          git push origin HEAD:feature/conversion-retention-phase9
