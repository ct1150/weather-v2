# Consolidated post-deploy production verification.
# One hosted runner executes all production smoke checks sequentially.

name: Production Smoke

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"
  SITE_URL: "https://868656.xyz"
  READ_URL: "https://where-not-rain-read-production.ct1150.workers.dev"
  SYNC_URL: "https://where-not-rain-sync-production.ct1150.workers.dev"
  TRIP_URL: "https://trip.868656.xyz"

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies once
        run: pnpm install --frozen-lockfile

      - name: Build test dependencies once
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build

      - name: Wait for production endpoints
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "${SITE_URL}/" >/dev/null \
              && curl --fail --silent --show-error "${TRIP_URL}/health" >/tmp/trip-health.json \
              && curl --fail --silent --show-error "${READ_URL}/health" >/tmp/read-health.json; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production endpoints did not become ready after Deploy"
          exit 1

      - name: Broad production pages and API contracts
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          WEEK_END=$(date -u -d '+6 days' +%F)

          fetch_and_match() {
            NAME="$1"
            URL="$2"
            OUTPUT="$3"
            shift 3
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 45 "${URL}" -o "${OUTPUT}"
            for TEXT in "$@"; do
              if ! grep -Fq "${TEXT}" "${OUTPUT}"; then
                echo "::error::${NAME} missing expected text: ${TEXT}"
                exit 1
              fi
            done
          }

          fetch_and_match "English landing" "${SITE_URL}/trips" /tmp/trips.html \
            "Know what to keep" Tokyo Bangkok Seoul "Import existing itinerary"
          fetch_and_match "English import route" "${SITE_URL}/trips/new" /tmp/trips-new.html \
            "Turn your existing plan into a weather-aware workspace" "Paste the itinerary you already have"
          fetch_and_match "English workspace route" "${SITE_URL}/trips/workspace" /tmp/workspace.html \
            "Opening your trip workspace"
          fetch_and_match "English execution route" "${SITE_URL}/trips/execution" /tmp/execution.html \
            "Trip Execution Mode"
          fetch_and_match "English read-only share route" "${SITE_URL}/trips/share" /tmp/trip-share-page.html \
            "Read-only shared trip" "noindex"
          fetch_and_match "English country direct trip action" "${SITE_URL}/jp" /tmp/weather-en-country.html \
            "Japan" 'data-direct-trip-action="enabled"'
          fetch_and_match "English city-to-trip bridge" "${SITE_URL}/jp/tokyo" /tmp/weather-en-city.html \
            "Tokyo" "Use this weather in your itinerary"

          fetch_and_match "Traditional landing" "${SITE_URL}/zh-hant/trips" /tmp/trips-hant.html \
            "天氣變化時" "東京" "曼谷" "首爾" "匯入現有行程"
          fetch_and_match "Traditional import route" "${SITE_URL}/zh-hant/trips/new" /tmp/trips-new-hant.html \
            "行程匯入器" "貼上已經整理好的旅行行程"
          fetch_and_match "Traditional workspace route" "${SITE_URL}/zh-hant/trips/workspace" /tmp/workspace-hant.html \
            "正在開啟你的行程工作台"
          fetch_and_match "Traditional execution route" "${SITE_URL}/zh-hant/trips/execution" /tmp/execution-hant.html \
            "旅行執行模式"
          fetch_and_match "Traditional read-only share route" "${SITE_URL}/zh-hant/trips/share" /tmp/trip-share-hant.html \
            "唯讀分享行程" "noindex"
          fetch_and_match "Traditional weather radar" "${SITE_URL}/zh-hant" /tmp/weather-hant.html \
            "亞洲旅行天氣雷達" "先看天氣，再決定去哪個城市" "日本"
          fetch_and_match "Traditional country weather route" "${SITE_URL}/zh-hant/jp" /tmp/weather-hant-country.html \
            "國家旅行天氣地圖" "地圖上比較全部旅遊城市" "日本"
          fetch_and_match "Traditional city weather route" "${SITE_URL}/zh-hant/jp/tokyo" /tmp/weather-hant-city.html \
            "目的地天氣" "7 天旅行天氣" "東京" "把天氣結論帶進行程"

          fetch_and_match "Simplified landing" "${SITE_URL}/zh-cn/trips" /tmp/trips-cn.html \
            "天气变化时" "东京" "曼谷" "首尔" "导入现有行程"
          fetch_and_match "Simplified import route" "${SITE_URL}/zh-cn/trips/new" /tmp/trips-new-cn.html \
            "把你现有的计划直接变成天气行程工作台" "粘贴已经整理好的旅行行程"
          fetch_and_match "Simplified execution route" "${SITE_URL}/zh-cn/trips/execution" /tmp/execution-cn.html \
            "旅行执行模式"
          fetch_and_match "Simplified read-only share route" "${SITE_URL}/zh-cn/trips/share" /tmp/trip-share-cn.html \
            "只读分享行程" "noindex"
          fetch_and_match "Simplified country weather route" "${SITE_URL}/zh-cn/jp" /tmp/weather-cn-country.html \
            "国家旅行天气地图" "地图上比较全部旅游城市" "日本" 'data-direct-trip-action="enabled"'
          fetch_and_match "Simplified city weather route" "${SITE_URL}/zh-cn/jp/tokyo" /tmp/weather-cn-city.html \
            "目的地天气" "7 天旅行天气" "东京" "把天气结论带进行程"

          fetch_and_match "Trip cities API" "${READ_URL}/api/v1/trip-cities?locale=en" /tmp/cities.json \
            jp-tokyo th-phuket kr-busan
          fetch_and_match "Cloud Trip API health" "${TRIP_URL}/health" /tmp/cloud-trip-health.json \
            '"ok":true' '"service":"trip-api"' '"cloudTrip":true' '"cloudSharing":true' '"auth":true'
          fetch_and_match "Protected sync health" "${SYNC_URL}/health" /tmp/sync-health.json \
            '"manualTriggerProtected":true'
          fetch_and_match "Trip forecast API" \
            "${READ_URL}/api/v1/trip-forecast?cityIds=jp-tokyo&from=${TODAY}&to=${WEEK_END}&locale=en" \
            /tmp/forecast.json jp-tokyo temperatureMaxC

          CLOUD_TRIP_ANON_STATUS=$(curl --silent --output /tmp/cloud-trip-anonymous.json --write-out '%{http_code}' \
            "${TRIP_URL}/api/v1/trips")
          test "${CLOUD_TRIP_ANON_STATUS}" = "401"

          SYNC_STATUS=$(curl --silent --output /tmp/sync-anonymous.json --write-out '%{http_code}' \
            --request POST "${SYNC_URL}/internal/sync")
          test "${SYNC_STATUS}" = "401"

      - name: Phase 5 — weather intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/trip-weather-intelligence-smoke.mjs \
            --trip-url "${TRIP_URL}" --suffix production

      - name: Phase 6 — weather discovery
        run: |
          node tooling/deploy/weather-discovery-smoke.mjs \
            --site-url "${SITE_URL}" --read-url "${READ_URL}"

      - name: Phase 7 — activity intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/trip-activity-intelligence-smoke.mjs \
            --trip-url "${TRIP_URL}" --suffix production

      - name: Phase 8 — hourly weather
        run: |
          node tooling/deploy/trip-hourly-smoke.mjs \
            --read-url "${READ_URL}" --city jp-tokyo --date "$(date -u +%F)"

      - name: Phase 8 — adaptive replanning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/adaptive-replanning-smoke.mjs \
            --trip-url "${TRIP_URL}" --read-url "${READ_URL}" --suffix production

      - name: Collaboration and revision contracts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/trip-collaboration-smoke.mjs \
            --trip-url "${TRIP_URL}" --suffix production
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/trip-collaboration-intelligence-smoke.mjs \
            --trip-url "${TRIP_URL}" --suffix production

      - name: Localized collaboration surfaces
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 "${SITE_URL}/trips/invite" -o /tmp/invite-en.html
          grep -Fq "Trip collaboration invite" /tmp/invite-en.html
          curl --fail --silent --show-error --location --retry 3 "${SITE_URL}/zh-cn/trips/invite" -o /tmp/invite-cn.html
          grep -Fq "行程协作邀请" /tmp/invite-cn.html
          curl --fail --silent --show-error --location --retry 3 "${SITE_URL}/zh-hant/trips/invite" -o /tmp/invite-hant.html
          grep -Fq "行程協作邀請" /tmp/invite-hant.html

      - name: Phase 9 — trust contracts
        run: |
          pnpm --filter @wnr/analytics exec vitest run \
            src/affiliate-adapter.test.ts \
            src/contextual-conversion.test.ts \
            src/funnel-events.test.ts
          pnpm --filter @wnr/domain exec vitest run \
            src/notification-readiness.test.ts \
            src/product-entitlements.test.ts
          pnpm --filter @wnr/web exec vitest run \
            src/analytics/browser-events.test.ts \
            src/commercial/contextual-affiliate.test.ts \
            src/components/phase9-commercial-surface-contract.test.ts

      - name: Phase 9 — production zero-fill
        run: node tooling/deploy/conversion-retention-live-smoke.mjs --site-url "${SITE_URL}"
