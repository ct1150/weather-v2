# Temporary one-shot workflow. Remove after the D1 binding fix is committed.
name: Fix D1 migration target

on:
  push:
    branches:
      - feature/trip-planner-mvp

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trip-planner-mvp
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the configured D1 binding for migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/deploy.yml")
          content = path.read_text()
          old = "wrangler d1 migrations apply wnr-weather"
          new = "wrangler d1 migrations apply DB"
          count = content.count(old)
          if count == 0:
              raise SystemExit("expected D1 migration command was not found")
          path.write_text(content.replace(old, new))
          print(f"updated {count} D1 migration command(s)")
          PY
          pnpm exec prettier --write .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml
          git commit -m "fix(ci): target configured D1 binding for migrations"
          git push origin HEAD:feature/trip-planner-mvp
