name: Fix rain test expectation

on:
  push:
    branches: [fix/rain-semantics-tooltip-stack]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rain-semantics-tooltip-stack
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/country-weather-explorer.test.tsx')
          text = path.read_text()
          old = 'All 7 days look mostly dry'
          new = '6 of 7 days look mostly dry'
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/components/country-weather-explorer.test.tsx
          rm .github/workflows/fix-rain-test-expectation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/components/country-weather-explorer.test.tsx .github/workflows/fix-rain-test-expectation.yml
          git commit -m "test: align dry-day expectation with stricter threshold"
          git push origin HEAD:fix/rain-semantics-tooltip-stack
