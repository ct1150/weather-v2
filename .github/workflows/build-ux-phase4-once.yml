name: Build UX phase 4 once

on:
  push:
    branches: [agent/ux-phase4]
    paths:
      - .github/ux-phase4-trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-phase4
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply decision-first workspace transforms
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          localized = "apps/web/src/components/LocalizedTripWorkspace.tsx"

          replace(
              localized,
              '    blank: "Start a blank trip",\n',
              '    blank: "Start a blank trip",\n    editDay: "Edit day details",\n    tripSettings: "Trip settings",\n    templatesLabel: "Start from a template",\n    moreActions: "More trip actions",\n    replaceConfirm: "Loading a template will replace your current itinerary. Continue?",\n    blankConfirm: "Starting a blank trip will replace your current itinerary. Continue?",\n',
          )
          replace(
              localized,
              '    blank: "建立空白行程",\n',
              '    blank: "建立空白行程",\n    editDay: "編輯當天安排",\n    tripSettings: "行程設定",\n    templatesLabel: "從範本重新開始",\n    moreActions: "更多行程操作",\n    replaceConfirm: "載入範本會取代目前行程，是否繼續？",\n    blankConfirm: "建立空白行程會取代目前行程，是否繼續？",\n',
          )

          replace(
              localized,
              '''      </header>\n\n      <div className="trip-workspace-fields mt-5">\n''',
              '''      </header>\n\n      <div className="mt-5">\n        <DecisionCard locale={locale} day={day} forecast={forecast} decision={decision} />\n      </div>\n\n      <details className="trip-day-editor mt-5">\n        <summary>{copy.editDay}</summary>\n        <div className="trip-day-editor-body">\n          <div className="trip-workspace-fields">\n''',
          )
          replace(
              localized,
              '''      </div>\n\n      <div className="mt-5">\n        <DecisionCard locale={locale} day={day} forecast={forecast} decision={decision} />\n      </div>\n    </article>\n''',
              '''          </div>\n        </div>\n      </details>\n    </article>\n''',
          )

          replace(
              localized,
              '''  const applyTemplate = useCallback(\n    (templateId: TripWorkspaceTemplateId): void => {\n      const next = localizeWorkspace(\n''',
              '''  const applyTemplate = useCallback(\n    (templateId: TripWorkspaceTemplateId): void => {\n      if (!window.confirm(copy.replaceConfirm)) return;\n      const next = localizeWorkspace(\n''',
          )
          replace(
              localized,
              '''    [copy.sharePath, copy.templateReady, locale, resetWeather, workspaceLocale],\n  );\n\n  const startBlank = useCallback((): void => {\n    const next = createBlankWorkspace({ title: copy.blankTitle });\n''',
              '''    [\n      copy.replaceConfirm,\n      copy.sharePath,\n      copy.templateReady,\n      locale,\n      resetWeather,\n      workspaceLocale,\n    ],\n  );\n\n  const startBlank = useCallback((): void => {\n    if (!window.confirm(copy.blankConfirm)) return;\n    const next = createBlankWorkspace({ title: copy.blankTitle });\n''',
          )
          replace(
              localized,
              '''  }, [copy.blankReady, copy.blankTitle, copy.sharePath, resetWeather]);\n''',
              '''  }, [copy.blankConfirm, copy.blankReady, copy.blankTitle, copy.sharePath, resetWeather]);\n''',
          )

          old_sections = '''      <section className="grid gap-3 rounded-2xl border border-border/80 bg-white p-5 md:grid-cols-3">\n        {templates.map((template) => (\n          <button\n            key={template.id}\n            type="button"\n            className="trip-process-card text-left"\n            onClick={() => applyTemplate(template.id)}\n          >\n            <span>{template.duration}</span>\n            <h3>{template.title}</h3>\n            <p>{template.description}</p>\n            <strong className="mt-4 block text-xs text-primary">{template.route} →</strong>\n          </button>\n        ))}\n      </section>\n\n      <section className="trip-workspace-settings">\n        <label>\n          <span>{copy.tripTitle}</span>\n          <input\n            value={workspace.title}\n            maxLength={120}\n            onChange={(event) =>\n              updateWorkspace((current) => ({ ...current, title: event.target.value }))\n            }\n          />\n        </label>\n        <label>\n          <span>{copy.party}</span>\n          <select\n            value={workspace.partyProfile}\n            onChange={(event) =>\n              updateWorkspace((current) => ({\n                ...current,\n                partyProfile: event.target.value as TripPartyProfile,\n              }))\n            }\n          >\n            {(["adults", "family", "senior"] as const).map((profile) => (\n              <option key={profile} value={profile}>\n                {partyCopy(profile, locale)}\n              </option>\n            ))}\n          </select>\n        </label>\n        <div className="trip-workspace-save-state">\n          <span>{copy.storageLabel}</span>\n          <strong>{copy.storageTitle}</strong>\n          <small>{copy.storageNote}</small>\n        </div>\n      </section>\n\n      <section className="trip-summary-grid" aria-label={copy.average}>\n        <div>\n          <span>{copy.tripLength}</span>\n          <strong>\n            {workspace.days.length} {copy.days}\n          </strong>\n        </div>\n        <div>\n          <span>{copy.forecastCoverage}</span>\n          <strong>\n            {summary.covered}/{workspace.days.length} {copy.days}\n          </strong>\n        </div>\n        <div>\n          <span>{copy.average}</span>\n          <strong>{summary.average === null ? "—" : `${summary.average}/100`}</strong>\n        </div>\n        <div>\n          <span>{copy.highRisk}</span>\n          <strong>{summary.highRisk}</strong>\n        </div>\n      </section>\n'''
          new_sections = '''      <section className="trip-summary-grid" aria-label={copy.average}>\n        <div>\n          <span>{copy.tripLength}</span>\n          <strong>\n            {workspace.days.length} {copy.days}\n          </strong>\n        </div>\n        <div>\n          <span>{copy.forecastCoverage}</span>\n          <strong>\n            {summary.covered}/{workspace.days.length} {copy.days}\n          </strong>\n        </div>\n        <div>\n          <span>{copy.average}</span>\n          <strong>{summary.average === null ? "—" : `${summary.average}/100`}</strong>\n        </div>\n        <div>\n          <span>{copy.highRisk}</span>\n          <strong>{summary.highRisk}</strong>\n        </div>\n      </section>\n\n      <details className="trip-workspace-disclosure">\n        <summary>{copy.tripSettings}</summary>\n        <div className="trip-workspace-disclosure-body">\n          <section className="trip-workspace-settings">\n            <label>\n              <span>{copy.tripTitle}</span>\n              <input\n                value={workspace.title}\n                maxLength={120}\n                onChange={(event) =>\n                  updateWorkspace((current) => ({ ...current, title: event.target.value }))\n                }\n              />\n            </label>\n            <label>\n              <span>{copy.party}</span>\n              <select\n                value={workspace.partyProfile}\n                onChange={(event) =>\n                  updateWorkspace((current) => ({\n                    ...current,\n                    partyProfile: event.target.value as TripPartyProfile,\n                  }))\n                }\n              >\n                {(["adults", "family", "senior"] as const).map((profile) => (\n                  <option key={profile} value={profile}>\n                    {partyCopy(profile, locale)}\n                  </option>\n                ))}\n              </select>\n            </label>\n            <div className="trip-workspace-save-state">\n              <span>{copy.storageLabel}</span>\n              <strong>{copy.storageTitle}</strong>\n              <small>{copy.storageNote}</small>\n            </div>\n          </section>\n        </div>\n      </details>\n\n      <details className="trip-workspace-disclosure">\n        <summary>{copy.templatesLabel}</summary>\n        <div className="trip-workspace-disclosure-body">\n          <section className="grid gap-3 md:grid-cols-3">\n            {templates.map((template) => (\n              <button\n                key={template.id}\n                type="button"\n                className="trip-process-card text-left"\n                onClick={() => applyTemplate(template.id)}\n              >\n                <span>{template.duration}</span>\n                <h3>{template.title}</h3>\n                <p>{template.description}</p>\n                <strong className="mt-4 block text-xs text-primary">{template.route} →</strong>\n              </button>\n            ))}\n          </section>\n        </div>\n      </details>\n'''
          replace(localized, old_sections, new_sections)

          replace(
              localized,
              '''      <div className="flex flex-wrap gap-3">\n        <button type="button" className="trip-primary-button" onClick={addDay}>\n          {copy.addDay}\n        </button>\n        <button type="button" className="trip-secondary-button" onClick={() => window.print()}>\n          {copy.print}\n        </button>\n        <button type="button" className="trip-secondary-button" onClick={startBlank}>\n          {copy.blank}\n        </button>\n      </div>\n''',
              '''      <div className="flex flex-wrap items-start gap-3">\n        <button type="button" className="trip-primary-button" onClick={addDay}>\n          {copy.addDay}\n        </button>\n        <details className="trip-workspace-disclosure min-w-56">\n          <summary>{copy.moreActions}</summary>\n          <div className="trip-workspace-disclosure-body flex flex-wrap gap-3">\n            <button\n              type="button"\n              className="trip-secondary-button"\n              onClick={() => window.print()}\n            >\n              {copy.print}\n            </button>\n            <button type="button" className="trip-secondary-button" onClick={startBlank}>\n              {copy.blank}\n            </button>\n          </div>\n        </details>\n      </div>\n''',
          )

          simplified = "apps/web/src/components/TripWorkspace.tsx"
          replace(
              simplified,
              '''      </header>\n\n      <div className="trip-workspace-fields mt-5">\n''',
              '''      </header>\n\n      <div className="mt-5">\n        <DecisionCard day={day} forecast={forecast} decision={decision} />\n      </div>\n\n      <details className="trip-day-editor mt-5">\n        <summary>编辑当天安排</summary>\n        <div className="trip-day-editor-body">\n          <div className="trip-workspace-fields">\n''',
          )
          replace(
              simplified,
              '''      </div>\n\n      <div className="mt-5">\n        <DecisionCard day={day} forecast={forecast} decision={decision} />\n      </div>\n    </article>\n''',
              '''          </div>\n        </div>\n      </details>\n    </article>\n''',
          )
          old_settings = '''      <section className="trip-workspace-settings mt-5">\n        <label>\n          <span>旅行名称</span>\n          <input\n            value={workspace.title}\n            maxLength={120}\n            onChange={(event) =>\n              updateWorkspace((current) => ({ ...current, title: event.target.value }))\n            }\n          />\n        </label>\n        <label>\n          <span>同行人群</span>\n          <select\n            value={workspace.partyProfile}\n            onChange={(event) =>\n              updateWorkspace((current) => ({\n                ...current,\n                partyProfile: event.target.value as TripPartyProfile,\n              }))\n            }\n          >\n            {(["adults", "family", "senior"] as const).map((profile) => (\n              <option key={profile} value={profile}>\n                {partyCopy(profile)}\n              </option>\n            ))}\n          </select>\n        </label>\n        <div className="trip-workspace-save-state">\n          <span>保存状态</span>\n          <strong>已自动保存在此设备</strong>\n          <small>\n            {weatherUpdatedAt.length === 0\n              ? "天气尚未更新"\n              : `天气更新于 ${new Date(weatherUpdatedAt).toLocaleString("zh-CN")}${weatherStale ? " · 数据可能过期" : ""}`}\n          </small>\n        </div>\n      </section>\n'''
          new_settings = '''      <details className="trip-workspace-disclosure mt-5">\n        <summary>行程设置</summary>\n        <div className="trip-workspace-disclosure-body">\n          <section className="trip-workspace-settings">\n            <label>\n              <span>旅行名称</span>\n              <input\n                value={workspace.title}\n                maxLength={120}\n                onChange={(event) =>\n                  updateWorkspace((current) => ({ ...current, title: event.target.value }))\n                }\n              />\n            </label>\n            <label>\n              <span>同行人群</span>\n              <select\n                value={workspace.partyProfile}\n                onChange={(event) =>\n                  updateWorkspace((current) => ({\n                    ...current,\n                    partyProfile: event.target.value as TripPartyProfile,\n                  }))\n                }\n              >\n                {(["adults", "family", "senior"] as const).map((profile) => (\n                  <option key={profile} value={profile}>\n                    {partyCopy(profile)}\n                  </option>\n                ))}\n              </select>\n            </label>\n            <div className="trip-workspace-save-state">\n              <span>保存状态</span>\n              <strong>已自动保存在此设备</strong>\n              <small>\n                {weatherUpdatedAt.length === 0\n                  ? "天气尚未更新"\n                  : `天气更新于 ${new Date(weatherUpdatedAt).toLocaleString("zh-CN")}${weatherStale ? " · 数据可能过期" : ""}`}\n              </small>\n            </div>\n          </section>\n        </div>\n      </details>\n'''
          replace(simplified, old_settings, new_settings)
          PY

          pnpm exec prettier --write \
            apps/web/src/components/LocalizedTripWorkspace.tsx \
            apps/web/src/components/TripWorkspace.tsx \
            apps/web/src/app/trip-workspace.css
      - name: Commit phase 4
        run: |
          rm .github/workflows/build-ux-phase4-once.yml .github/ux-phase4-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat(ux): make trip workspace decision-first"
          git pull --rebase origin agent/ux-phase4
          git push origin HEAD:agent/ux-phase4
