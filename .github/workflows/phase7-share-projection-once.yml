name: Phase 7 portable share once

on:
  push:
    branches: [feature/activity-intelligence-phase7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep URL shares portable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/trips/workspace.ts')
          text = path.read_text()
          old = '''export function encodeWorkspaceShare(workspace: TripWorkspace): string {
  const payload = JSON.stringify(normalizeWorkspace(workspace, workspace.updatedAt));
  if (payload.length > MAX_SHARE_PAYLOAD) throw new Error("TRIP_SHARE_PAYLOAD_TOO_LARGE");
  return bytesToBase64Url(new TextEncoder().encode(payload));
}
'''
          new = '''function portableShareWorkspace(workspace: TripWorkspace): TripWorkspace {
  const normalized = normalizeWorkspace(workspace, workspace.updatedAt);
  return {
    ...normalized,
    version: 1,
    days: normalized.days.map((day) => ({
      id: day.id,
      dayNumber: day.dayNumber,
      date: day.date,
      cityId: day.cityId,
      cityName: day.cityName,
      countryName: day.countryName,
      theme: day.theme,
      flexible: day.flexible,
      activities: day.activities,
      notes: day.notes,
    })),
  };
}

export function encodeWorkspaceShare(workspace: TripWorkspace): string {
  const payload = JSON.stringify(portableShareWorkspace(workspace));
  if (payload.length > MAX_SHARE_PAYLOAD) throw new Error("TRIP_SHARE_PAYLOAD_TOO_LARGE");
  return bytesToBase64Url(new TextEncoder().encode(payload));
}
'''
          if old not in text:
              raise SystemExit('encodeWorkspaceShare contract changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and verify workspace share
        run: |
          pnpm exec prettier --write apps/web/src/trips/workspace.ts
          pnpm --filter @wnr/web exec vitest run src/trips/workspace.test.ts
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/phase7-share-projection-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(activity): keep workspace shares portable"
          git push origin HEAD:feature/activity-intelligence-phase7
