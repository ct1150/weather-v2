name: Phase 7 portable share once

on:
  push:
    branches: [feature/activity-intelligence-phase7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep URL shares portable
        run: python tooling/phase7-portable-share-patch.py
      - name: Format and verify workspace share
        run: |
          pnpm exec prettier --write apps/web/src/trips/workspace.ts
          pnpm --filter @wnr/web exec vitest run src/trips/workspace.test.ts
      - name: Commit fix and remove helpers
        run: |
          rm .github/workflows/phase7-share-projection-once.yml
          rm tooling/phase7-portable-share-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(activity): keep workspace shares portable"
          git push origin HEAD:feature/activity-intelligence-phase7
