name: Format country weekend SEO

on:
  push:
    branches: [seo/country-weekend-weather]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/country-weekend-weather
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and self-clean
        run: |
          pnpm exec prettier --write apps/web/src/seo/country-weekly-weather-ranking.ts apps/web/src/seo/country-weekly-weather-ranking.test.ts apps/web/src/components/CountryBestWeatherThisWeekPage.tsx apps/web/src/app/sitemap.ts 'apps/web/src/app/[countrySlug]/best-weekend/page.tsx' 'apps/web/src/app/zh-cn/[countrySlug]/best-weekend/page.tsx' 'apps/web/src/app/zh-hant/[countrySlug]/best-weekend/page.tsx'
          rm .github/workflows/format-country-weekend-seo.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format country weekend SEO files"
          git push origin HEAD:seo/country-weekend-weather
