# Where Not Rain — production deployment
#
# Automatic production deployment happens only after code lands on main.
# workflow_dispatch is retained as an explicit emergency/manual release path,
# but the deploy job itself is locked to refs/heads/main.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"
  CLOUDFLARE_ACCOUNT_ID: "b266970852cbc371061c94c5b1fe76a9"
  WEATHER_PRIMARY_PROVIDER: "open-meteo"
  TRIP_PRODUCTION_URL: "https://trip.868656.xyz"
  PRODUCT_ANALYTICS_URL: "https://analytics.868656.xyz/api/v1/product-events"

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library packages
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-results.log
          if grep -qiE "Tests +[0-9]+ failed|Test Files +[0-9]+ failed|FAIL " test-results.log; then
            echo "::error::Unit/integration tests failed — gate is fail-closed."
            exit 1
          fi

      - name: Documentation gate
        run: pnpm docs:check

      - name: Build web static export
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://868656.xyz' }}
          NEXT_PUBLIC_TRIP_API_URL: ${{ env.TRIP_PRODUCTION_URL }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_PRODUCT_ANALYTICS_URL: ${{ env.PRODUCT_ANALYTICS_URL }}
          NEXT_PUBLIC_AFFILIATE_SLOTS: ${{ vars.NEXT_PUBLIC_AFFILIATE_SLOTS }}
          NEXT_PUBLIC_AFFILIATE_OFFERS_JSON: ${{ vars.NEXT_PUBLIC_AFFILIATE_OFFERS_JSON }}
        run: pnpm --filter @wnr/web build

      - name: Build Workers
        run: |
          pnpm --filter @wnr/weather-sync build
          pnpm --filter @wnr/weather-read build
          pnpm --filter @wnr/trip-api build
          pnpm --filter @wnr/product-analytics build

      - name: Pipeline contract tests
        run: node --test tooling/deploy/pipeline-contract.test.mjs

      - name: Secret scan
        run: |
          if grep -RIiE "WEATHERAPI_SECRET|CLOUDFLARE_API_TOKEN|BETTER_AUTH_SECRET|GOOGLE_CLIENT_SECRET|RESEND_API_KEY" apps/web/out apps/web/src workers/trip-api/src workers/product-analytics/src 2>/dev/null; then
            echo "::error::Possible secret leaked into build output or source"
            exit 1
          fi
          echo "secret scan: clean"

      - name: Apply weather D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-sync exec wrangler d1 migrations apply wnr-weather --env production --remote

      - name: Seed production geography
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-sync seed:prod

      - name: Deploy weather-sync Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @wnr/weather-sync exec wrangler deploy --env production \
            --var WEATHER_PRIMARY_PROVIDER=${{ env.WEATHER_PRIMARY_PROVIDER }}

      - name: Configure weather-sync trigger secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$SYNC_TRIGGER_TOKEN" | pnpm --filter @wnr/weather-sync exec wrangler secret put SYNC_TRIGGER_TOKEN --env production

      - name: Refresh production weather snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --request POST \
            --header "authorization: Bearer $SYNC_TRIGGER_TOKEN" \
            --connect-timeout 15 --max-time 240 \
            "https://where-not-rain-sync-production.ct1150.workers.dev/internal/sync" \
            -o /tmp/production-sync.json
          grep -Fq '"activated":true' /tmp/production-sync.json

      - name: Deploy weather-read Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-read exec wrangler deploy --env production

      - name: Deploy product-analytics Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/product-analytics exec wrangler deploy --env production

      - name: Configure growth dashboard password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROWTH_DASHBOARD_PASSWORD: ${{ secrets.GROWTH_DASHBOARD_PASSWORD }}
        run: |
          if [ -n "${GROWTH_DASHBOARD_PASSWORD:-}" ]; then
            printf '%s' "$GROWTH_DASHBOARD_PASSWORD" | pnpm --filter @wnr/product-analytics exec wrangler secret put GROWTH_DASHBOARD_PASSWORD --env production
            echo "Private growth dashboard enabled."
          else
            echo "GROWTH_DASHBOARD_PASSWORD is not configured; /growth remains disabled."
          fi

      - name: Apply Trip D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/trip-api exec wrangler d1 migrations apply wnr-trip-production --env production --remote

      - name: Deploy trip-api Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/trip-api exec wrangler deploy --env production

      - name: Configure trip-api secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          AUTH_SECRET="${CONFIGURED_AUTH_SECRET:-$(printf 'wnr-trip-auth:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)}"
          MIGRATION_TOKEN="$(printf 'wnr-trip-migrate:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$AUTH_SECRET" | pnpm --filter @wnr/trip-api exec wrangler secret put BETTER_AUTH_SECRET --env production
          printf '%s' "$MIGRATION_TOKEN" | pnpm --filter @wnr/trip-api exec wrangler secret put INTERNAL_MIGRATION_TOKEN --env production
          printf '%s' "$SMOKE_TOKEN" | pnpm --filter @wnr/trip-api exec wrangler secret put INTERNAL_SMOKE_TOKEN --env production
          if [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | pnpm --filter @wnr/trip-api exec wrangler secret put GOOGLE_CLIENT_ID --env production
            printf '%s' "$GOOGLE_CLIENT_SECRET" | pnpm --filter @wnr/trip-api exec wrangler secret put GOOGLE_CLIENT_SECRET --env production
          fi
          if [ -n "${RESEND_API_KEY:-}" ]; then
            printf '%s' "$RESEND_API_KEY" | pnpm --filter @wnr/trip-api exec wrangler secret put RESEND_API_KEY --env production
          fi

      - name: Migrate Better Auth schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          MIGRATION_TOKEN="$(printf 'wnr-trip-migrate:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --request POST \
            --header "authorization: Bearer $MIGRATION_TOKEN" \
            --connect-timeout 15 --max-time 90 \
            "${TRIP_PRODUCTION_URL}/internal/migrate-auth" \
            -o /tmp/trip-auth-production.json
          grep -Fq '"migrated":true' /tmp/trip-auth-production.json

      - name: Deploy web to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/web exec wrangler pages deploy out --project-name where-not-rain --branch main

      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_SITE_HOST: ${{ vars.INDEXNOW_SITE_HOST }}
        run: pnpm indexnow:submit

      - name: Production weather smoke
        env:
          WORKER_PRODUCTION_URL: ${{ secrets.WORKER_PRODUCTION_URL }}
        run: node tooling/deploy/sync-smoke.mjs --worker-url "${WORKER_PRODUCTION_URL:-}"
