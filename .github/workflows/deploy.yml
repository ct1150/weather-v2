# Where Not Rain — Deploy to Cloudflare Pages
#
# Pipeline (docs/08 DEP-CICD-001): install -> verify -> build (static export)
# -> dry-run gates (no Cloudflare API) -> secret scan -> real `wrangler pages deploy`.
#
# - push to `main`      -> production deploy
# - internal PR          -> preview deploy (exposes Cloudflare token)
# - fork PR              -> gates ONLY, no token (no deploy)  [security boundary]
#
# The static export is built ONCE into `apps/web/out/` and the SAME artifact is
# uploaded (never rebuilt). D1 migrations are intentionally absent this phase.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --- Install (locked package manager) ---------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Verify gates -----------------------------------------------------
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: pnpm test

      - name: Documentation gate
        run: pnpm docs:check

      # --- Build (static export -> apps/web/out/) ---------------------------
      - name: Build web (Next.js static export)
        run: pnpm --filter @wnr/web build

      # --- Dry-run gates (NEVER contact Cloudflare API) ---------------------
      - name: Pipeline contract tests
        run: node --test tooling/deploy/pipeline-contract.test.mjs

      - name: Build immutable artifact identity
        run: |
          node tooling/deploy/build-immutable-artifact.mjs \
            --workspace apps/web \
            --output-dir .artifacts/web \
            --identity-file .artifacts/web-artifact-id.txt
          echo "artifact id: $(cat .artifacts/web-artifact-id.txt)"

      - name: Preview smoke (static out/ identity check)
        run: |
          node -e "const {previewSmoke}=await import('./tooling/deploy/preview-smoke.mjs'); \
          const {loadRecord,computeArtifactId}=await import('./tooling/deploy/deploy-core.mjs'); \
          const fs=await import('node:fs'); \
          const dir='apps/web/out'; \
          const artifactId=computeArtifactId(dir); \
          const rec={artifactId,artifactDir:dir,boundUrl:'https://where-not-rain.pages.dev'}; \
          const r=previewSmoke({record:rec,expectedArtifactId:artifactId}); \
          if(!r.ok){console.error(r.errors);process.exit(1);} \
          console.log('preview-smoke OK for',artifactId);"

      # --- Secret scan (no real secret in source / build output) ------------
      - name: Secret scan
        run: |
          if grep -RIiE "WEATHERAPI_SECRET|CLOUDFLARE_API_TOKEN" apps/web/out apps/web/src 2>/dev/null; then
            echo "::error::Possible secret leaked into build output or source"; exit 1
          fi
          echo "secret scan: clean"

      # --- Real deploy (production) -----------------------------------------
      - name: Deploy to production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @wnr/web exec wrangler pages deploy out --project-name where-not-rain

      # --- Real deploy (preview, internal PR only) --------------------------
      - name: Deploy preview (internal PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @wnr/web exec wrangler pages deploy out --branch ${{ github.event.pull_request.number }} --project-name where-not-rain
