# Where Not Rain — Deploy to Cloudflare Pages + weather Workers
#
# Pipeline: install -> verify -> build -> dry-run gates -> secret scan -> real deploy.
# The static export is built once and the same artifact is promoted.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"
  CLOUDFLARE_ACCOUNT_ID: "b266970852cbc371061c94c5b1fe76a9"
  WEATHER_PRIMARY_PROVIDER: "open-meteo"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library packages (emit dist + .d.ts for typecheck)
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: |
          pnpm test 2>&1 | tee test-results.log
          if grep -qiE "Tests +[0-9]+ failed|Test Files +[0-9]+ failed|FAIL " test-results.log; then
            echo "::error::Unit/integration tests failed — gate is fail-closed."
            exit 1
          fi

      - name: Documentation gate
        run: pnpm docs:check

      - name: Build web (Next.js static export)
        env:
          APP_BASE_URL: https://868656.xyz
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
        run: pnpm --filter @wnr/web build

      - name: Build weather-sync Worker
        run: pnpm --filter @wnr/weather-sync build

      - name: Build weather-read Worker
        run: pnpm --filter @wnr/weather-read build

      - name: Pipeline contract tests
        run: node --test tooling/deploy/pipeline-contract.test.mjs

      - name: Build immutable artifact identity
        run: |
          node tooling/deploy/build-immutable-artifact.mjs \
            --workspace apps/web \
            --output-dir .artifacts/web \
            --identity-file .artifacts/web-artifact-id.txt
          echo "artifact id: $(cat .artifacts/web-artifact-id.txt)"

      - name: Preview smoke (static out/ identity check)
        run: |
          node -e "const {previewSmoke}=await import('./tooling/deploy/preview-smoke.mjs'); \
          const {computeArtifactId}=await import('./tooling/deploy/deploy-core.mjs'); \
          const dir='apps/web/out'; \
          const artifactId=computeArtifactId(dir); \
          const rec={artifactId,artifactDir:dir,boundUrl:'https://where-not-rain.pages.dev'}; \
          const r=previewSmoke({record:rec,expectedArtifactId:artifactId}); \
          if(!r.ok){console.error(r.errors);process.exit(1);} \
          console.log('preview-smoke OK for',artifactId);"

      - name: Secret scan
        run: |
          if grep -RIiE "WEATHERAPI_SECRET|CLOUDFLARE_API_TOKEN" apps/web/out apps/web/src 2>/dev/null; then
            echo "::error::Possible secret leaked into build output or source"
            exit 1
          fi
          echo "secret scan: clean"

      # Preview deployment is available only to internal pull requests.
      - name: Apply D1 migrations (preview, 0001 ONLY — no 0002)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-sync exec wrangler d1 migrations apply wnr-weather --env preview --remote

      - name: Seed preview geography (idempotent)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-sync seed:preview

      - name: Deploy weather-sync Worker (preview, NO Cron)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @wnr/weather-sync exec wrangler deploy --env preview \
            --var WEATHER_PRIMARY_PROVIDER=${{ env.WEATHER_PRIMARY_PROVIDER }}

      - name: Configure weather-sync trigger secret (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$SYNC_TRIGGER_TOKEN" | pnpm --filter @wnr/weather-sync exec wrangler secret put SYNC_TRIGGER_TOKEN --env preview

      - name: Deploy weather-read Worker (preview, read-only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-read exec wrangler deploy --env preview

      - name: Extended preview smoke (KV hit / D1 fallback / no user-path provider call)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          WORKER_PREVIEW_URL: ${{ secrets.WORKER_PREVIEW_URL }}
        run: node tooling/deploy/sync-smoke.mjs --worker-url "${WORKER_PREVIEW_URL:-}"

      - name: Deploy preview (internal PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/web exec wrangler pages deploy out --branch ${{ github.event.pull_request.number }} --project-name where-not-rain

      # Production promotion runs only for main.
      - name: Apply D1 migrations (production, 0001 ONLY — no 0002)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-sync exec wrangler d1 migrations apply wnr-weather --env production --remote

      - name: Seed production geography (idempotent)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-sync seed:prod

      - name: Deploy weather-sync Worker (production, Cron registered)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @wnr/weather-sync exec wrangler deploy --env production \
            --var WEATHER_PRIMARY_PROVIDER=${{ env.WEATHER_PRIMARY_PROVIDER }}

      - name: Configure weather-sync trigger secret (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$SYNC_TRIGGER_TOKEN" | pnpm --filter @wnr/weather-sync exec wrangler secret put SYNC_TRIGGER_TOKEN --env production

      - name: Refresh production weather snapshot (protected)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --request POST \
            --header "authorization: Bearer $SYNC_TRIGGER_TOKEN" \
            --connect-timeout 15 --max-time 240 \
            "https://where-not-rain-sync-production.ct1150.workers.dev/internal/sync" \
            -o /tmp/production-sync.json
          grep -Fq '"activated":true' /tmp/production-sync.json

      - name: Deploy weather-read Worker (production, read-only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/weather-read exec wrangler deploy --env production

      - name: Deploy to production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/web exec wrangler pages deploy out --project-name where-not-rain --branch main

      - name: Notify IndexNow of updated canonical URLs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: pnpm indexnow:submit

      - name: Production smoke (active snapshot freshness / Cron registered)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WORKER_PRODUCTION_URL: ${{ secrets.WORKER_PRODUCTION_URL }}
        run: node tooling/deploy/sync-smoke.mjs --worker-url "${WORKER_PRODUCTION_URL:-}"
