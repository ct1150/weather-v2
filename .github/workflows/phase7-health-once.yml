name: Phase 7 health once

on:
  push:
    branches: [feature/activity-intelligence-phase7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - name: Add Phase 7 health flags
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('workers/trip-api/src/index.ts')
          text = path.read_text()
          old = '''      revisionDiff: true,\n      weatherIntelligence: true,\n'''
          new = '''      revisionDiff: true,\n      workspaceV2: true,\n      activityIntelligence: true,\n      structuredActivityRevisionDiff: true,\n      weatherIntelligence: true,\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and remove helper
        run: |
          rm .github/workflows/phase7-health-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(activity): expose phase 7 health flags"
          git push origin HEAD:feature/activity-intelligence-phase7
