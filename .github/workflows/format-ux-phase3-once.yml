name: Format UX phase 3 once

on:
  push:
    branches: [agent/ux-phase3]
    paths:
      - .github/ux-phase3-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-phase3
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/web/src/app/trips/new/page.tsx \
            apps/web/src/app/zh-cn/trips/new/page.tsx \
            apps/web/src/app/zh-hant/trips/new/page.tsx \
            apps/web/src/components/SmartTripImportForm.tsx \
            apps/web/src/trips/import-inference.ts \
            apps/web/src/trips/import-inference.test.ts \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx
      - run: |
          rm .github/workflows/format-ux-phase3-once.yml .github/ux-phase3-format-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(ux): format smart itinerary import"
          git pull --rebase origin agent/ux-phase3
          git push origin HEAD:agent/ux-phase3
