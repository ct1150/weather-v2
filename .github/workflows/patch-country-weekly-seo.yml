      { "@type": "ItemList", "@id": `${pageUrl}#ranking`, name: `${name}基本不下雨旅行地排行`, numberOfItems: topItems.length, itemListElement: topItems.map((item, index) => ({ "@type": "ListItem", position: index + 1, name: item.cityName, url: new URL(item.path, siteBase).toString() })) },
