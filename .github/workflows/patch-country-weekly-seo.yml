name: Patch country weekly SEO

on:
  push:
    branches: [seo/country-weekly-weather]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/country-weekly-weather
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply country weekly SEO patch
        run: |
          python - <<'PY'
          from pathlib import Path

          ranking = Path('apps/web/src/seo/weekly-weather-ranking.ts')
          text = ranking.read_text()
          anchor = '''export function buildWeeklyWeatherRanking(
  dataset: BakedDataset,
  locale: PublishedLocale,
): ReadonlyArray<WeeklyWeatherRankItem> {
  const items = projectedCities(dataset, locale).map((city) => rankItem(city, city.days, locale));
  return sortRanking(items);
}
'''
          addition = anchor + '''
export function buildCountryWeeklyWeatherRanking(
  dataset: BakedDataset,
  countrySlug: string,
  locale: PublishedLocale,
): ReadonlyArray<WeeklyWeatherRankItem> {
  const projectionLocale = locale === "zh-hant" ? "zh-cn" : locale;
  const projected = projectCountry(dataset, countrySlug, projectionLocale);
  const items = (projected.weatherCities ?? []).map((city) => rankItem(city, city.days, locale));
  return sortRanking(items);
}
'''
          if anchor not in text:
              raise SystemExit('weekly ranking anchor not found')
          ranking.write_text(text.replace(anchor, addition, 1))

          component = Path('apps/web/src/components/BestWeatherThisWeekPage.tsx')
          text = component.read_text()
          old = '''  jsonLd,
  mode = "week",
}: {
  readonly locale: PublishedLocale;
  readonly items: ReadonlyArray<WeeklyWeatherRankItem>;
  readonly dataUpdatedAt: string;
  readonly jsonLd?: Readonly<Record<string, unknown>>;
  readonly mode?: WeatherRankingMode;
}): ReactElement {
  const copy = (mode === "weekend" ? WEEKEND_COPY : WEEK_COPY)[locale];
'''
          new = '''  jsonLd,
  mode = "week",
  scopeName,
}: {
  readonly locale: PublishedLocale;
  readonly items: ReadonlyArray<WeeklyWeatherRankItem>;
  readonly dataUpdatedAt: string;
  readonly jsonLd?: Readonly<Record<string, unknown>>;
  readonly mode?: WeatherRankingMode;
  readonly scopeName?: string;
}): ReactElement {
  const copy = (mode === "weekend" ? WEEKEND_COPY : WEEK_COPY)[locale];
  const scopedTitle =
    scopeName === undefined
      ? copy.title
      : locale === "en"
        ? `Best weather in ${scopeName} this ${mode === "weekend" ? "weekend" : "week"}`
        : locale === "zh-cn"
          ? `${scopeName}${mode === "weekend" ? "本周末" : "这周"}哪里天气更好？`
          : `${scopeName}${mode === "weekend" ? "本週末" : "這週"}哪裡天氣更好？`;
  const scopedIntro =
    scopeName === undefined
      ? copy.intro
      : locale === "en"
        ? `Compare supported destinations in ${scopeName} by mostly rain-free days, expected precipitation and peak rain chance. The ranking uses the same weather rules as the country map and city pages.`
        : locale === "zh-cn"
          ? `比较${scopeName}已收录旅行地的基本不下雨天数、预计总降雨和最高降雨概率，判断这周更适合去哪里。排行与国家地图、城市页使用同一套规则。`
          : `比較${scopeName}已收錄旅行地的基本不下雨天數、預計總降雨和最高降雨機率，判斷這週更適合去哪裡。排行與國家地圖、城市頁使用同一套規則。`;
  const scopedRanking =
    scopeName === undefined
      ? copy.ranking
      : locale === "en"
        ? `Best travel weather in ${scopeName}`
        : locale === "zh-cn"
          ? `${scopeName}未来 7 天天气排行`
          : `${scopeName}未來 7 天天氣排行`;
'''
          if old not in text:
              raise SystemExit('component signature anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('{copy.title}', '{scopedTitle}', 1)
          text = text.replace('{copy.intro}', '{scopedIntro}', 1)
          text = text.replace('{copy.ranking}', '{scopedRanking}', 1)
          component.write_text(text)

          sitemap = Path('apps/web/src/app/sitemap.ts')
          text = sitemap.read_text()
          old = '''    const cities = dataset.citiesByCountry.get(country.id) ?? [];
    for (const city of cities) {
'''
          new = '''    const cities = dataset.citiesByCountry.get(country.id) ?? [];
    if (cities.length >= 3) {
      entries.push(
        ...localizedSitemapEntries(
          `/${country.slug}/best-weather-this-week`,
          { lastModified, changeFrequency: "daily" },
          ["en", "zh-cn", "zh-hant"],
        ),
      );
    }
    for (const city of cities) {
'''
          if old not in text:
              raise SystemExit('sitemap anchor not found')
          sitemap.write_text(text.replace(old, new, 1))

          route_templates = {
            'apps/web/src/app/[countrySlug]/best-weather-this-week/page.tsx': '''import type { Metadata } from "next";
import { notFound } from "next/navigation";
import type { ReactElement } from "react";
import { getBakedDataset } from "../../../build/bake";
import { BestWeatherThisWeekPage } from "../../../components/BestWeatherThisWeekPage";
import { buildCountryWeeklyWeatherRanking } from "../../../seo/weekly-weather-ranking";
import { buildAlternates, localeUrl, routeRobots } from "../../seo";

const MIN_DESTINATIONS = 3;

export async function generateStaticParams(): Promise<ReadonlyArray<{ countrySlug: string }>> {
  const dataset = await getBakedDataset();
  return dataset.countries
    .filter((country) => (dataset.citiesByCountry.get(country.id) ?? []).length >= MIN_DESTINATIONS)
    .map((country) => ({ countrySlug: country.slug }));
}

export async function generateMetadata({ params }: { params: { countrySlug: string } }): Promise<Metadata> {
  const dataset = await getBakedDataset();
  const country = dataset.countries.find((item) => item.slug === params.countrySlug);
  if (country === undefined) return { title: "Country weather this week" };
  const path = `/${country.slug}/best-weather-this-week`;
  const title = `${country.name.en} weather this week: best mostly rain-free cities | Where Not Rain`;
  const description = `Compare ${country.name.en} destinations for the next 7 days by mostly rain-free days, expected precipitation and peak rain chance.`;
  return {
    title: { absolute: title },
    description,
    alternates: buildAlternates(path, "en", ["en", "zh-cn", "zh-hant"]),
    robots: routeRobots("ranking", true),
    openGraph: { type: "website", url: localeUrl("en", path), siteName: "Where Not Rain", title, description },
  };
}

export default async function Page({ params }: { params: { countrySlug: string } }): Promise<ReactElement> {
  const dataset = await getBakedDataset();
  const country = dataset.countries.find((item) => item.slug === params.countrySlug);
  if (country === undefined) notFound();
  const cities = dataset.citiesByCountry.get(country.id) ?? [];
  if (cities.length < MIN_DESTINATIONS) notFound();
  const items = buildCountryWeeklyWeatherRanking(dataset, country.slug, "en");
  const path = `/${country.slug}/best-weather-this-week`;
  const pageUrl = localeUrl("en", path);
  const topItems = items.slice(0, 20);
  const description = `Compare ${country.name.en} destinations for the next 7 days by mostly rain-free days, expected precipitation and peak rain chance.`;
  const jsonLd: Record<string, unknown> = {
    "@context": "https://schema.org",
    "@graph": [
      { "@type": "CollectionPage", "@id": `${pageUrl}#webpage`, name: `Best weather in ${country.name.en} this week`, description, url: pageUrl, dateModified: dataset.dataUpdatedAt, inLanguage: "en", mainEntity: { "@id": `${pageUrl}#ranking` } },
      { "@type": "ItemList", "@id": `${pageUrl}#ranking`, name: `${country.name.en} mostly rain-free destination ranking`, numberOfItems: topItems.length, itemListElement: topItems.map((item, index) => ({ "@type": "ListItem", position: index + 1, name: item.cityName, url: localeUrl("en", item.path) })) },
    ],
  };
  return <BestWeatherThisWeekPage locale="en" items={items} dataUpdatedAt={dataset.dataUpdatedAt} jsonLd={jsonLd} scopeName={country.name.en} />;
}
''',
            'apps/web/src/app/zh-cn/[countrySlug]/best-weather-this-week/page.tsx': '''import type { Metadata } from "next";
