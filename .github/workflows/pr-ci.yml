name: Country Switch Production Verification

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: country-switch-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'verify/local-country-switch-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production release
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://868656.xyz"
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 \
                "${SITE_URL}/jp" -o /tmp/jp.html \
              && grep -Fq 'data-country-switch-mode="local-state-history"' /tmp/jp.html; then
              echo "Production contains the fully local country switch implementation."
              exit 0
            fi
            sleep 8
          done
          echo "::error::Production did not expose the local country switch implementation."
          exit 1

      - name: Verify localized country maps
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://868656.xyz"
          check_page() {
            local name="$1"
            local path="$2"
            local title="$3"
            local output="$4"
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --connect-timeout 15 --max-time 45 "${SITE_URL}${path}" -o "${output}"
            grep -Fq 'data-country-switch-mode="local-state-history"' "${output}" || {
              echo "::error::${name} missing local country switch mode"
              exit 1
            }
            grep -Fq 'data-render-mode="inline-svg"' "${output}" || {
              echo "::error::${name} missing inline country map"
              exit 1
            }
            grep -Fq 'data-country-map-title' "${output}" || {
              echo "::error::${name} missing locally-updatable country title"
              exit 1
            }
            grep -Fq "${title}" "${output}" || {
              echo "::error::${name} missing expected title"
              exit 1
            }
            if grep -Fq 'data-testid="country-prefetch-links"' "${output}"; then
              echo "::error::${name} still renders country prefetch links"
              exit 1
            fi
          }

          check_page "English Japan" "/jp" "Japan travel weather at a glance" /tmp/jp.html
          check_page "Simplified Japan" "/zh-cn/jp" "一张图看懂日本哪里天气更好" /tmp/jp-cn.html
          check_page "Traditional Japan" "/zh-hant/jp" "一張圖看懂日本哪裡天氣更好" /tmp/jp-hant.html
          check_page "English Korea" "/kr" "South Korea travel weather at a glance" /tmp/kr.html

      - name: Verify sun icon and production services
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 https://868656.xyz/favicon.svg -o /tmp/favicon.svg
          grep -Fq 'Where Not Rain sun' /tmp/favicon.svg
          grep -Fq '#fbbf24' /tmp/favicon.svg

          curl --fail --silent --show-error --retry 3 \
            https://where-not-rain-read-production.ct1150.workers.dev/health -o /tmp/read.json
          grep -Fq '"ok":true' /tmp/read.json

          curl --fail --silent --show-error --retry 3 \
            https://trip.868656.xyz/health -o /tmp/trip.json
          grep -Fq '"ok":true' /tmp/trip.json

          curl --fail --silent --show-error --retry 3 \
            https://analytics.868656.xyz/health -o /tmp/analytics.json
          grep -Fq '"ok":true' /tmp/analytics.json
