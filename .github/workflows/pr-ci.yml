name: PR CI

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: china-taiwan-country-map-implementation
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.pull_request.number == 73 && github.head_ref == 'feat/china-taiwan-country-maps'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/china-taiwan-country-maps
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply catalogue expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')

          seed_path = 'apps/web/src/build/geography.seed.ts'
          seed = read(seed_path)
          if 'id: "CN"' not in seed:
              country_blocks = '''    {
      id: "CN",
      iso2: "CN",
      slug: "cn",
      defaultTimezone: "Asia/Shanghai",
      name: names("China", "中国", "중국", "中国", "中國"),
      summary: {
        en: "Compare major city, mountain, plateau and southern-coast weather across China in one view.",
        "zh-cn": "一张图比较北京、上海、西安、成都、云南与华南等主要旅行地天气。",
        "zh-tw": "一張圖比較北京、上海、西安、成都、雲南與華南等主要旅行地天氣。",
      },
    },
    {
      id: "TW",
      iso2: "TW",
      slug: "tw",
      defaultTimezone: "Asia/Taipei",
      name: names("Taiwan", "台湾", "대만", "台湾", "台灣"),
      summary: {
        en: "Compare northern, central, southern and eastern travel weather across Taiwan in one glance.",
        "zh-cn": "一张图比较台北、台中、台南、高雄、花莲、台东等旅行地天气。",
        "zh-tw": "一張圖比較台北、台中、台南、高雄、花蓮、台東等旅行地天氣。",
      },
    },
'''
              seed = seed.replace('  ],\n  cities: [', country_blocks + '  ],\n  cities: [', 1)

          if 'id: "beijing"' not in seed:
              city_blocks = '''    {
      id: "beijing",
      countryId: "CN",
      slug: "beijing",
      latitude: 39.9042,
      longitude: 116.4074,
      timezone: "Asia/Shanghai",
      isFeatured: false,
      name: names("Beijing", "北京", "베이징", "北京"),
    },
    {
      id: "shanghai",
      countryId: "CN",
      slug: "shanghai",
      latitude: 31.2304,
      longitude: 121.4737,
      timezone: "Asia/Shanghai",
      isFeatured: false,
      name: names("Shanghai", "上海", "상하이", "上海"),
    },
    {
      id: "xian",
      countryId: "CN",
      slug: "xian",
      latitude: 34.3416,
      longitude: 108.9398,
      timezone: "Asia/Shanghai",
      isFeatured: false,
      name: names("Xi'an", "西安", "시안", "西安"),
    },
    {
      id: "chengdu",
      countryId: "CN",
      slug: "chengdu",
      latitude: 30.5728,
