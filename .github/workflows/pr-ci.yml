# Temporary production verifier for the OPC retention Phase 2 release.
# It checks the already completed main Deploy and Production Smoke, verifies
# server-rendered locale markers and public health, and never deploys this branch.

name: PR CI

on:
  pull_request:
    types: [ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  TARGET_SHA: "05ae767e2fb5c01c61aa66f4c268c2ff016f8c0e"
  SITE_URL: "https://868656.xyz"
  READ_URL: "https://where-not-rain-read-production.ct1150.workers.dev"
  TRIP_URL: "https://trip.868656.xyz"

jobs:
  verify_release:
    if: github.head_ref == 'verify/opc-retention-phase2-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release workflows, localized surface and health
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          latest_run() {
            local workflow="$1"
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f branch=main -f per_page=50 \
              | jq -c --arg sha "${TARGET_SHA}" \
                '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty'
          }

          DEPLOY_JSON="$(latest_run deploy.yml)"
          SMOKE_JSON="$(latest_run production-smoke.yml)"
          test -n "${DEPLOY_JSON}"
          test -n "${SMOKE_JSON}"
          test "$(jq -r '.status' <<<"${DEPLOY_JSON}")" = "completed"
          test "$(jq -r '.conclusion' <<<"${DEPLOY_JSON}")" = "success"
          test "$(jq -r '.status' <<<"${SMOKE_JSON}")" = "completed"
          test "$(jq -r '.conclusion' <<<"${SMOKE_JSON}")" = "success"

          fetch_and_match() {
            local name="$1"
            local url="$2"
            local output="$3"
            shift 3
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 45 "${url}" -o "${output}"
            for expected in "$@"; do
              grep -Fq "${expected}" "${output}" || {
                echo "::error::${name} missing expected text: ${expected}"
                exit 1
              }
            done
          }

          # Dynamic result headings and interpolated counts are intentionally not
          # asserted in raw HTML. These markers are server-rendered before hydration.
          fetch_and_match "English discovery" "${SITE_URL}/discover" /tmp/retention-en.html \
            "Saved" "Starting city" "Find 3 dry-weather destinations"
          fetch_and_match "Simplified discovery" "${SITE_URL}/zh-cn/discover" /tmp/retention-cn.html \
            "已保存" "出发城市" "找 3 个少雨目的地"
          fetch_and_match "Traditional discovery" "${SITE_URL}/zh-hant/discover" /tmp/retention-hant.html \
            "已儲存" "出發城市" "找 3 個少雨目的地"
          fetch_and_match "Trip API health" "${TRIP_URL}/health" /tmp/trip-health.json \
            '"ok":true' '"service":"trip-api"'
          fetch_and_match "Weather Read health" "${READ_URL}/health" /tmp/read-health.json \
            '"ok":true'

          echo "Deploy run: $(jq -r '.id' <<<"${DEPLOY_JSON}") — success"
          echo "Production Smoke run: $(jq -r '.id' <<<"${SMOKE_JSON}") — success"
          echo "Three-locale saved-search control: passed"
          echo "Public API health: passed"
          echo "Overall: success"
