name: Remove retired weather limits once

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

jobs:
  remove-retired-limits:
    if: github.head_ref == 'fix/remove-retired-weather-limits'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-retired-weather-limits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove retired UI and stale filter behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          explorer = Path('apps/web/src/components/InstantCountryWeatherExplorer.tsx')
          text = explorer.read_text(encoding='utf-8')

          def sub_once(pattern: str, replacement: str, value: str) -> str:
              updated, count = re.subn(pattern, replacement, value, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {pattern[:80]}')
              return updated

          text = sub_once(
              r'\nfunction activeFilterCount\(filters: WeatherFilters\): number \{.*?\n\}\n',
              '\n',
              text,
          )
          text = text.replace('  const filterCount = activeFilterCount(filters);\n', '')
          text = sub_once(
              r'\n  function updateFilter\(field: keyof WeatherFilters, raw: string\): void \{.*?\n  \}\n\n  function clearFilters\(\): void \{.*?\n  \}\n',
              '\n',
              text,
          )
          text = sub_once(
              r'\n      <details className="country-filter-details">.*?\n      </details>\n',
              '\n',
              text,
          )
          text = sub_once(
              r'\n            <p className=\{`country-filter-result .*?\n            \) : null\}\n',
              '\n',
              text,
          )
          text = text.replace(
              '      setFilters({\n        rainMax: parseNumber(params.get("rainMax")),\n        windMax: parseNumber(params.get("windMax")),\n        tempMin: parseNumber(params.get("tempMin")),\n        tempMax: parseNumber(params.get("tempMax")),\n      });',
              '      setFilters(EMPTY_FILTERS);\n      for (const key of ["rainMax", "windMax", "tempMin", "tempMax"] as const) {\n        params.delete(key);\n      }',
          )
          explorer.write_text(text, encoding='utf-8')

          contract = Path('apps/web/src/components/production-smoke-copy-contract.test.ts')
          text = contract.read_text(encoding='utf-8')
          text = text.replace(
              '    expect(instantMapStyles).toContain(".country-filter-details");\n    expect(instantMapStyles).toContain("display: none !important");\n    expect(instantMapStyles).toContain("Legacy shared URLs must not dim destinations");',
              '    expect(explorer).not.toContain(\'<details className="country-filter-details">\');\n    expect(explorer).not.toContain("updateFilter(");\n    expect(instantMapStyles).toContain("Legacy shared URLs must not dim destinations");',
          )
          contract.write_text(text, encoding='utf-8')
          PY

      - name: Format and focused validation
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/InstantCountryWeatherExplorer.tsx \
            apps/web/src/components/production-smoke-copy-contract.test.ts
          pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
          pnpm --filter @wnr/web typecheck
          pnpm --filter @wnr/web exec vitest run \
            src/components/country-weather-explorer.test.tsx \
            src/components/production-smoke-copy-contract.test.ts

      - name: Publish source-only hotfix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/src/components/InstantCountryWeatherExplorer.tsx \
            apps/web/src/components/production-smoke-copy-contract.test.ts
          git commit -m "fix: remove retired weather limit controls"
          git push origin HEAD:fix/remove-retired-weather-limits
