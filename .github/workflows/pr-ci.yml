# Lightweight pull-request validation.
# Draft PR pushes do not allocate a hosted runner. Validation starts when the PR
# is marked Ready for review, and re-runs only for subsequent non-draft updates.

name: PR CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Autoformat world map files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/world-map-mobile-contract.test.ts \
            apps/web/src/components/world-supported-country-geometry.ts \
            apps/web/src/components/WorldWeatherMap.tsx \
            tooling/e2e/world-map-browser.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/web/src/components/world-map-mobile-contract.test.ts \
              apps/web/src/components/world-supported-country-geometry.ts \
              apps/web/src/components/WorldWeatherMap.tsx \
              tooling/e2e/world-map-browser.mjs
            git commit -m "style(home): format country choropleth map"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library packages
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-results.log
          if grep -qiE "Tests +[0-9]+ failed|Test Files +[0-9]+ failed|FAIL " test-results.log; then
            echo "::error::Unit/integration tests failed — gate is fail-closed."
            exit 1
          fi

      - name: Documentation gate
        run: pnpm docs:check

      - name: Build web static export
        env:
          APP_BASE_URL: https://868656.xyz
          NEXT_PUBLIC_TRIP_API_URL: https://trip.868656.xyz
          NEXT_PUBLIC_PRODUCT_ANALYTICS_URL: https://analytics.868656.xyz/api/v1/product-events
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED: "false"
        run: pnpm --filter @wnr/web build

      - name: Browser E2E world map
        run: node tooling/e2e/world-map-browser.mjs

      - name: Upload world map E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-map-browser-e2e
          path: artifacts/e2e/world-map-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Build Workers
        run: |
          pnpm --filter @wnr/weather-sync build
          pnpm --filter @wnr/weather-read build
          pnpm --filter @wnr/trip-api build
          pnpm --filter @wnr/product-analytics build

      - name: Pipeline contract tests
        run: node --test tooling/deploy/pipeline-contract.test.mjs

      - name: Secret scan
        run: |
          if grep -RIiE "WEATHERAPI_SECRET|CLOUDFLARE_API_TOKEN|BETTER_AUTH_SECRET|GOOGLE_CLIENT_SECRET|RESEND_API_KEY" apps/web/out apps/web/src workers/trip-api/src workers/product-analytics/src 2>/dev/null; then
            echo "::error::Possible secret leaked into build output or source"
            exit 1
          fi
          echo "secret scan: clean"
