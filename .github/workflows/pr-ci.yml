# Temporary, non-merge production verifier for PR #67.
name: PR CI

on:
  pull_request:
    types: [ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: country-map-production-release-verification
  cancel-in-progress: false

env:
  TARGET_SHA: "3d7ad26e6e1d6e8ec703792c0f8881a68fe87d64"
  SITE_URL: "https://868656.xyz"
  READ_URL: "https://where-not-rain-read-production.ct1150.workers.dev"
  TRIP_URL: "https://trip.868656.xyz"
  ANALYTICS_URL: "https://analytics.868656.xyz"
  ANALYTICS_ENDPOINT: "https://analytics.868656.xyz/api/v1/product-events"

jobs:
  verify_release:
    if: github.event.pull_request.number == 67 && github.head_ref == 'verify/country-map-production-release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verify/country-map-production-release
          fetch-depth: 0

      - name: Verify release workflows and production surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u

          DEPLOY_ID=""
          DEPLOY_CONCLUSION="not-found"
          DEPLOY_URL=""
          SMOKE_ID=""
          SMOKE_CONCLUSION="not-found"
          SMOKE_URL=""
          OVERALL="success"
          ERRORS=""

          append_error() {
            OVERALL="failure"
            ERRORS="${ERRORS}\n- $1"
            echo "::error::$1"
          }

          latest_run() {
            local workflow="$1"
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f branch=main -f per_page=50 2>/dev/null \
              | jq -c --arg sha "${TARGET_SHA}" \
                '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty'
          }

          wait_for_run() {
            local workflow="$1"
            local dispatch_after="$2"
            local run=""
            local dispatched="false"
            for attempt in $(seq 1 220); do
              run="$(latest_run "${workflow}")"
              if [ -n "${run}" ] && [ "$(jq -r '.status' <<<"${run}")" = "completed" ]; then
                printf '%s' "${run}"
                return 0
              fi
              if [ -z "${run}" ] && [ "${dispatched}" = "false" ] && [ "${attempt}" -ge "${dispatch_after}" ]; then
                echo "No ${workflow} run found for ${TARGET_SHA}; dispatching main" >&2
                if gh workflow run "${workflow}" --ref main; then
                  dispatched="true"
                fi
              fi
              sleep 6
            done
            return 1
          }

          fetch_and_match() {
            local name="$1"
            local url="$2"
            local output="$3"
            shift 3
            if ! curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 45 "${url}" -o "${output}"; then
              append_error "${name} could not be fetched"
              return
            fi
            for expected in "$@"; do
              if ! grep -Fq "${expected}" "${output}"; then
                append_error "${name} missing expected text: ${expected}"
              fi
            done
          }

          assert_absent() {
            local name="$1"
            local output="$2"
            shift 2
            for forbidden in "$@"; do
              if grep -Fq "${forbidden}" "${output}"; then
                append_error "${name} still contains obsolete text: ${forbidden}"
              fi
            done
          }

          echo "Waiting for Deploy on ${TARGET_SHA}"
          if DEPLOY_JSON="$(wait_for_run deploy.yml 5)"; then
            DEPLOY_ID="$(jq -r '.id' <<<"${DEPLOY_JSON}")"
            DEPLOY_CONCLUSION="$(jq -r '.conclusion' <<<"${DEPLOY_JSON}")"
            DEPLOY_URL="$(jq -r '.html_url' <<<"${DEPLOY_JSON}")"
            if [ "${DEPLOY_CONCLUSION}" != "success" ]; then
              append_error "Deploy concluded ${DEPLOY_CONCLUSION}"
            fi
          else
            append_error "Deploy did not complete within the verification window"
          fi

          if [ "${DEPLOY_CONCLUSION}" = "success" ]; then
            echo "Waiting for Production Smoke on ${TARGET_SHA}"
            if SMOKE_JSON="$(wait_for_run production-smoke.yml 10)"; then
              SMOKE_ID="$(jq -r '.id' <<<"${SMOKE_JSON}")"
              SMOKE_CONCLUSION="$(jq -r '.conclusion' <<<"${SMOKE_JSON}")"
              SMOKE_URL="$(jq -r '.html_url' <<<"${SMOKE_JSON}")"
              if [ "${SMOKE_CONCLUSION}" != "success" ]; then
                append_error "Production Smoke concluded ${SMOKE_CONCLUSION}"
              fi
            else
              append_error "Production Smoke did not complete within the verification window"
            fi
          fi

          if [ "${DEPLOY_CONCLUSION}" = "success" ]; then
            fetch_and_match "English homepage" "${SITE_URL}/" /tmp/home-en.html \
              "Pick a country. See where the weather looks better." "Choose a country" "Open weather map"
            fetch_and_match "Simplified homepage" "${SITE_URL}/zh-cn" /tmp/home-cn.html \
              "选择一个国家，一张图看懂哪里天气更好。" "选择国家" "打开天气地图"
            fetch_and_match "Traditional homepage" "${SITE_URL}/zh-hant" /tmp/home-hant.html \
              "選擇一個國家，一張圖看懂哪裡天氣更好。" "選擇國家" "打開天氣地圖"

            fetch_and_match "English Japan map" "${SITE_URL}/jp" /tmp/jp-en.html \
              "Japan travel weather at a glance" "Popular destinations at a glance" "Next 7 days"
            fetch_and_match "Simplified Japan map" "${SITE_URL}/zh-cn/jp" /tmp/jp-cn.html \
              "一张图看懂日本哪里天气更好" "热门旅游地天气一目了然" "未来 7 天"
            fetch_and_match "Traditional Japan map" "${SITE_URL}/zh-hant/jp" /tmp/jp-hant.html \
              "一張圖看懂日本哪裡天氣更好" "熱門旅遊地天氣一目了然" "未來 7 天"

            assert_absent "English homepage" /tmp/home-en.html \
              "Starting city" "Max one-way planning time" "Find 3 dry-weather destinations"
            assert_absent "Simplified homepage" /tmp/home-cn.html \
              "出发城市" "最长单程规划时间" "找 3 个少雨目的地"
            assert_absent "Traditional homepage" /tmp/home-hant.html \
              "出發城市" "最長單程規劃時間" "找 3 個少雨目的地"
            assert_absent "English Japan map" /tmp/jp-en.html \
              "Travel Score" "Build this trip" "ranks first"

            fetch_and_match "Manifest" "${SITE_URL}/manifest.webmanifest" /tmp/manifest.json \
              '"start_url": "/"' '"url": "/"'
            assert_absent "Manifest" /tmp/manifest.json '"url": "/discover"'

            fetch_and_match "Sitemap" "${SITE_URL}/sitemap.xml" /tmp/sitemap.xml \
              "${SITE_URL}/jp" "${SITE_URL}/zh-cn/jp" "${SITE_URL}/zh-hant/jp"
            assert_absent "Sitemap" /tmp/sitemap.xml "${SITE_URL}/discover"

            fetch_and_match "Product analytics health" "${ANALYTICS_URL}/health" /tmp/analytics-health.json \
              '"ok":true' '"service":"product-analytics"' '"storage":"d1"'
            fetch_and_match "Trip API health" "${TRIP_URL}/health" /tmp/trip-health.json \
              '"ok":true' '"service":"trip-api"'
            fetch_and_match "Weather Read health" "${READ_URL}/health" /tmp/read-health.json \
              '"ok":true'

            PREFLIGHT_STATUS=$(curl --silent --show-error --output /tmp/preflight-body.txt \
              --dump-header /tmp/preflight-headers.txt --write-out '%{http_code}' \
              --request OPTIONS \
              --header "origin: ${SITE_URL}" \
              --header "access-control-request-method: POST" \
              --header "access-control-request-headers: content-type" \
              "${ANALYTICS_ENDPOINT}")
            if [ "${PREFLIGHT_STATUS}" != "204" ]; then
              append_error "Product analytics preflight returned ${PREFLIGHT_STATUS}"
            fi
            if ! grep -Fiq "access-control-allow-origin: ${SITE_URL}" /tmp/preflight-headers.txt; then
              append_error "Product analytics preflight missing canonical CORS origin"
            fi

            OCCURRED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            ACCEPT_STATUS=$(curl --silent --show-error --output /tmp/accepted-event.json \
              --write-out '%{http_code}' --request POST \
              --header "origin: ${SITE_URL}" \
              --header "content-type: application/json" \
              --data "{\"event\":\"country_viewed\",\"event_version\":1,\"occurred_at\":\"${OCCURRED_AT}\",\"route_template\":\"/[country]\",\"locale\":\"en\",\"country_code\":\"JP\"}" \
              "${ANALYTICS_ENDPOINT}")
            if [ "${ACCEPT_STATUS}" != "202" ] || ! grep -Fq '"accepted":true' /tmp/accepted-event.json; then
              append_error "Country-map analytics event was not accepted (HTTP ${ACCEPT_STATUS})"
            fi

            DENIED_STATUS=$(curl --silent --show-error --output /tmp/denied-event.json \
              --write-out '%{http_code}' --request POST \
              --header "origin: https://example.invalid" \
              --header "content-type: application/json" \
              --data "{\"event\":\"country_viewed\",\"event_version\":1,\"occurred_at\":\"${OCCURRED_AT}\",\"route_template\":\"/[country]\",\"locale\":\"en\",\"country_code\":\"JP\"}" \
              "${ANALYTICS_ENDPOINT}")
            if [ "${DENIED_STATUS}" != "403" ] || ! grep -Fq '"origin_not_allowed"' /tmp/denied-event.json; then
              append_error "Unapproved analytics origin was not denied"
            fi

            python - <<'PY' > /tmp/jp-scripts.txt
          import re
          from pathlib import Path
          html = Path('/tmp/jp-en.html').read_text(encoding='utf-8')
          for src in re.findall(r'<script[^>]+src="([^"]+\.js[^"]*)"', html):
              print(src)
          PY
            BUNDLE_OK=false
            while IFS= read -r src; do
              [ -n "${src}" ] || continue
              case "${src}" in
                http://*|https://*) script_url="${src}" ;;
                /*) script_url="${SITE_URL}${src}" ;;
                *) script_url="${SITE_URL}/${src}" ;;
              esac
              if curl --fail --silent --show-error --location --retry 3 "${script_url}" -o /tmp/jp-chunk.js \
                && grep -Fq "country-weather-marker" /tmp/jp-chunk.js \
                && grep -Fq "${ANALYTICS_ENDPOINT}" /tmp/jp-chunk.js; then
                BUNDLE_OK=true
                break
              fi
            done < /tmp/jp-scripts.txt
            if [ "${BUNDLE_OK}" != "true" ]; then
              append_error "Production country-map bundle or analytics endpoint could not be verified"
            fi
          fi

          {
            echo "# Country weather map production verification"
            echo
            echo "- Target main SHA: \`${TARGET_SHA}\`"
            echo "- Deploy run: ${DEPLOY_ID:-not-found}"
            echo "- Deploy conclusion: ${DEPLOY_CONCLUSION}"
            echo "- Deploy URL: ${DEPLOY_URL:-not-found}"
            echo "- Production Smoke run: ${SMOKE_ID:-not-found}"
            echo "- Production Smoke conclusion: ${SMOKE_CONCLUSION}"
            echo "- Production Smoke URL: ${SMOKE_URL:-not-found}"
            echo "- Three localized homepages: $([ "${OVERALL}" = "success" ] && echo passed || echo see-errors)"
            echo "- Three localized Japan maps: $([ "${OVERALL}" = "success" ] && echo passed || echo see-errors)"
            echo "- Sitemap and PWA cutover: $([ "${OVERALL}" = "success" ] && echo passed || echo see-errors)"
            echo "- Analytics health, CORS and event write: $([ "${OVERALL}" = "success" ] && echo passed || echo see-errors)"
            echo "- Trip API and Weather Read health: $([ "${OVERALL}" = "success" ] && echo passed || echo see-errors)"
            echo "- Overall: ${OVERALL}"
            echo
            echo "## Errors"
            if [ -n "${ERRORS}" ]; then
              printf '%b\n' "${ERRORS}"
            else
              echo "None"
            fi
          } > country-map-production-verification.md

          cat country-map-production-verification.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add country-map-production-verification.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: record country-map production verification"
            git push origin HEAD:verify/country-map-production-release
          fi

          if [ "${OVERALL}" != "success" ]; then
            exit 1
          fi
