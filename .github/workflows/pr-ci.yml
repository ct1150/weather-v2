# Lightweight pull-request validation.
# Draft PR pushes do not allocate a hosted runner. PR #55 temporarily uses its
# ready-for-review event to apply the OPC cutover, then restores this workflow
# from main before the resulting synchronize event runs normal verification.

name: PR CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"

jobs:
  apply_opc_cutover:
    if: github.event.action == 'ready_for_review' && github.event.pull_request.number == 55
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: fix/focus-discovery-on-dry
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply OPC product cutover
        run: python tooling/one-off/opc_product_cutover.py

      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            README.md \
            .github/workflows/production-smoke.yml \
            tooling/deploy/weather-discovery-smoke.mjs \
            packages/analytics/src/events.ts \
            packages/analytics/src/funnel-events.test.ts \
            apps/web/public/manifest.webmanifest \
            apps/web/src/app/layout.tsx \
            apps/web/src/app/page.tsx \
            apps/web/src/app/sitemap.ts \
            apps/web/src/app/travel-radar.test.ts \
            apps/web/src/app/discover/page.tsx \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/zh-cn/page.tsx \
            apps/web/src/app/zh-cn/discover/page.tsx \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/page.tsx \
            apps/web/src/app/zh-hant/discover/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/components/SiteHeader.tsx \
            apps/web/src/components/WeatherDiscoveryPlannerV2.tsx \
            apps/web/src/components/group-decision-scope-contract.test.ts \
            apps/web/src/components/phase9-commercial-surface-contract.test.ts \
            apps/web/src/components/production-smoke-copy-contract.test.ts \
            apps/web/src/components/trip-execution-pwa-contract.test.ts \
            apps/web/src/components/ux-funnel-contract.test.ts \
            apps/web/src/components/weather-discovery-phase6-contract.test.ts \
            apps/web/src/discovery/weather-discovery.ts \
            apps/web/src/discovery/weather-discovery.test.ts \
            apps/web/src/e2e/critical-paths.test.ts \
            docs/superpowers/product/2026-08-19-founder-prd-opc-dry-destination-engine.md \
            docs/superpowers/plans/2026-08-19-opc-product-cutover-phase0.md

      - name: Restore CI workflow and commit implementation
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/pr-ci.yml
          git rm -f .github/workflows/apply-opc-product-cutover-once.yml
          git rm -f tooling/one-off/opc_product_cutover.py
          git rm -f tooling/one-off/opc-cutover-error.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete OPC product cutover"
          git push origin HEAD:fix/focus-discovery-on-dry

  verify:
    if: >-
      github.event.pull_request.draft == false &&
      !(github.event.action == 'ready_for_review' && github.event.pull_request.number == 55)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library packages
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-results.log
          if grep -qiE "Tests +[0-9]+ failed|Test Files +[0-9]+ failed|FAIL " test-results.log; then
            echo "::error::Unit/integration tests failed — gate is fail-closed."
            exit 1
          fi

      - name: Documentation gate
        run: pnpm docs:check

      - name: Build web static export
        env:
          APP_BASE_URL: https://868656.xyz
          NEXT_PUBLIC_TRIP_API_URL: https://trip.868656.xyz
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED: "false"
        run: pnpm --filter @wnr/web build

      - name: Build Workers
        run: |
          pnpm --filter @wnr/weather-sync build
          pnpm --filter @wnr/weather-read build
          pnpm --filter @wnr/trip-api build

      - name: Pipeline contract tests
        run: node --test tooling/deploy/pipeline-contract.test.mjs

      - name: Secret scan
        run: |
          if grep -RIiE "WEATHERAPI_SECRET|CLOUDFLARE_API_TOKEN|BETTER_AUTH_SECRET|GOOGLE_CLIENT_SECRET|RESEND_API_KEY" apps/web/out apps/web/src workers/trip-api/src 2>/dev/null; then
            echo "::error::Possible secret leaked into build output or source"
            exit 1
          fi
          echo "secret scan: clean"
