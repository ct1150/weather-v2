name: Production release verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-production:
    if: github.head_ref == 'verify/instant-country-switch-release'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for released country map
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://868656.xyz"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "${SITE_URL}/zh-cn/jp" -o /tmp/jp.html || true
            if grep -Fq 'data-country-switch-mode="optimistic-background-route"' /tmp/jp.html 2>/dev/null \
              && grep -Fq 'data-render-mode="inline-svg"' /tmp/jp.html \
              && grep -Fq '哪里不下雨' /tmp/jp.html \
              && grep -Fq '全部已收录旅行地天气一目了然' /tmp/jp.html; then
              echo "Latest country-switch release is live."
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "::error::Latest country-switch release did not become visible in production"
              exit 1
            fi
            sleep 5
          done

      - name: Verify localized country routes and visual contracts
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://868656.xyz"
          fetch() {
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "$1" -o "$2"
          }
          fetch "${SITE_URL}/jp" /tmp/en.html
          fetch "${SITE_URL}/zh-cn/jp" /tmp/cn.html
          fetch "${SITE_URL}/zh-hant/jp" /tmp/hant.html
          fetch "${SITE_URL}/favicon.svg" /tmp/favicon.svg

          for file in /tmp/en.html /tmp/cn.html /tmp/hant.html; do
            grep -Fq 'data-country-switch-mode="optimistic-background-route"' "$file"
            grep -Fq 'data-render-mode="inline-svg"' "$file"
            grep -Fq 'data-city-count="8"' "$file"
            count=$(grep -o 'data-testid="country-weather-marker"' "$file" | wc -l | tr -d ' ')
            test "$count" = "8"
          done

          grep -Fq '哪里不下雨' /tmp/cn.html
          grep -Fq '哪裡不下雨' /tmp/hant.html
          grep -Fq 'Where Not Rain sun' /tmp/favicon.svg
          grep -Fq '#fbbf24' /tmp/favicon.svg

          if grep -Fq '可选天气限制' /tmp/cn.html; then
            echo "::error::Retired optional weather limits are visible in production"
            exit 1
          fi

      - name: Verify services remain healthy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://where-not-rain-read-production.ct1150.workers.dev/health | grep -Fq '"ok":true'
          curl --fail --silent --show-error https://trip.868656.xyz/health | grep -Fq '"ok":true'
          curl --fail --silent --show-error https://analytics.868656.xyz/health | grep -Fq '"ok":true'
