# Temporary, non-merge diagnostic for the Phase 2.5 analytics release.
name: PR CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: opc-analytics-phase25-production-diagnostic
  cancel-in-progress: true

env:
  TARGET_SHA: "d7f446d5a84806642e14a49c5756334a06f8c1f8"

jobs:
  diagnose_release:
    if: github.event.pull_request.draft == false && github.head_ref == 'verify/opc-analytics-phase25-release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show Deploy and Production Smoke results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_run() {
            local workflow="$1"
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f branch=main -f per_page=50 \
              | jq -c --arg sha "${TARGET_SHA}" \
                '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty'
          }

          DEPLOY_JSON="$(latest_run deploy.yml)"
          SMOKE_JSON="$(latest_run production-smoke.yml)"
          test -n "${DEPLOY_JSON}"
          echo "Deploy id=$(jq -r '.id' <<<"${DEPLOY_JSON}") status=$(jq -r '.status' <<<"${DEPLOY_JSON}") conclusion=$(jq -r '.conclusion' <<<"${DEPLOY_JSON}") url=$(jq -r '.html_url' <<<"${DEPLOY_JSON}")"
          if [ -n "${SMOKE_JSON}" ]; then
            echo "Production Smoke id=$(jq -r '.id' <<<"${SMOKE_JSON}") status=$(jq -r '.status' <<<"${SMOKE_JSON}") conclusion=$(jq -r '.conclusion' <<<"${SMOKE_JSON}") url=$(jq -r '.html_url' <<<"${SMOKE_JSON}")"
          else
            echo "Production Smoke: no run found for target SHA"
          fi
          test "$(jq -r '.conclusion' <<<"${DEPLOY_JSON}")" = "success"
          test -n "${SMOKE_JSON}"
          test "$(jq -r '.conclusion' <<<"${SMOKE_JSON}")" = "success"
