# Lightweight pull-request validation.
# Draft PR pushes do not allocate a hosted runner. PR #57 uses its one-time
# ready-for-review event to apply the Phase 1 reachability change, then normal
# verification runs on the resulting synchronize event.

name: PR CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"

jobs:
  apply_reachability_phase1:
    if: github.event.action == 'ready_for_review' && github.event.pull_request.number == 57
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agent/opc-reachability-phase1
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reachability implementation
        run: python tooling/one-off/reachability_phase1.py

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            README.md \
            tooling/deploy/weather-discovery-smoke.mjs \
            apps/web/src/app/page.tsx \
            apps/web/src/app/discover/page.tsx \
            apps/web/src/app/zh-cn/page.tsx \
            apps/web/src/app/zh-cn/discover/page.tsx \
            apps/web/src/app/zh-hant/page.tsx \
            apps/web/src/app/zh-hant/discover/page.tsx \
            apps/web/src/components/WeatherDiscoveryPlannerV2.tsx \
            apps/web/src/components/group-decision-scope-contract.test.ts \
            apps/web/src/components/production-smoke-copy-contract.test.ts \
            apps/web/src/components/ux-funnel-contract.test.ts \
            apps/web/src/components/weather-discovery-phase6-contract.test.ts \
            apps/web/src/discovery/reachability.ts \
            apps/web/src/discovery/reachability.test.ts \
            docs/superpowers/product/2026-08-19-founder-prd-opc-dry-destination-engine.md \
            docs/superpowers/plans/2026-08-19-opc-product-cutover-phase0.md \
            docs/superpowers/plans/2026-08-19-opc-reachability-phase1.md

      - name: Focused typecheck and regression tests
        run: |
          pnpm --filter @wnr/web typecheck
          pnpm --filter @wnr/web exec vitest run \
            src/discovery/reachability.test.ts \
            src/discovery/weather-discovery.test.ts \
            src/components/weather-discovery-phase6-contract.test.ts \
            src/components/ux-funnel-contract.test.ts \
            src/components/group-decision-scope-contract.test.ts \
            src/components/production-smoke-copy-contract.test.ts

      - name: Commit non-workflow implementation
        run: |
          git rm -f tooling/one-off/reachability_phase1.py
          git rm -f tooling/one-off/reachability-phase1-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add static origin reachability filtering"
          git push origin HEAD:agent/opc-reachability-phase1

  verify:
    if: >-
      github.event.pull_request.draft == false &&
      !(github.event.action == 'ready_for_review' && github.event.pull_request.number == 57)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build library packages
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / integration tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-results.log
          if grep -qiE "Tests +[0-9]+ failed|Test Files +[0-9]+ failed|FAIL " test-results.log; then
            echo "::error::Unit/integration tests failed — gate is fail-closed."
            exit 1
          fi

      - name: Documentation gate
        run: pnpm docs:check

      - name: Build web static export
        env:
          APP_BASE_URL: https://868656.xyz
          NEXT_PUBLIC_TRIP_API_URL: https://trip.868656.xyz
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED: "false"
        run: pnpm --filter @wnr/web build

      - name: Build Workers
        run: |
          pnpm --filter @wnr/weather-sync build
          pnpm --filter @wnr/weather-read build
          pnpm --filter @wnr/trip-api build

      - name: Pipeline contract tests
        run: node --test tooling/deploy/pipeline-contract.test.mjs

      - name: Secret scan
        run: |
          if grep -RIiE "WEATHERAPI_SECRET|CLOUDFLARE_API_TOKEN|BETTER_AUTH_SECRET|GOOGLE_CLIENT_SECRET|RESEND_API_KEY" apps/web/out apps/web/src workers/trip-api/src 2>/dev/null; then
            echo "::error::Possible secret leaked into build output or source"
            exit 1
          fi
          echo "secret scan: clean"
