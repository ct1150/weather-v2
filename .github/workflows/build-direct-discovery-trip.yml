                href={cityDetailHref(summary.city.path)}
                className="country-city-forecast-link focus-ring"
              >
                7 天天氣 <span aria-hidden="true">→</span>
              </a>''',
            '''              <DiscoveryTripAction
                locale="zh-hant"
