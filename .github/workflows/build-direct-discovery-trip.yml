          Path("apps/web/src/components/CityTripBridgeAction.tsx").write_text(dedent(r'''
          "use client";

          import { useEffect, useState, type ReactElement } from "react";
          import { addDestinationRangeToWorkspace } from "../trips/add-destination";
          import {
            TRIP_WORKSPACE_STORAGE_KEY,
            normalizeWorkspace,
            type TripWorkspace,
          } from "../trips/workspace";

          interface CityTripBridgeActionProps {
            readonly cityId: string;
            readonly cityName: string;
            readonly countryName: string;
            readonly defaultDate: string;
            readonly workspacePath: string;
            readonly buttonLabel: string;
            readonly blankTitle: string;
            readonly rangePrefix: string;
          }

          function validDate(value: string | null): value is string {
            return value !== null && /^\d{4}-\d{2}-\d{2}$/u.test(value);
          }

          function rangeDates(start: string, end: string): string[] {
            const first = new Date(`${start}T00:00:00Z`);
            const last = new Date(`${end}T00:00:00Z`);
            if (Number.isNaN(first.getTime()) || Number.isNaN(last.getTime()) || last < first) return [start];
            const dates: string[] = [];
            for (const cursor = new Date(first); cursor <= last && dates.length < 16; cursor.setUTCDate(cursor.getUTCDate() + 1)) {
              dates.push(cursor.toISOString().slice(0, 10));
            }
            return dates;
          }

          function readStoredWorkspace(): TripWorkspace | null {
            const stored = window.localStorage.getItem(TRIP_WORKSPACE_STORAGE_KEY);
            if (stored === null) return null;
            try {
              return normalizeWorkspace(JSON.parse(stored) as unknown);
            } catch {
              return null;
            }
          }

          export function CityTripBridgeAction({
            cityId,
            cityName,
            countryName,
            defaultDate,
            workspacePath,
            buttonLabel,
            blankTitle,
            rangePrefix,
          }: CityTripBridgeActionProps): ReactElement {
            const [range, setRange] = useState<{ start: string; end: string } | null>(null);

            useEffect(() => {
              const params = new URLSearchParams(window.location.search);
              const start = params.get("start");
              const end = params.get("end");
              if (validDate(start)) setRange({ start, end: validDate(end) ? end : start });
            }, []);

            const addToTrip = (): void => {
              const start = range?.start ?? defaultDate;
              const end = range?.end ?? start;
              const dates = validDate(start) ? rangeDates(start, validDate(end) ? end : start) : [];
              const next = addDestinationRangeToWorkspace(
                readStoredWorkspace(),
                { cityId, cityName, countryName },
                dates,
                { blankTitle },
              );
              window.localStorage.setItem(TRIP_WORKSPACE_STORAGE_KEY, JSON.stringify(next));
              window.location.assign(workspacePath);
            };

            return (
              <div className="flex shrink-0 flex-col items-start gap-2 sm:items-end">
                {range !== null ? (
                  <p className="text-xs font-semibold text-muted">
                    {rangePrefix}: {range.start}
                    {range.end === range.start ? "" : ` – ${range.end}`}
                  </p>
                ) : null}
                <button type="button" className="trip-primary-button" onClick={addToTrip}>
                  {buttonLabel}
                </button>
              </div>
            );
          }
          ''').lstrip())

          Path("apps/web/src/trips/add-destination.test.ts").write_text(dedent(r'''
          import { describe, expect, it } from "vitest";

          import { addDestinationRangeToWorkspace, addDestinationToWorkspace } from "./add-destination";
          import { createBlankWorkspace } from "./workspace";

          const destination = {
            cityId: "jp-tokyo",
            cityName: "Tokyo",
            countryName: "Japan",
            date: "2026-08-09",
          } as const;

          describe("addDestinationToWorkspace", () => {
            it("reuses a pristine blank day", () => {
              const workspace = createBlankWorkspace({
                now: "2026-08-07T00:00:00.000Z",
                id: "trip-1",
                title: "My trip",
              });
              const next = addDestinationToWorkspace(workspace, destination, {
                now: "2026-08-07T01:00:00.000Z",
              });

              expect(next.days).toHaveLength(1);
              expect(next.days[0]).toMatchObject({
                cityId: "jp-tokyo",
                cityName: "Tokyo",
                countryName: "Japan",
                date: "2026-08-09",
              });
            });

            it("appends without replacing existing itinerary content", () => {
              const base = createBlankWorkspace({
                now: "2026-08-07T00:00:00.000Z",
                id: "trip-2",
                title: "Existing trip",
              });
              const existing = {
                ...base,
                days: [
                  {
                    ...base.days[0]!,
                    cityId: "kr-seoul",
                    cityName: "Seoul",
                    countryName: "South Korea",
                    activities: ["09:00 Gyeongbokgung"],
                  },
                ],
              };

              const next = addDestinationToWorkspace(existing, destination, {
                now: "2026-08-07T01:00:00.000Z",
              });

              expect(next.title).toBe("Existing trip");
              expect(next.days).toHaveLength(2);
              expect(next.days[0]?.cityId).toBe("kr-seoul");
              expect(next.days[0]?.activities).toEqual(["09:00 Gyeongbokgung"]);
              expect(next.days[1]).toMatchObject({ cityId: "jp-tokyo", date: "2026-08-09" });
            });
          });

          describe("addDestinationRangeToWorkspace", () => {
            it("turns a selected weather range into itinerary days", () => {
              const workspace = createBlankWorkspace({
                now: "2026-08-07T00:00:00.000Z",
                id: "trip-range",
                title: "Japan trip",
              });
              const next = addDestinationRangeToWorkspace(
                workspace,
                { cityId: "jp-tokyo", cityName: "Tokyo", countryName: "Japan" },
                ["2026-08-09", "2026-08-10"],
                { now: "2026-08-07T01:00:00.000Z" },
              );

              expect(next.days).toHaveLength(2);
              expect(next.days.map((day) => [day.date, day.cityId])).toEqual([
                ["2026-08-09", "jp-tokyo"],
                ["2026-08-10", "jp-tokyo"],
              ]);
            });

            it("does not duplicate an identical city and date", () => {
              const first = addDestinationRangeToWorkspace(
                null,
                { cityId: "jp-tokyo", cityName: "Tokyo", countryName: "Japan" },
                ["2026-08-09", "2026-08-10"],
                { now: "2026-08-07T01:00:00.000Z" },
              );
              const second = addDestinationRangeToWorkspace(
                first,
                { cityId: "jp-tokyo", cityName: "Tokyo", countryName: "Japan" },
                ["2026-08-09", "2026-08-10"],
                { now: "2026-08-07T02:00:00.000Z" },
              );

              expect(second.days).toHaveLength(2);
            });

            it("preserves an existing itinerary when another weather destination is added", () => {
              const base = addDestinationRangeToWorkspace(
                null,
                { cityId: "kr-seoul", cityName: "Seoul", countryName: "South Korea" },
                ["2026-08-08"],
                { now: "2026-08-07T00:00:00.000Z", blankTitle: "Asia trip" },
              );
              const next = addDestinationRangeToWorkspace(
                base,
                { cityId: "jp-tokyo", cityName: "Tokyo", countryName: "Japan" },
                ["2026-08-09", "2026-08-10"],
                { now: "2026-08-07T01:00:00.000Z" },
              );

              expect(next.title).toBe("Asia trip");
              expect(next.days.map((day) => day.cityId)).toEqual([
                "kr-seoul",
                "jp-tokyo",
                "jp-tokyo",
              ]);
            });
          });
          ''').lstrip())

          Path("apps/web/src/components/discovery-trip-action.test.ts").write_text(dedent(r'''
          import { readFileSync } from "node:fs";
