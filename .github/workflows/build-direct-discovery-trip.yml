name: Build direct discovery-to-trip UX

on:
  push:
    branches:
      - agent/direct-discovery-trip
    paths:
      - .github/direct-discovery-trip-trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-discovery-trip
          fetch-depth: 0

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply direct discovery-to-trip UX
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          Path("apps/web/src/trips/add-destination.ts").write_text(dedent(r'''
          import {
            createBlankWorkspace,
            normalizeWorkspace,
            type TripWorkspace,
            type TripWorkspaceDay,
          } from "./workspace";

          export interface TripDestinationIdentity {
            readonly cityId: string;
            readonly cityName: string;
            readonly countryName: string;
          }

          export interface TripDestinationInput extends TripDestinationIdentity {
            readonly date: string;
          }

          interface AddDestinationOptions {
            readonly now?: string;
            readonly blankTitle?: string;
          }

          function isBlankDay(day: TripWorkspaceDay): boolean {
            return day.cityId.length === 0 && day.activities.length === 0 && day.notes.length === 0;
          }

          function isIsoDate(value: string): boolean {
            return /^\d{4}-\d{2}-\d{2}$/u.test(value) && !Number.isNaN(Date.parse(`${value}T00:00:00Z`));
          }

          function blankDay(dayNumber: number, date: string): TripWorkspaceDay {
            return {
              id: `day-${Date.now().toString(36)}-${dayNumber}`,
              dayNumber,
              date,
              cityId: "",
              cityName: "",
              countryName: "",
              theme: "city",
              flexible: true,
              activities: [],
              notes: "",
            };
          }

          function withDestination(
            day: TripWorkspaceDay,
            dayNumber: number,
            date: string,
            destination: TripDestinationIdentity,
          ): TripWorkspaceDay {
            return {
              ...day,
              dayNumber,
              date,
              cityId: destination.cityId,
              cityName: destination.cityName,
              countryName: destination.countryName,
              theme: "city",
              flexible: true,
            };
          }

          /**
           * Add a weather-qualified destination for every selected travel date.
           * Existing itinerary content is preserved and an identical city/date pair is never duplicated.
           */
          export function addDestinationRangeToWorkspace(
            workspace: TripWorkspace | null,
            destination: TripDestinationIdentity,
            dates: ReadonlyArray<string>,
            options: AddDestinationOptions = {},
          ): TripWorkspace {
            const now = options.now ?? new Date().toISOString();
            const current =
              workspace ??
              createBlankWorkspace({ now, title: options.blankTitle ?? "My weather-aware trip" });
            const uniqueDates = [...new Set(dates.filter(isIsoDate))].slice(0, 16);
            if (uniqueDates.length === 0) return current;

            const days = [...current.days];
            for (const date of uniqueDates) {
              if (days.some((day) => day.cityId === destination.cityId && day.date === date)) continue;

              const reusableIndex = days.findIndex(
                (day) => isBlankDay(day) && (days.length === 1 || day.date === date),
              );
              if (reusableIndex >= 0) {
                const reusable = days[reusableIndex];
                if (reusable !== undefined) {
                  days[reusableIndex] = withDestination(
                    reusable,
                    reusableIndex + 1,
                    date,
                    destination,
                  );
                  continue;
                }
              }

              if (days.length >= 16) break;
              const dayNumber = days.length + 1;
              days.push(withDestination(blankDay(dayNumber, date), dayNumber, date, destination));
            }

            const normalizedDays = days.map((day, index) => ({ ...day, dayNumber: index + 1 }));
            return normalizeWorkspace({ ...current, days: normalizedDays, updatedAt: now }, now);
          }

          /** Add one destination day while preserving the existing public API. */
          export function addDestinationToWorkspace(
            workspace: TripWorkspace | null,
            destination: TripDestinationInput,
            options: AddDestinationOptions = {},
          ): TripWorkspace {
            return addDestinationRangeToWorkspace(
              workspace,
              {
                cityId: destination.cityId,
                cityName: destination.cityName,
                countryName: destination.countryName,
              },
              [destination.date],
              options,
            );
          }
          ''').lstrip())

          Path("apps/web/src/components/DiscoveryTripAction.tsx").write_text(dedent(r'''
          "use client";

          import { useState, type ReactElement } from "react";
          import { addDestinationRangeToWorkspace } from "../trips/add-destination";
          import {
            TRIP_WORKSPACE_STORAGE_KEY,
            normalizeWorkspace,
            type TripWorkspace,
          } from "../trips/workspace";

          export type DiscoveryTripLocale = "en" | "zh-cn" | "zh-hant";

          interface DiscoveryTripActionProps {
            readonly locale: DiscoveryTripLocale;
            readonly cityId: string;
            readonly cityName: string;
            readonly countryName: string;
            readonly dates: ReadonlyArray<string>;
            readonly workspacePath: string;
            readonly variant?: "inspector" | "card";
          }

          const COPY = {
            en: {
              add: (days: number) => (days > 1 ? `Add ${days} days to trip` : "Add to trip"),
              added: "Added to trip",
              view: "View trip",
              title: "My weather-aware trip",
            },
            "zh-cn": {
              add: (days: number) => (days > 1 ? `加入行程（${days}天）` : "加入行程"),
              added: "已加入行程",
              view: "查看行程",
              title: "我的天气行程",
            },
            "zh-hant": {
              add: (days: number) => (days > 1 ? `加入行程（${days}天）` : "加入行程"),
              added: "已加入行程",
              view: "查看行程",
              title: "我的天氣行程",
            },
          } as const;

          function readWorkspace(): TripWorkspace | null {
            const stored = window.localStorage.getItem(TRIP_WORKSPACE_STORAGE_KEY);
            if (stored === null) return null;
            try {
              return normalizeWorkspace(JSON.parse(stored) as unknown);
            } catch {
              return null;
            }
          }

          export function DiscoveryTripAction({
            locale,
            cityId,
            cityName,
            countryName,
            dates,
            workspacePath,
            variant = "card",
          }: DiscoveryTripActionProps): ReactElement {
            const copy = COPY[locale];
            const validDates = [
              ...new Set(dates.filter((date) => /^\d{4}-\d{2}-\d{2}$/u.test(date))),
            ];
            const [added, setAdded] = useState(false);

            const addToTrip = (): void => {
              if (validDates.length === 0) return;
              const next = addDestinationRangeToWorkspace(
                readWorkspace(),
                { cityId, cityName, countryName },
                validDates,
                { blankTitle: copy.title },
              );
              window.localStorage.setItem(TRIP_WORKSPACE_STORAGE_KEY, JSON.stringify(next));
              setAdded(true);
            };

            const buttonClass =
              variant === "inspector"
                ? "inline-flex min-h-11 flex-1 items-center justify-center rounded-full bg-white px-4 text-xs font-bold text-foreground transition hover:bg-white/90 focus-ring disabled:opacity-50"
                : "inline-flex min-h-11 flex-1 items-center justify-center px-4 py-2 text-xs font-bold text-foreground transition-colors hover:bg-surface-elevated focus-ring disabled:opacity-50";
            const viewClass =
              variant === "inspector"
                ? "inline-flex min-h-11 items-center justify-center rounded-full border border-white/20 px-4 text-xs font-bold text-white transition hover:bg-white/10 focus-ring"
                : "inline-flex min-h-11 items-center justify-center border-l border-border/80 px-4 py-2 text-xs font-bold text-primary transition-colors hover:bg-surface-elevated focus-ring";

            return (
              <div
                className={
                  variant === "inspector"
                    ? "mt-4 flex items-center gap-2 border-t border-white/10 pt-4"
                    : "flex border-t border-border/80"
                }
              >
                <button
                  type="button"
                  className={buttonClass}
                  disabled={validDates.length === 0}
                  onClick={addToTrip}
                  aria-label={`${copy.add(validDates.length)} · ${cityName}`}
                >
                  {added ? copy.added : copy.add(validDates.length)}
                </button>
                {added ? (
                  <a href={workspacePath} className={viewClass}>
                    {copy.view} <span aria-hidden="true">→</span>
                  </a>
                ) : null}
              </div>
            );
          }
          ''').lstrip())

          replace(
