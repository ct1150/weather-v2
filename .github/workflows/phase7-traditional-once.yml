name: Phase 7 traditional activity once

on:
  push:
    branches: [feature/activity-intelligence-phase7]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-intelligence-phase7
          fetch-depth: 0
      - name: Patch structured activity localization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/trips/traditional.ts')
          text = path.read_text()
          old = '''      activities: day.activities.map(toTraditionalText),\n      notes: toTraditionalText(day.notes),\n'''
          new = '''      activities: day.activities.map(toTraditionalText),\n      activityItems: day.activityItems?.map((activity) => ({\n        ...activity,\n        title: toTraditionalText(activity.title),\n        alternatives: activity.alternatives.map(toTraditionalText),\n        notes: toTraditionalText(activity.notes),\n      })),\n      notes: toTraditionalText(day.notes),\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/phase7-traditional-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(activity): localize structured activities in zh-hant"
          git push origin HEAD:feature/activity-intelligence-phase7
