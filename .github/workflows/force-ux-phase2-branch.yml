name: Force UX phase 2 branch

on:
  push:
    branches: [main]
    paths:
      - .github/ux-phase2-force-trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-phase2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply idempotent phase 2 transforms
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              before = p.read_text()
              after = fn(before)
              p.write_text(after)

          def explorer_transform(text):
              if "function cityDetailHref" not in text:
                  anchor = "\n  return (\n    <section"
                  helper = '''\n  function cityDetailHref(path: string): string {\n    const selectedDays = referenceDays(cities, selectedIndices);\n    const start = selectedDays[0]?.localDate;\n    if (start === undefined) return path;\n    const end = selectedDays.at(-1)?.localDate ?? start;\n    const params = new URLSearchParams({ start, end });\n    if (customRange === null) params.set("window", activeWindow);\n    return `${path}?${params.toString()}`;\n  }\n'''
                  text = text.replace(anchor, helper + anchor, 1)
              text = text.replace("href={selected.city.path}", "href={cityDetailHref(selected.city.path)}")
              text = text.replace("href={summary.city.path}", "href={cityDetailHref(summary.city.path)}")
              return text

          edit("apps/web/src/components/CountryWeatherExplorer.tsx", explorer_transform)
          edit("apps/web/src/components/TraditionalCountryWeatherExplorer.tsx", explorer_transform)

          def english_city(text):
              if "CityTripBridge" not in text:
                  text = text.replace(
                      'import { JsonLd } from "../../../components/JsonLd";',
                      'import { JsonLd } from "../../../components/JsonLd";\nimport { CityTripBridge } from "../../../components/CityTripBridge";',
                      1,
                  )
                  anchor = '\n      <div className="mt-10 grid gap-5 md:grid-cols-2">'
                  bridge = '''\n      <CityTripBridge\n        locale="en"\n        cityId={city.cityId}\n        cityName={city.cityName}\n        countryName={city.countryName}\n        defaultDate={localDates[0] ?? ""}\n        workspacePath="/trips/workspace"\n      />\n'''
                  text = text.replace(anchor, bridge + anchor, 1)
              return text

          edit("apps/web/src/app/[countrySlug]/[citySlug]/page.tsx", english_city)

          def chinese_city(text):
              if "CityTripBridge" not in text:
                  text = text.replace(
                      'import { JsonLd } from "./JsonLd";',
                      'import { JsonLd } from "./JsonLd";\nimport { CityTripBridge } from "./CityTripBridge";',
                      1,
                  )
                  anchor = '\n      <div className="mt-10 grid gap-5 md:grid-cols-2">'
                  bridge = '''\n      <CityTripBridge\n        locale={locale}\n        cityId={city.cityId}\n        cityName={city.cityName}\n        countryName={city.countryName}\n        defaultDate={localDates[0] ?? ""}\n        workspacePath={`${localePrefix}/trips/workspace`}\n      />\n'''
                  text = text.replace(anchor, bridge + anchor, 1)
              return text

          edit("apps/web/src/components/ChineseCityWeatherPage.tsx", chinese_city)

          def tests(text):
              text = text.replace('"/jp/tokyo",', '"/jp/tokyo?start=2026-08-04&end=2026-08-04&window=today",', 1)
              text = text.replace('"/jp/osaka",', '"/jp/osaka?start=2026-08-04&end=2026-08-04&window=today",', 1)
              text = text.replace('"/jp/sapporo",', '"/jp/sapporo?start=2026-08-04&end=2026-08-04&window=today",', 1)
              return text

          edit("apps/web/src/components/country-weather-explorer.test.tsx", tests)
          PY

          rm -f .github/workflows/ux-phase2-once.yml .github/ux-phase2-trigger
          pnpm exec prettier --write \
            apps/web/src/trips/add-destination.ts \
            apps/web/src/trips/add-destination.test.ts \
            apps/web/src/components/CityTripBridge.tsx \
            apps/web/src/components/CountryWeatherExplorer.tsx \
            apps/web/src/components/TraditionalCountryWeatherExplorer.tsx \
            apps/web/src/components/ChineseCityWeatherPage.tsx \
            'apps/web/src/app/[countrySlug]/[citySlug]/page.tsx' \
            apps/web/src/components/country-weather-explorer.test.tsx
      - name: Commit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat(ux): connect weather discovery to trip planning"
          git pull --rebase origin agent/ux-phase2
          git push origin HEAD:agent/ux-phase2
