name: Phase 4 prepare once

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    if: "github.event.issue.title == 'internal: phase4 prepare'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upgrade Trip API test fixtures to migration 0004
        run: |
          find workers/trip-api/src -name '*.test.ts' -print0 | xargs -0 sed -i 's/"0003_collaboration.sql"\]/"0003_collaboration.sql", "0004_collaboration_intelligence.sql"\]/g'
      - name: Format Phase 4 and touched Trip API tests
        run: |
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-08-08-cloud-trip-phase4-collaboration-intelligence.md \
            workers/trip-api/migrations/0004_collaboration_intelligence.sql \
            workers/trip-api/src/collaboration-intelligence.ts \
            workers/trip-api/src/collaboration-intelligence-routes.ts \
            workers/trip-api/src/collaboration-intelligence-migration.test.ts \
            workers/trip-api/src/revision-diff.ts \
            workers/trip-api/src/store.ts \
            workers/trip-api/src/revisions.ts \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/phase4.test.ts \
            workers/trip-api/src/*.test.ts \
            apps/web/src/trips/cloud-sync.ts \
            apps/web/src/components/TripCollaborationPanel.tsx \
            apps/web/src/components/CloudTripControls.tsx \
            apps/web/src/components/cloud-trip-phase4-contract.test.ts
      - name: Commit preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-08-cloud-trip-phase4-collaboration-intelligence.md workers/trip-api apps/web/src/trips/cloud-sync.ts apps/web/src/components/TripCollaborationPanel.tsx apps/web/src/components/CloudTripControls.tsx apps/web/src/components/cloud-trip-phase4-contract.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-trip): prepare phase 4 verification [skip ci]"
            git push origin HEAD:feature/cloud-trip-phase4
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Phase 4 preparation completed.' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned' });
