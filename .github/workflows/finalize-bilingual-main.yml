name: Finalize bilingual main once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main

      - name: Install dependencies
        working-directory: repo
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm install --frozen-lockfile

      - name: Format bilingual files
        working-directory: repo
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/seo.ts \
            apps/web/src/app/zh-hant/trips/new/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/components/LocalizedTripWorkspace.tsx \
            apps/web/src/components/SiteHeader.tsx

      - name: Run quality gates
        working-directory: repo
        run: |
          pnpm format:check
          pnpm lint
          pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
          pnpm typecheck
          pnpm test 2>&1 | tee test-results.log
          if grep -qiE "Tests +[0-9]+ failed|Test Files +[0-9]+ failed|FAIL " test-results.log; then
            exit 1
          fi
          pnpm docs:check

      - name: Run production builds
        working-directory: repo
        env:
          APP_BASE_URL: https://868656.xyz
          WEATHER_PRIMARY_PROVIDER: open-meteo
        run: |
          pnpm --filter @wnr/web build
          pnpm --filter @wnr/weather-sync build
          pnpm --filter @wnr/weather-read build
          node --test tooling/deploy/pipeline-contract.test.mjs

      - name: Commit validated formatting
        working-directory: repo
        run: |
          rm ../repo/.github/workflows/finalize-bilingual-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(i18n): validate and format bilingual release [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
