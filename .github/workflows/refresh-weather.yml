name: Refresh weather pages

on:
  schedule:
    # Runtime weather remains fresh through weather-sync/weather-read. Rebuild the
    # static/SEO shell once per day to keep hosted-runner usage bounded.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-weather-pages
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.11.0"
  NODE_VERSION: "22"
  CLOUDFLARE_ACCOUNT_ID: "b266970852cbc371061c94c5b1fe76a9"
  WEATHER_PRIMARY_PROVIDER: "open-meteo"

jobs:
  refresh:
    # Scheduled runs use the default branch. Manual refreshes are allowed only
    # from main so a feature branch can never publish static production pages.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build

      - name: Bake latest real forecast
        env:
          APP_BASE_URL: https://868656.xyz
          NEXT_PUBLIC_TRIP_API_URL: https://trip.868656.xyz
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_ENABLED }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_PRODUCT_ANALYTICS_URL: https://analytics.868656.xyz/api/v1/product-events
        run: pnpm --filter @wnr/web build

      - name: Verify weather decision artifact
        run: |
          grep -q 'peak rain chance' apps/web/out/jp.html
          grep -q 'Forecast data by' apps/web/out/jp.html
          grep -q 'Open-Meteo' apps/web/out/jp.html

      - name: Publish refreshed pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @wnr/web exec wrangler pages deploy out --project-name where-not-rain --branch main

      - name: Smoke refreshed production pages
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --retry 2 \
              "https://868656.xyz/jp" -o /tmp/weather-en.html \
              && curl --fail --silent --show-error --location --retry 2 \
              "https://868656.xyz/zh-cn/jp" -o /tmp/weather-cn.html \
              && curl --fail --silent --show-error --location --retry 2 \
              "https://868656.xyz/zh-hant/jp" -o /tmp/weather-hant.html \
              && grep -Fq "Forecast data by" /tmp/weather-en.html \
              && grep -Fq "Open-Meteo" /tmp/weather-en.html \
              && grep -Fq "日本" /tmp/weather-cn.html \
              && grep -Fq "日本" /tmp/weather-hant.html; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Refreshed production weather pages did not become healthy"
          exit 1
