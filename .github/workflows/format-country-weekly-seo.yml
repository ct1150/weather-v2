name: Format country weekly SEO

on:
  push:
    branches: [seo/country-weekly-weather]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/country-weekly-weather
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and self-clean
        run: |
          pnpm exec prettier --write apps/web/src/components/CountryBestWeatherThisWeekPage.tsx apps/web/src/seo/country-weekly-weather-ranking.ts
          rm .github/workflows/format-country-weekly-seo.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format country weekly SEO files"
          git push origin HEAD:seo/country-weekly-weather
