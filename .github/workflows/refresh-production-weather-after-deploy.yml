name: Refresh production weather after deploy

on:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: post-deploy-production-weather-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNC_URL: https://where-not-rain-sync-production.ct1150.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Wait for deployed Open-Meteo Worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --location \
              --output /tmp/weather-sync-health.json \
              --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 15 \
              "${SYNC_URL}/health" || true)"
            if [ "$status" = "200" ] \
              && grep -Fq '"ok":true' /tmp/weather-sync-health.json \
              && grep -Fq '"provider":"open-meteo"' /tmp/weather-sync-health.json; then
              cat /tmp/weather-sync-health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production weather-sync did not expose provider=open-meteo after Deploy"
          cat /tmp/weather-sync-health.json 2>/dev/null || true
          exit 1

      - name: Refresh production weather after propagation
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          SYNC_TRIGGER_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --request POST \
            --header "authorization: Bearer ${SYNC_TRIGGER_TOKEN}" \
            --connect-timeout 15 --max-time 240 \
            "${SYNC_URL}/internal/sync" \
            -o /tmp/post-deploy-production-sync.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync('/tmp/post-deploy-production-sync.json', 'utf8'),
          );
          console.log(
            'post-deploy weather refresh',
            JSON.stringify({
              status: report.status,
              snapshotId: report.snapshotId,
              activated: report.activated,
              citiesProcessed: report.citiesProcessed,
              cityFailures: report.cityFailures,
            }),
          );
          if (report.activated !== true) process.exit(1);
          NODE
