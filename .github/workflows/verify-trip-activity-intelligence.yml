name: Verify trip activity intelligence

on:
  pull_request:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: phase7-activity-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Phase 7 preview Worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              "https://where-not-rain-trip-preview.ct1150.workers.dev/health" \
              | grep -Fq '"workspaceV2":true'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Phase 7 preview Worker did not become ready"
          exit 1
      - name: Verify Phase 7 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/trip-activity-intelligence-smoke.mjs \
            --trip-url "https://where-not-rain-trip-preview.ct1150.workers.dev" \
            --suffix preview

  production:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Phase 7 production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SMOKE_TOKEN="$(printf 'wnr-trip-smoke:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          TRIP_SMOKE_TOKEN="$SMOKE_TOKEN" node tooling/deploy/trip-activity-intelligence-smoke.mjs \
            --trip-url "https://trip.868656.xyz" \
            --suffix production
      - name: Record Phase 7 production verification
        env:
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > PHASE7_ACTIVITY_SMOKE_STATUS.md <<EOF
          # Phase 7 Activity Intelligence smoke status

          - Conclusion: success
          - Deploy head SHA: ${DEPLOY_HEAD_SHA}
          - Deploy run: ${DEPLOY_RUN_URL}
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Checks

          - Phase 7 health capabilities: success
          - Workspace v2 Cloud Trip create: success
          - Structured activity persistence: success
          - Workspace v2 Cloud Trip update: success
          - Revision history: success
          - Structured `day.activityItems` revision diff: success
          - Malformed structured activity rejected: success
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE7_ACTIVITY_SMOKE_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(smoke): record phase 7 activity verification [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
