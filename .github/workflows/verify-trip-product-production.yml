name: Verify trip product production

on:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: write

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify production pages and APIs
        run: |
          set -uo pipefail
          RESULT=success
          TODAY=$(date -u +%F)
          WEEK_END=$(date -u -d '+6 days' +%F)
          : > /tmp/checks.md

          record() {
            NAME="$1"
            STATUS="$2"
            echo "- ${NAME}: ${STATUS}" >> /tmp/checks.md
            if [ "${STATUS}" != "success" ]; then
              RESULT=failure
            fi
          }

          fetch_and_match() {
            NAME="$1"
            URL="$2"
            OUTPUT="$3"
            shift 3
            if ! curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --connect-timeout 15 --max-time 45 "${URL}" -o "${OUTPUT}"; then
              record "${NAME}" "failure (request)"
              return
            fi
            for TEXT in "$@"; do
              if ! grep -Fq "${TEXT}" "${OUTPUT}"; then
                record "${NAME}" "failure (missing: ${TEXT})"
                return
              fi
            done
            record "${NAME}" success
          }

          fetch_and_match \
            "English landing" \
            "https://868656.xyz/trips" \
            /tmp/trips.html \
            "Know what to keep" Tokyo Bangkok Seoul "Import existing itinerary"

          fetch_and_match \
            "English import route" \
            "https://868656.xyz/trips/new" \
            /tmp/trips-new.html \
            "Turn your existing plan into a weather-aware workspace" "Paste the itinerary you already have"

          fetch_and_match \
            "English workspace route" \
            "https://868656.xyz/trips/workspace" \
            /tmp/workspace.html \
            "Opening your trip workspace"

          fetch_and_match \
            "English country direct trip action" \
            "https://868656.xyz/jp" \
            /tmp/weather-en-country.html \
            "Japan" 'data-direct-trip-action="enabled"'

          fetch_and_match \
            "Traditional landing" \
            "https://868656.xyz/zh-hant/trips" \
            /tmp/trips-hant.html \
            "天氣變化時" "東京" "曼谷" "首爾" "匯入現有行程"

          fetch_and_match \
            "Traditional import route" \
            "https://868656.xyz/zh-hant/trips/new" \
            /tmp/trips-new-hant.html \
            "行程匯入器" "貼上已經整理好的旅行行程"

          fetch_and_match \
            "Traditional workspace route" \
            "https://868656.xyz/zh-hant/trips/workspace" \
            /tmp/workspace-hant.html \
            "正在開啟你的行程工作台"

          fetch_and_match \
            "Traditional weather radar" \
            "https://868656.xyz/zh-hant" \
            /tmp/weather-hant.html \
            "亞洲旅行天氣雷達" "先看天氣，再決定去哪個城市" "日本"

          fetch_and_match \
            "Traditional country weather route" \
            "https://868656.xyz/zh-hant/jp" \
            /tmp/weather-hant-country.html \
            "國家旅行天氣地圖" "地圖上比較全部旅遊城市" "日本" 'data-direct-trip-action="enabled"'

          fetch_and_match \
            "Traditional city weather route" \
            "https://868656.xyz/zh-hant/jp/tokyo" \
            /tmp/weather-hant-city.html \
            "目的地天氣" "7 天旅行天氣" "東京" "把天氣結論帶進行程"

          fetch_and_match \
            "Simplified landing" \
            "https://868656.xyz/zh-cn/trips" \
            /tmp/trips-cn.html \
            "天气变化时" "东京" "曼谷" "首尔" "导入现有行程"

          fetch_and_match \
            "Simplified import route" \
            "https://868656.xyz/zh-cn/trips/new" \
            /tmp/trips-new-cn.html \
            "把你现有的计划直接变成天气行程工作台" "粘贴已经整理好的旅行行程"

          fetch_and_match \
            "Simplified country weather route" \
            "https://868656.xyz/zh-cn/jp" \
            /tmp/weather-cn-country.html \
            "国家旅行天气地图" "地图上比较全部旅游城市" "日本" 'data-direct-trip-action="enabled"'

          fetch_and_match \
            "Simplified city weather route" \
            "https://868656.xyz/zh-cn/jp/tokyo" \
            /tmp/weather-cn-city.html \
            "目的地天气" "7 天旅行天气" "东京" "把天气结论带进行程"

          fetch_and_match \
            "English city-to-trip bridge" \
            "https://868656.xyz/jp/tokyo" \
            /tmp/weather-en-city.html \
            "Tokyo" "Use this weather in your itinerary"

          fetch_and_match \
            "Trip cities API" \
            "https://where-not-rain-read-production.ct1150.workers.dev/api/v1/trip-cities?locale=en" \
            /tmp/cities.json \
            jp-tokyo th-phuket kr-busan

          fetch_and_match \
            "Protected sync health" \
            "https://where-not-rain-sync-production.ct1150.workers.dev/health" \
            /tmp/sync-health.json \
            '"manualTriggerProtected":true'

          SYNC_STATUS=$(curl --silent --output /tmp/sync-anonymous.json --write-out '%{http_code}' \
            --request POST \
            "https://where-not-rain-sync-production.ct1150.workers.dev/internal/sync")
          if [ "${SYNC_STATUS}" = "401" ]; then
            record "Anonymous sync rejected" success
          else
            record "Anonymous sync rejected" "failure (HTTP ${SYNC_STATUS})"
          fi

          fetch_and_match \
            "Trip forecast API" \
            "https://where-not-rain-read-production.ct1150.workers.dev/api/v1/trip-forecast?cityIds=jp-tokyo&from=${TODAY}&to=${WEEK_END}&locale=en" \
            /tmp/forecast.json \
            jp-tokyo temperatureMaxC

          cat > PRODUCT_SMOKE_STATUS.md <<EOF
          # Production product smoke status

          - Conclusion: ${RESULT}
          - Deploy head SHA: ${{ github.event.workflow_run.head_sha }}
          - Deploy run: ${{ github.event.workflow_run.html_url }}
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Checks

          $(cat /tmp/checks.md)
          EOF

      - name: Record production verification status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRODUCT_SMOKE_STATUS.md
          git commit -m "chore(smoke): record production verification [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when production smoke failed
        run: |
          grep -Fq -- '- Conclusion: success' PRODUCT_SMOKE_STATUS.md
