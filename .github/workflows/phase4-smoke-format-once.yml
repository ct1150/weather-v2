name: Phase 4 smoke format once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/phase4-smoke-format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-smoke-format
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format trusted Phase 4 smoke runner
        run: |
          pnpm exec prettier --write tooling/deploy/trip-collaboration-intelligence-smoke.mjs
          git rm .github/workflows/phase4-smoke-format-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(cloud-trip): format phase 4 smoke runner [skip ci]"
          git push origin HEAD:fix/phase4-smoke-format
