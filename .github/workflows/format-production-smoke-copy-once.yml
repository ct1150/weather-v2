name: Format production smoke copy once

on:
  push:
    branches:
      - fix/production-smoke-group-decision-copy
    paths:
      - .github/workflows/format-production-smoke-copy-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-smoke-group-decision-copy

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: pnpm exec prettier --write apps/web/src/components/production-smoke-copy-contract.test.ts

      - name: Commit formatted file and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-production-smoke-copy-once.yml
          git add apps/web/src/components/production-smoke-copy-contract.test.ts
          git commit -m "style: format production smoke copy contract"
          git push origin HEAD:fix/production-smoke-group-decision-copy
