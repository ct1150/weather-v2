name: Patch country compare integration v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/country-map-compare
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply integration patch
        run: |
          python .github/scripts/patch-country-compare.py
          pnpm exec prettier --write apps/web/src/components/InstantCountryWeatherExplorer.tsx apps/web/src/components/CountryCompareSheet.tsx apps/web/src/components/country-weather-explorer.test.tsx
          rm .github/workflows/patch-country-compare.yml
          rm .github/workflows/patch-country-compare-v2.yml
          rm .github/scripts/patch-country-compare.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: compare country map destinations"
          git push origin HEAD:feat/country-map-compare
