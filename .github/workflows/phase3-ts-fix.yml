name: Phase 3 type fix once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: "github.event.issue.title == 'internal: phase3 type fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch D1 batch result guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('workers/trip-api/src/store.ts')
          text = path.read_text()
          old = '''  const [updated] = await db.batch([\n'''
          new = '''  const results = await db.batch([\n'''
          if text.count(old) != 1:
              raise SystemExit('expected batch declaration once')
          text = text.replace(old, new, 1)
          old = '''  ]);\n\n  if ((updated.meta.changes ?? 0) > 0) {\n'''
          new = '''  ]);\n  const updated = results[0];\n\n  if (updated !== undefined && (updated.meta.changes ?? 0) > 0) {\n'''
          if text.count(old) != 1:
              raise SystemExit('expected batch result check once')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write workers/trip-api/src/store.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/trip-api/src/store.ts
          git commit -m "fix(cloud-trip): guard D1 batch update result [skip ci]"
          git push origin HEAD:feature/cloud-trip-phase3
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Phase 3 type fix completed.' });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'not_planned' });
