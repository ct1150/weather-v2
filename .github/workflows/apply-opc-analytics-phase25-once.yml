# Temporary export job for PR #63. The product implementation already passed
# focused verification. This job reconstructs the validated workflow files in a
# clean main worktree and uploads them for the GitHub app to apply.
name: Export OPC analytics Phase 2.5 workflows

on:
  push:
    branches: [agent/opc-analytics-phase25-fix]

permissions:
  contents: read

concurrency:
  group: export-opc-analytics-phase25-workflows
  cancel-in-progress: true

jobs:
  export:
    if: contains(github.event.head_commit.message, 'chore: export validated Phase 2.5 workflows')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch history
        uses: actions/checkout@v4
        with:
          ref: agent/opc-analytics-phase25-fix
          fetch-depth: 0

      - name: Generate workflow files from clean main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/phase25-workflows origin/main

          restore_before_deletion() {
            local path="$1"
            local deletion_commit
            deletion_commit="$(git log -1 --format=%H -- "${path}")"
            git show "${deletion_commit}^:${path}" > "/tmp/phase25-workflows/${path}"
          }

          restore_before_deletion tooling/one-off/opc_analytics_phase25.py
          restore_before_deletion tooling/one-off/opc_analytics_phase25_patch.py
          restore_before_deletion tooling/one-off/pr-ci-standard-phase25.yml

          cd /tmp/phase25-workflows
          python tooling/one-off/opc_analytics_phase25_patch.py
          python tooling/one-off/opc_analytics_phase25.py

          mkdir -p /tmp/phase25-artifact
          cp .github/workflows/deploy.yml /tmp/phase25-artifact/deploy.yml
          cp .github/workflows/production-smoke.yml /tmp/phase25-artifact/production-smoke.yml
          cp .github/workflows/refresh-weather.yml /tmp/phase25-artifact/refresh-weather.yml
          cp tooling/one-off/pr-ci-standard-phase25.yml /tmp/phase25-artifact/pr-ci.yml

      - name: Upload validated workflow files
        uses: actions/upload-artifact@v4
        with:
          name: phase25-workflows
          path: /tmp/phase25-artifact
          if-no-files-found: error
          retention-days: 1
