name: Diagnose production endpoints once

on:
  push:
    branches:
      - agent/trek-route-execution-layer
    paths:
      - .github/workflows/diagnose-production-endpoints-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/trek-route-execution-layer

      - name: Probe production endpoints independently
        shell: bash
        run: |
          set -u
          probe() {
            local name="$1"
            local url="$2"
            echo "===== ${name}: ${url} ====="
            rm -f /tmp/probe-headers /tmp/probe-body
            curl --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --dump-header /tmp/probe-headers \
              --output /tmp/probe-body \
              --write-out 'curl_exit=0 http=%{http_code} final=%{url_effective} remote_ip=%{remote_ip}\n' \
              "${url}"
            local curl_status=$?
            if [ "${curl_status}" -ne 0 ]; then
              echo "curl_exit=${curl_status}"
            fi
            echo "--- headers ---"
            test -f /tmp/probe-headers && sed -n '1,40p' /tmp/probe-headers || true
            echo "--- body ---"
            test -f /tmp/probe-body && head -c 1200 /tmp/probe-body || true
            echo
          }

          probe "site root" "https://868656.xyz/"
          probe "site execution" "https://868656.xyz/trips/execution"
          probe "trip custom-domain health" "https://trip.868656.xyz/health"
          probe "trip workers.dev health" "https://where-not-rain-trip-production.ct1150.workers.dev/health"
          probe "weather-read health" "https://where-not-rain-read-production.ct1150.workers.dev/health"
          probe "weather-read trip cities" "https://where-not-rain-read-production.ct1150.workers.dev/api/v1/trip-cities?locale=en"
          probe "weather-sync health" "https://where-not-rain-sync-production.ct1150.workers.dev/health"

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-production-endpoints-once.yml
          git commit -m "ci: remove one-shot production endpoint diagnostic"
          git push origin HEAD:agent/trek-route-execution-layer
