name: Phase 2 final format

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  format:
    if: github.event.issue.title == 'internal: phase2 final format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-trip-phase2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final Phase 2 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/MyTripsDashboard.tsx \
            apps/web/src/components/SharedTripViewer.tsx \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/index.test.ts \
            workers/trip-api/src/store.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/web/src/components/MyTripsDashboard.tsx \
              apps/web/src/components/SharedTripViewer.tsx \
              workers/trip-api/src/index.ts \
              workers/trip-api/src/index.test.ts \
              workers/trip-api/src/store.test.ts
            git commit -m "style(cloud-trip): format final phase 2 files [skip ci]"
            git push origin HEAD:feature/cloud-trip-phase2
          fi
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Phase 2 formatter completed."
