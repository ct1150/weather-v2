name: Phase 2 final format

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/cloud-trip-phase2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final Phase 2 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/MyTripsDashboard.tsx \
            apps/web/src/components/SharedTripViewer.tsx \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/index.test.ts \
            workers/trip-api/src/store.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/MyTripsDashboard.tsx \
            apps/web/src/components/SharedTripViewer.tsx \
            workers/trip-api/src/index.ts \
            workers/trip-api/src/index.test.ts \
            workers/trip-api/src/store.test.ts
          git commit -m "style(cloud-trip): format final phase 2 files [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
