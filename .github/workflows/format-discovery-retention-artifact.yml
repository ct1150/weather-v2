name: Format discovery retention artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-discovery-retention-artifact.yml
      - apps/web/src/components/DiscoveryRetentionCompanion.tsx
      - apps/web/src/discovery/discovery-retention.ts

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/DiscoveryRetentionCompanion.tsx \
            apps/web/src/discovery/discovery-retention.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: discovery-retention-formatted
          path: |
            apps/web/src/components/DiscoveryRetentionCompanion.tsx
            apps/web/src/discovery/discovery-retention.ts
          if-no-files-found: error
          retention-days: 1
