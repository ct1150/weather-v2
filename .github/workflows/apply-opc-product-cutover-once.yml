# One-time branch workflow. It applies the Phase 0 OPC cutover, validates the
# focused surface, commits the result, then removes itself and the staging script.
name: Apply OPC product cutover once

on:
  push:
    branches: [fix/focus-discovery-on-dry]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat: complete OPC product cutover') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/focus-discovery-on-dry
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply product cutover
        run: python tooling/one-off/opc_product_cutover.py

      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            README.md \
            .github/workflows/production-smoke.yml \
            tooling/deploy/weather-discovery-smoke.mjs \
            packages/analytics/src/events.ts \
            packages/analytics/src/funnel-events.test.ts \
            apps/web/public/manifest.webmanifest \
            apps/web/src/app/layout.tsx \
            apps/web/src/app/page.tsx \
            apps/web/src/app/sitemap.ts \
            apps/web/src/app/travel-radar.test.ts \
            apps/web/src/app/discover/page.tsx \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/zh-cn/page.tsx \
            apps/web/src/app/zh-cn/discover/page.tsx \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/page.tsx \
            apps/web/src/app/zh-hant/discover/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/analytics/browser-events.ts \
            apps/web/src/components/SiteHeader.tsx \
            apps/web/src/components/WeatherDiscoveryPlannerV2.tsx \
            apps/web/src/components/group-decision-scope-contract.test.ts \
            apps/web/src/components/phase9-commercial-surface-contract.test.ts \
            apps/web/src/components/production-smoke-copy-contract.test.ts \
            apps/web/src/components/trip-execution-pwa-contract.test.ts \
            apps/web/src/components/ux-funnel-contract.test.ts \
            apps/web/src/components/weather-discovery-phase6-contract.test.ts \
            apps/web/src/discovery/weather-discovery.ts \
            apps/web/src/discovery/weather-discovery.test.ts \
            apps/web/src/e2e/critical-paths.test.ts \
            docs/superpowers/product/2026-08-19-founder-prd-opc-dry-destination-engine.md \
            docs/superpowers/plans/2026-08-19-opc-product-cutover-phase0.md

      - name: Build focused dependencies
        run: |
          pnpm --filter @wnr/analytics build
          pnpm --filter @wnr/web typecheck

      - name: Run focused regression suite
        run: |
          pnpm --filter @wnr/analytics exec vitest run src/funnel-events.test.ts
          pnpm --filter @wnr/web exec vitest run \
            src/discovery/weather-discovery.test.ts \
            src/components/weather-discovery-phase6-contract.test.ts \
            src/components/ux-funnel-contract.test.ts \
            src/components/group-decision-scope-contract.test.ts \
            src/components/production-smoke-copy-contract.test.ts \
            src/components/phase9-commercial-surface-contract.test.ts \
            src/app/travel-radar.test.ts \
            src/e2e/critical-paths.test.ts \
            src/components/trip-execution-pwa-contract.test.ts

      - name: Commit implementation and self-remove
        run: |
          git rm .github/workflows/apply-opc-product-cutover-once.yml
          git rm tooling/one-off/opc_product_cutover.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete OPC product cutover"
          git push origin HEAD:fix/focus-discovery-on-dry
