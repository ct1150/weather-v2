name: Apply UX funnel P0 once v3

on:
  push:
    branches:
      - agent/ux-funnel-p0
    paths:
      - .github/workflows/apply-ux-funnel-p0-once-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: agent/ux-funnel-p0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and run structural implementation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-ux-funnel-p0-once.yml").read_text(encoding="utf-8")
          lines = workflow.splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == "PY")
          prefix = len(lines[start]) - len(lines[start].lstrip())
          script = "\n".join(
              line[prefix:] if line.startswith(" " * prefix) else line
              for line in lines[start + 1 : end]
          ) + "\n"
          script = script.replace("import json\n", "import json\nimport re\n", 1)

          function_start = script.index("def replace_once(path: str, old: str, new: str) -> None:")
          function_end = script.index("\n\n# 1. Homepage", function_start)
          replacement = '''def whitespace_pattern(value: str) -> str:
              patterns = []
              for line in value.splitlines():
                  tokens = re.split(r"([ \\t]+)", line.strip())
                  patterns.append(
                      r"[ \\t]*"
                      + "".join(
                          r"[ \\t]+" if token and token.isspace() else re.escape(token)
                          for token in tokens
                      )
                  )
              return r"\\r?\\n".join(patterns)

          def fuzzy_replace_text(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) == 1:
                  return source.replace(old, new, 1)
              matches = list(re.finditer(whitespace_pattern(old), source))
              if len(matches) != 1:
                  raise SystemExit(f"expected one whitespace-tolerant marker for {label}; found {len(matches)}")
              match = matches[0]
              return source[: match.start()] + new + source[match.end() :]

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              write(path, fuzzy_replace_text(source, old, new, path))'''
          script = script[:function_start] + replacement + script[function_end:]

          wrapper_start = script.index("if compare.count(old_wrapper) != 1:")
          wrapper_end = script.index("\nold_closing = ", wrapper_start)
          wrapper_logic = '''compare = fuzzy_replace_text(
              compare,
              old_wrapper,
              '              <div className="mt-5 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">',
              "comparison wrapper",
          )'''
          script = script[:wrapper_start] + wrapper_logic + script[wrapper_end:]

          closing_start = script.index("if compare.count(old_closing) != 1:")
          closing_end = script.index("\nsource = source[:compare_start]", closing_start)
          closing_logic = '''compare = fuzzy_replace_text(
              compare,
              old_closing,
              ''' + "'''" + '''                  ))}
                </div>
              )}''' + "'''" + ''',
              "comparison closing",
          )'''
          script = script[:closing_start] + closing_logic + script[closing_end:]

          Path("/tmp/apply-ux-funnel.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/apply-ux-funnel.py

          pnpm exec prettier --write \
            apps/web/src/app/page.tsx \
            apps/web/src/app/zh-cn/page.tsx \
            apps/web/src/app/zh-hant/page.tsx \
            apps/web/src/components/SiteHeader.tsx \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/app/discover/page.tsx \
            apps/web/src/app/zh-cn/discover/page.tsx \
            apps/web/src/app/zh-hant/discover/page.tsx \
            apps/web/src/components/WeatherDiscoveryPlannerV2.tsx \
            apps/web/src/app/sitemap.ts \
            apps/web/public/manifest.webmanifest \
            apps/web/src/app/travel-radar.test.ts \
            apps/web/src/components/trip-execution-pwa-contract.test.ts \
            apps/web/src/components/ux-funnel-contract.test.ts

      - name: Validate focused UX contracts
        run: |
          pnpm --filter @wnr/web lint
          pnpm --filter @wnr/web exec vitest run \
            src/app/travel-radar.test.ts \
            src/components/trip-execution-pwa-contract.test.ts \
            src/components/ux-funnel-contract.test.ts

      - name: Validate production-equivalent static export
        env:
          APP_BASE_URL: https://868656.xyz
          NEXT_PUBLIC_TRIP_API_URL: https://trip.868656.xyz
        run: |
          pnpm -r --filter '!@wnr/web' --filter '!@wnr/weather-sync' --filter '!@wnr/maintenance' build
          pnpm --filter @wnr/web build
          grep -Fq "I haven't chosen a destination" apps/web/out/index.html
          grep -Fq "还没决定去哪" apps/web/out/zh-cn/index.html
          grep -Fq "還沒決定去哪" apps/web/out/zh-hant/index.html
          grep -Fq "Find the right destination" apps/web/out/discover.html
          grep -Fq "按天气找目的地" apps/web/out/zh-cn/discover.html
          grep -Fq "按天氣找目的地" apps/web/out/zh-hant/discover.html

      - name: Commit implementation and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-ux-funnel-p0-once.yml \
            .github/workflows/apply-ux-funnel-p0-once-v2.yml \
            .github/workflows/apply-ux-funnel-p0-once-v3.yml
          git add \
            apps/web/src/app/page.tsx \
            apps/web/src/app/zh-cn/page.tsx \
            apps/web/src/app/zh-hant/page.tsx \
            apps/web/src/components/SiteHeader.tsx \
            apps/web/src/app/trips/page.tsx \
            apps/web/src/app/zh-cn/trips/page.tsx \
            apps/web/src/app/zh-hant/trips/page.tsx \
            apps/web/src/app/discover/page.tsx \
            apps/web/src/app/zh-cn/discover/page.tsx \
            apps/web/src/app/zh-hant/discover/page.tsx \
            apps/web/src/components/WeatherDiscoveryPlannerV2.tsx \
            apps/web/src/app/sitemap.ts \
            apps/web/public/manifest.webmanifest \
            apps/web/src/app/travel-radar.test.ts \
            apps/web/src/components/trip-execution-pwa-contract.test.ts \
            apps/web/src/components/ux-funnel-contract.test.ts
          git commit -m "feat: optimize search-to-retention UX funnel"
          git push origin HEAD:agent/ux-funnel-p0
